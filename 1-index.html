function parseRows(t){return t.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>l.split(/\t|;|,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(c=>c.trim().replace(/^"|"$/g,'')))}
function doImport(){try{if(!ok(2))return;const k=$('it').value;let rows=parseRows($('ix').value);if(!rows.length)throw new Error('لا توجد بيانات');let n=0;
 if(k=='cu'||k=='su'){const ty=k=='cu'?'عميل':'مورد';rows.forEach(r=>{if(!r[0]||DB.parties.some(p=>p.name==r[0]&&p.type==ty))return;DB.parties.push({id:'Q'+(DB.parties.length+1)+'_'+Date.now()%10000+n,name:r[0],type:ty});n++})}
 else if(k=='it'){rows.forEach(r=>{if(!r[0]||DB.items.some(i=>i.name==r[0]))return;if(/^(اسم|name|الصنف)/i.test(r[0])&&n==0&&rows[0]===r)return;DB.items.push({id:'I'+String(DB.items.length+1).padStart(3,'0'),name:r[0],unit:r[1]||'وحدة',barcode:r[2]||'',price:+r[3]||0});n++})}
 else{const L=[];rows.forEach(r=>{const c=r[0];if(!acc(c))return;const d=+r[1]||0,cr=+r[2]||0;if(d||cr){L.push({acc:c,debit:d,credit:cr});n++}});if(!L.length)throw new Error('لا توجد أكواد حسابات صحيحة');const D=L.reduce((a,l)=>a+l.debit,0),C=L.reduce((a,l)=>a+l.credit,0);if(Math.abs(D-C)>0.005){ensureAcc('2990','أرصدة افتتاحية (تسوية)');L.push(D>C?{acc:'2990',credit:D-C}:{acc:'2990',debit:C-D})}
  addEntry(today(),'أرصدة افتتاحية (استيراد)','',L)}
 logA('استيراد '+n+' سطر ('+k+')');save();msg('تم استيراد '+n+' سطر',1)}catch(e){msg(e.message)}}

 $('main').innerHTML=`<div class="card"><h2>الموازنة والفعلي وربحية المشاريع</h2><div id="rb">${rows.length?table(['المشروع','قيمة العقد','الموازنة (تكلفة)','التكلفة الفعلية','المتبقي من الموازنة','% الصرف','الإيراد','الربح'],rows.map(r=>[esc(r.p.name),fmt(r.p.value),`<input type="number" value="${r.b||''}" style="width:110px" onchange="DB.budgets['${r.p.id}']=+this.value||0;logA('موازنة ${esc(r.p.name)}');save();R.bud()">`,fmt(r.cost),r.b?fmt(r.b-r.cost):'-',r.b?'<span style="color:'+(r.cost>r.b?'#c0392b':'#27ae60')+'">'+Math.round(r.cost/r.b*100)+'%</span>':'-',fmt(r.rev),fmt(r.rev-r.cost)]),[1,2,3,4,5,6,7]):'<p>لا توجد مشاريع</p>'}</div><p class="noprint"><button class="b l" onclick="printEl('rb')">طباعة / PDF</button></p></div>`};

R.wages=()=>{const W=DB.workers=DB.workers||[],L=DB.wlog=DB.wlog||[];
 const st=w=>{let e=0,a=0;L.filter(x=>x.w==w.id).forEach(x=>{if(x.k=='w')e+=x.amt;if(x.k=='a')a+=x.amt;if(x.k=='s'){e-=x.e;a-=x.a}});return{e,a,net:e-a}};
 const wo=W.map(w=>[w.id,w.name]);
 $('main').innerHTML=`<div class="card"><h2>عامل جديد</h2><div class="row"><div><label>الاسم</label><input id="wn"></div><div><label>اليومية</label><input id="wd" type="number"></div><div><button class="b g" onclick="addWorker()">إضافة</button></div></div></div>
 <div class="card"><h2>تسجيل يومية / سلفة / صرف</h2><div class="grid"><div><label>التاريخ</label><input id="wdt" type="date" value="${today()}"></div><div><label>العامل</label><select id="ww">${opts(wo,'')}</select></div><div><label>عدد الأيام</label><input id="wdy" type="number" step="0.5" value="1"></div><div><label>المشروع</label><select id="wp">${projOpts('— اختر —')}</select></div><div><label>الخزنة / البنك (للسلفة والصرف)</label><select id="wc">${accOpts('1901',a=>/^19/.test(a.code))}</select></div><div><label>مبلغ السلفة</label><input id="wa" type="number"></div></div>
 <p><button class="b g" onclick="wageDay()">تسجيل يوميات</button> <button class="b" onclick="wageAdv()">صرف سلفة</button> <button class="b" onclick="wageSettle()">تسوية وصرف الصافي</button></p><div id="msg"></div></div>
 <div class="card"><h2>كشف العمالة</h2>${W.length?table(['العامل','اليومية','المستحق','السلف','الصافي'],W.map(w=>{const s=st(w);return[esc(w.name),fmt(w.daily),fmt(s.e),fmt(s.a),fmt(s.net)]}),[1,2,3,4]):'<p>لا يوجد عمال</p>'}</div>`;window._wst=st};
function addWorker(){const n=$('wn').value.trim();if(!n)return msg('اكتب الاسم');DB.workers.push({id:'W'+Date.now(),name:n,daily:+$('wd').value||0});logA('عامل جديد '+n);save();R.wages()}
function wInit(){ensureAcc('1708','سلف عاملين');ensureAcc('2807','أجور مستحقة');ensureAcc('3201','أجور عمالة مباشرة')}
function wageDay(){try{if(!ok(2))return;wInit();const w=DB.workers.find(x=>x.id==$('ww').value);if(!w)throw new Error('اختر العامل');const p=$('wp').value;if(!p)throw new Error('اختر المشروع');const d=+$('wdy').value,amt=d*w.daily;if(!(amt>0))throw new Error('اليومية أو الأيام = 0');
 const e=addEntry($('wdt').value,'يومية عامل '+w.name+' ('+d+' يوم)','',[{acc:'3201',debit:amt,project:p},{acc:'2807',credit:amt}]);DB.wlog.push({k:'w',w:w.id,amt,date:$('wdt').value,e:e.id});save();R.wages();msg('تم التسجيل',1)}catch(e){msg(e.message)}}
function wageAdv(){try{if(!ok(2))return;wInit();const w=DB.workers.find(x=>x.id==$('ww').value),a=+$('wa').value;if(!w||!(a>0))throw new Error('اختر العامل واكتب المبلغ');
 const e=addEntry($('wdt').value,'سلفة عامل '+w.name,'',[{acc:'1708',debit:a},{acc:$('wc').value,credit:a}]);DB.wlog.push({k:'a',w:w.id,amt:a,date:$('wdt').value,e:e.id});save();R.wages();msg('تم صرف السلفة',1)}catch(e){msg(e.message)}}
function wageSettle(){try{if(!ok(2))return;wInit();const w=DB.workers.find(x=>x.id==$('ww').value);if(!w)throw new Error('اختر العامل');const s=_wst(w);if(!(s.e>0))throw new Error('لا يوجد مستحق');const ded=Math.min(s.a,s.e),net=s.e-ded;
 const L=[{acc:'2807',debit:s.e}];if(ded)L.push({acc:'1708',credit:ded});if(net)L.push({acc:$('wc').value,credit:net});const e=addEntry($('wdt').value,'تسوية أجور '+w.name,'',L);DB.wlog.push({k:'s',w:w.id,e:s.e,a:ded,date:$('wdt').value,en:e.id});save();R.wages();msg('تمت التسوية: صافي مصروف '+fmt(net),1)}catch(e){msg(e.message)}}

let CART=[];
R.pos=()=>{const its=DB.items;$('main').innerHTML=`<div class="card"><h2>نقطة البيع</h2><div class="row"><div style="flex:2"><label>الباركود (اضغط Enter)</label><input id="bc" onkeydown="if(event.key=='Enter'){posScan(this.value);this.value=''}" autofocus></div><div><label>العميل (اختياري)</label><select id="pc2">${partyOpts('عميل','— نقدي —')}</select></div><div><label>الدفع</label><select id="pm">${accOpts('1901',a=>/^19/.test(a.code))}</select></div></div>
 <div class="apps" style="margin:10px 0">${its.filter(i=>i.price).map(i=>`<a class="app" onclick="posAdd('${i.id}')"><span style="font-weight:700">${esc(i.name)}</span><span>${fmt(i.price)}</span></a>`).join('')||'<p>أضف أصنافاً بسعر بيع من الأسفل أو من استيراد Excel</p>'}</div>
 <div id="cart"></div></div>
 <div class="card"><h2>إضافة صنف سريع</h2><div class="row"><div><label>الاسم</label><input id="pn1"></div><div><label>الوحدة</label><input id="pu1" value="قطعة"></div><div><label>الباركود</label><input id="pb1"></div><div><label>سعر البيع</label><input id="pp1" type="number"></div><div><button class="b g" onclick="posNew()">حفظ</button></div></div><div id="msg"></div></div>`;posDraw()};
function posNew(){const n=$('pn1').value.trim();if(!n||!(+$('pp1').value>0))return msg('اكتب الاسم والسعر');DB.items.push({id:'I'+String(DB.items.length+1).padStart(3,'0'),name:n,unit:$('pu1').value,barcode:$('pb1').value,price:+$('pp1').value});save();R.pos()}
function posScan(c){c=c.trim();if(!c)return;const i=DB.items.find(x=>x.barcode==c);if(!i)return msg('الباركود غير موجود: '+c);posAdd(i.id)}
function posAdd(id){const i=DB.items.find(x=>x.id==id),l=CART.find(x=>x.id==id);if(l)l.q++;else CART.push({id,name:i.name,p:i.price||+prompt('سعر البيع؟')||0,q:1});posDraw()}
function posQ(id,d){const l=CART.find(x=>x.id==id);l.q+=d;if(l.q<=0)CART=CART.filter(x=>x.id!=id);posDraw()}
function posTot(){return CART.reduce((s,l)=>s+l.p*l.q,0)}
function posDraw(){const c=$('cart');if(!c)return;c.innerHTML=CART.length?table(['الصنف','السعر','الكمية','الإجمالي',''],CART.map(l=>[esc(l.name),fmt(l.p),`<button class="b l" onclick="posQ('${l.id}',-1)">-</button> ${l.q} <button class="b l" onclick="posQ('${l.id}',1)">+</button>`,fmt(l.p*l.q),'']),[1,3])+`<p style="font-size:22px"><b>الإجمالي: ${fmt(posTot())}</b></p><button class="b g" onclick="posPay()">إتمام البيع</button> <button class="b l" onclick="CART=[];posDraw()">إلغاء</button>`:'<p>السلة فارغة</p>'}
function posPay(){try{if(!ok(2))return;const t=posTot(),cu=$('pc2').value;const d=CART.map(l=>l.name+' x'+l.q).join('، ');addEntry(today(),'نقطة بيع: '+d,'',[cu?{acc:'1701',debit:t,party:cu}:{acc:$('pm').value,debit:t},{acc:'4101',credit:t}]);const rc=table(['الصنف','السعر','الكمية','الإجمالي'],CART.map(l=>[esc(l.name),fmt(l.p),l.q,fmt(l.p*l.q)]),[1,2,3])+'<h2>الإجمالي: '+fmt(t)+'</h2>';CART=[];posDraw();msg('تم البيع',1);if(confirm('طباعة الإيصال؟'))printHTML('إيصال بيع',rc)}catch(e){msg(e.message)}}

R.eta=()=>{const E=DB.eta=DB.eta||{issuer:{}};const i=E.issuer;
 $('main').innerHTML=`<div class="card"><h2>الفاتورة الإلكترونية (صيغة مصلحة الضرائب ETA)</h2><p style="color:#6b7686">يجهّز الفاتورة بنفس هيكل بيانات منظومة الفاتورة الإلكترونية (JSON) لتحميلها أو طباعتها. التوقيع الإلكتروني والإرسال للمنظومة يتمان من أداة التوقيع المعتمدة.</p>
 <h3>بيانات المُصدر</h3><div class="grid"><div><label>الرقم الضريبي</label><input id="e_rin" value="${esc(i.rin||'')}"></div><div><label>الاسم</label><input id="e_in" value="${esc(i.name||CUR.name)}"></div><div><label>كود الفرع</label><input id="e_br" value="${esc(i.br||'0')}"></div><div><label>كود النشاط</label><input id="e_ac" value="${esc(i.act||'')}"></div></div>
 <h3>المستلم</h3><div class="grid"><div><label>النوع</label><select id="e_rt"><option value="B">شركة (B)</option><option value="P">فرد (P)</option></select></div><div><label>الاسم</label><input id="e_rn"></div><div><label>الرقم الضريبي / القومي</label><input id="e_rid"></div><div><label>التاريخ والوقت</label><input id="e_dt" type="datetime-local" value="${new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16)}"></div><div><label>رقم الفاتورة الداخلي</label><input id="e_no" value="INV-${(E.docs||[]).length+1}"></div></div>
 <h3>البنود</h3><div class="scroll"><table id="el"><tr><th>الوصف</th><th>كود الصنف</th><th>الكمية</th><th>سعر الوحدة</th><th>ض.ق.م %</th></tr></table></div><p><button class="b l" onclick="etaRow()">+ بند</button> <button class="b g" onclick="etaBuild()">إنشاء</button></p><div id="msg"></div><div id="eo"></div></div>`;etaRow()};
function etaRow(){$('el').insertAdjacentHTML('beforeend','<tr><td><input class="ed"></td><td><input class="ec"></td><td><input class="eq" type="number" value="1" style="width:70px"></td><td><input class="ep" type="number" style="width:100px"></td><td><input class="ev" type="number" value="14" style="width:60px"></td></tr>')}
function etaBuild(){try{const E=DB.eta;E.issuer={rin:$('e_rin').value,name:$('e_in').value,br:$('e_br').value,act:$('e_ac').value};
 let sales=0,vat=0;const lines=[...document.querySelectorAll('#el tr')].slice(1).map(r=>{const q=+r.querySelector('.eq').value,p=+r.querySelector('.ep').value,v=+r.querySelector('.ev').value||0,d=r.querySelector('.ed').value;if(!d||!(q>0)||!(p>0))return null;const tot=Math.round(q*p*100)/100,t=Math.round(tot*v)/100;sales+=tot;vat+=t;return{description:d,itemType:'EGS',itemCode:r.querySelector('.ec').value||'EG-'+E.issuer.rin+'-1',unitType:'EA',quantity:q,internalCode:'',salesTotal:tot,total:Math.round((tot+t)*100)/100,valueDifference:0,totalTaxableFees:0,netTotal:tot,itemsDiscount:0,unitValue:{currencySold:'EGP',amountEGP:p},discount:{rate:0,amount:0},taxableItems:[{taxType:'T1',amount:t,subType:'V009',rate:v}]}}).filter(Boolean);
 if(!lines.length)throw new Error('أضف بنداً صحيحاً');if(!E.issuer.rin)throw new Error('اكتب الرقم الضريبي للمُصدر');
 const doc={issuer:{type:'B',id:E.issuer.rin,name:E.issuer.name,address:{branchID:E.issuer.br,country:'EG'}},receiver:{type:$('e_rt').value,id:$('e_rid').value,name:$('e_rn').value},documentType:'I',documentTypeVersion:'1.0',dateTimeIssued:$('e_dt').value+':00Z',taxpayerActivityCode:E.issuer.act,internalID:$('e_no').value,invoiceLines:lines,totalSalesAmount:sales,totalDiscountAmount:0,netAmount:sales,taxTotals:[{taxType:'T1',amount:vat}],totalAmount:Math.round((sales+vat)*100)/100,extraDiscountAmount:0,totalItemsDiscountAmount:0};
 E.docs=E.docs||[];E.docs.push({no:doc.internalID,at:doc.dateTimeIssued,total:doc.totalAmount});logA('فاتورة إلكترونية '+doc.internalID);save();window._eta=doc;
 $('eo').innerHTML=`<h3>الإجمالي: ${fmt(sales)} + ض.ق.م ${fmt(vat)} = ${fmt(doc.totalAmount)}</h3><p><button class="b g" onclick="etaDl()">تحميل JSON</button> <button class="b l" onclick="etaPr()">طباعة / PDF</button></p><textarea rows="10" style="width:100%;direction:ltr" readonly>${esc(JSON.stringify(doc,null,2))}</textarea>`}catch(e){msg(e.message)}}

/* Q&A */
function balParty(id){let d=0,c=0;DB.entries.forEach(e=>e.lines.forEach(l=>{if(l.party==id){d+=l.debit;c+=l.credit}}));return d-c}
function answerQ(q){q=q.replace(/[؟?!]/g,'').trim();if(!q)return 'اكتب سؤالك';const has=(...w)=>w.some(x=>q.includes(x));const rows=tb();
 const sum=p=>rows.filter(r=>!r.a.header&&r.a.code[0]==p).reduce((s,r)=>s+(p=='4'?r.c-r.d:p=='3'?r.d-r.c:r.c-r.d),0);
 const cashAcc=DB.accounts.filter(a=>!a.header&&/^19/.test(a.code)).map(a=>{const b=bal(a.code);return[a.name,b.d-b.c]});
 const pj=DB.projects.find(p=>q.includes(p.name)),pa=DB.parties.find(p=>q.includes(p.name)),it=DB.items.find(i=>q.includes(i.name));
 if(pj){let rev=0,cost=0;DB.entries.forEach(e=>e.lines.forEach(l=>{if(l.project!=pj.id)return;if(l.acc[0]=='4')rev+=l.credit-l.debit;if(l.acc[0]=='3')cost+=l.debit-l.credit}));return `مشروع ${pj.name}: الإيراد ${fmt(rev)} ، التكلفة ${fmt(cost)} ، الربح ${fmt(rev-cost)} ، قيمة العقد ${fmt(pj.value)}`}
 if(pa){const b=balParty(pa.id);return `${pa.name} (${pa.type}): ${b>0.005?'عليه لنا '+fmt(b):b<-0.005?'له علينا '+fmt(-b):'الرصيد صفر'}`}
 if(it){try{const L=replay(DB.stock).filter(l=>l.item==it.id);const qn=L.reduce((s,l)=>s+l.rem,0),v=L.reduce((s,l)=>s+l.rem*l.cost,0);return `${it.name}: المتاح ${fmt(qn)} ${it.unit} بقيمة ${fmt(v)}`}catch(e){}}
 if(has('خزنة','نقدية','كاش','سيولة','بنك','فلوس'))return 'النقدية والبنوك: '+fmt(cashAcc.reduce((s,x)=>s+x[1],0))+'\n'+cashAcc.map(x=>x[0]+': '+fmt(x[1])).join('\n');
 if(has('ربح','كسب','خسار','خسران'))return `صافي الربح ${fmt(sum('4')-sum('3'))} (إيرادات ${fmt(sum('4'))} - تكاليف ${fmt(sum('3'))})`;
 if(has('مبيعات','إيراد','دخل'))return 'إجمالي الإيرادات/المبيعات: '+fmt(sum('4'));
 if(has('مصروف','تكلفة','تكاليف','صرفنا'))return 'إجمالي التكاليف والمصروفات: '+fmt(sum('3'));
 if(has('متأخر','مديونية','العملاء','عليهم','مستحق لنا')){const L=DB.parties.filter(p=>p.type=='عميل').map(p=>[p.name,balParty(p.id)]).filter(x=>x[1]>0.005).sort((a,b)=>b[1]-a[1]);return L.length?'أرصدة العملاء:\n'+L.map(x=>x[0]+': '+fmt(x[1])).join('\n'):'لا توجد مبالغ مستحقة على العملاء'}
 if(has('مورد','موردين','ندين','علينا','مستحق للموردين')){const L=DB.parties.filter(p=>p.type!='عميل').map(p=>[p.name,-balParty(p.id)]).filter(x=>x[1]>0.005).sort((a,b)=>b[1]-a[1]);return L.length?'مستحق للموردين:\n'+L.map(x=>x[0]+': '+fmt(x[1])).join('\n'):'لا توجد مستحقات للموردين'}
 if(has('مخزون','مخزن','أصناف')){try{const m={};replay(DB.stock).forEach(l=>{m[l.item]=(m[l.item]||0)+l.rem});return 'أرصدة المخزون:\n'+DB.items.map(i=>i.name+': '+fmt(m[i.id]||0)+' '+i.unit).join('\n')}catch(e){}}

function replay(docs){const L=[];const ds=docs.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id);
 ds.forEach(d=>{d.lines.forEach((l,i)=>{if(d.type=='in'||d.type=='pin')L.push({id:d.id+'_'+i,item:l.item,doc:d.no,date:d.date,qty:+l.qty,cost:+l.price+(+l.lc||0),rem:+l.qty});
  else if(d.mode=='avg'){const ls=L.filter(x=>x.item==l.item&&x.rem>1e-9);const tot=ls.reduce((q,x)=>q+x.rem,0),val=ls.reduce((q,x)=>q+x.rem*x.cost,0),need=+l.qty;if(need>tot+1e-9)throw new Error('الرصيد غير كافٍ للصنف: '+(ITEM(l.item)||{}).name+' (ينقص '+fmt(need-tot)+')');const av=tot?val/tot:0;l.alloc=[{layer:'avg',doc:'متوسط مرجح',qty:need,cost:av}];l.total=need*av;const f=tot?(tot-need)/tot:0;ls.forEach(x=>x.rem*=f)}
  else{let need=+l.qty;l.alloc=[];const pick=(l.layer&&l.layer!='fifo')?L.filter(x=>x.id==l.layer&&x.item==l.item):L.filter(x=>x.item==l.item&&x.rem>1e-9);
   for(const x of pick){if(need<=1e-9)break;const t=Math.min(x.rem,need);x.rem-=t;need-=t;l.alloc.push({layer:x.id,doc:x.doc,qty:t,cost:x.cost})}
   if(need>1e-9)throw new Error('الرصيد غير كافٍ للصنف: '+(ITEM(l.item)||{}).name+' (ينقص '+fmt(need)+')');l.total=l.alloc.reduce((s,a)=>s+a.qty*a.cost,0)}})});return L}

 s+='</svg>';

 const bars=cs.map((x,i)=>`<div style="margin:4px 0;font-size:12px"><div style="display:flex;justify-content:space-between"><span>${esc(accName(x[0]))}</span><span>${fmt(x[1])} (${Math.round(x[1]/tot*100)}%)</span></div><div style="background:#eee;border-radius:4px"><div style="width:${x[1]/tot*100}%;background:${cols[i]};height:10px;border-radius:4px"></div></div></div>`).join('')||'<p>لا توجد مصروفات.</p>';
 return `<div class="card"><h2>الإيرادات والتكاليف (آخر 6 أشهر)</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div>${s}<div style="font-size:12px"><span style="color:#b8964b">■</span> إيراد &nbsp;<span style="color:#c0392b">■</span> تكلفة ومصروفات</div></div><div><b>أعلى بنود المصروفات</b>${bars}</div></div></div>`}

function csvParse(t){const rows=[];let r=[],c='',q=false;t=t.replace(/^\uFEFF/,'');const sep=(t.split('\n')[0].match(/;/g)||[]).length>(t.split('\n')[0].match(/,/g)||[]).length?';':(t.split('\n')[0].includes('\t')?'\t':',');
 for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')q=false;else c+=ch}else if(ch=='"')q=true;else if(ch==sep){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()))rows.push(r);r=[]}else c+=ch}
 r.push(c);if(r.some(x=>x.trim()))rows.push(r);return rows}
function bkParse(txt){const R_=csvParse(txt),out=[];const num=s=>{s=String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,\s]/g,'').replace(/[()]/g,m=>m=='('?'-':'');return parseFloat(s)};
 const nd=s=>{s=String(s||'').trim();if(/^\d{5}(\.\d+)?$/.test(s))return new Date(Date.UTC(1899,11,30)+Math.floor(+s)*864e5).toISOString().slice(0,10);let m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return ''};
 R_.forEach(r=>{const d=nd(r[0]);if(!d)return;const rest=r.slice(1);let amt=NaN,desc='';const nums=rest.map(num);
  const c2=rest[rest.length-2]||'',c1=rest[rest.length-1]||'';if(r.length>=4&&/^[\s\d.,()\-\u0660-\u0669]*$/.test(c1)&&/^[\s\d.,()\-\u0660-\u0669]*$/.test(c2)&&(c1.trim()||c2.trim())){amt=(num(c1)||0)-(num(c2)||0);desc=rest.slice(0,rest.length-2).join(' ')}
  if(isNaN(amt)){for(let i=rest.length-1;i>=0;i--)if(!isNaN(nums[i])){amt=nums[i];desc=rest.filter((x,j)=>j!=i).join(' ');break}}
  if(!isNaN(amt)&&amt!==0)out.push({date:d,desc:desc.trim(),amt})});return out}
function bkImpCard(){const accs=(window.bkA||'');return `<div class="card noprint"><h2>استيراد كشف البنك (CSV)</h2><p style="margin-top:0;color:#6c757d">ملف CSV (من Excel: حفظ باسم CSV) بأعمدة: التاريخ، البيان، ثم المبلغ (موجب = إيداع، سالب = سحب) أو عمودين مدين ودائن. يقارن البرنامج كل سطر بقيود الحساب المحدد (نفس المبلغ والتاريخ ±5 أيام).</p><input type="file" accept=".csv,.txt,.xlsx" onchange="bkImpFile(this)"><div id="bk_imp"></div></div>`}
function bkImpFile(el){const f=el.files[0];if(!f)return;const go_=(txt)=>{const L=bkParse(txt),acc=window.bkA;window.bkL=L;const used=new Set(),done=(DB.bankrec||{})[acc]||[];const led=[];DB.entries.forEach(e=>e.lines.forEach((l,i)=>{if(l.acc==acc){const k=e.id+':'+i;if(!done.includes(k))led.push({k,e,a:(+l.debit||0)-(+l.credit||0)})}}));
 L.forEach(x=>{x.m=null;const c=led.filter(y=>!used.has(y.k)&&Math.abs(y.a-x.amt)<0.005&&Math.abs((new Date(y.e.date)-new Date(x.date))/864e5)<=5).sort((a,b)=>Math.abs(new Date(a.e.date)-new Date(x.date))-Math.abs(new Date(b.e.date)-new Date(x.date)))[0];if(c){x.m=c;used.add(c.k)}});

 <div class="card"><h2>القوائم</h2>${f.boms.length?table(['المنتج','ناتج الدفعة','المكونات','عمالة','أعباء','هالك %','تكلفة معيارية للوحدة',''],f.boms.map(b=>{const sc=bomStd(b);return[esc((ITEM(b.prod)||{}).name),b.qty,b.comps.map(c=>esc((ITEM(c.item)||{}).name)+' × '+c.qty).join('<br>'),fmt(b.labor),fmt(b.oh),b.waste||0,'<b>'+fmt(sc.unit)+'</b>',`<button class="b r noprint" onclick="bmDel('${b.id}')">×</button>`]}),[1,3,4,5,6]):'<p>لا توجد قوائم.</p>'}</div>`};
const bomRowsHtml=()=>bomR8.length?table(['المكون','الكمية',''],bomR8.map((r,i)=>[esc((ITEM(r.item)||{}).name),r.qty,`<button class="b r" onclick="bomR8.splice(${i},1);R.fac()">×</button>`])):'';
function bmRow(){const i=$('bm_i').value,q=+$('bm_iq').value;if(!i||!(q>0))return msg('اختر المكون والكمية');bomR8.push({item:i,qty:q});const keep=['bm_p','bm_np','bm_u','bm_q','bm_l','bm_o','bm_w'].map(k=>$(k).value);R.fac();['bm_p','bm_np','bm_u','bm_q','bm_l','bm_o','bm_w'].forEach((k,j)=>$(k).value=keep[j])}
function bomStd(b,price){let m=0;b.comps.forEach(c=>{const p=price?price(c.item):layerAvg(c.item).avg||layerAvg(c.item).last;m+=c.qty*(1+(b.waste||0)/100)*p});const tot=m+(+b.labor||0)+(+b.oh||0);return{mat:m,total:tot,unit:b.qty?tot/b.qty:0}}
function newItem(name,unit){const it={id:'I'+String(DB.items.length+1).padStart(3,'0'),name,unit};DB.items.push(it);return it.id}
function bmSave(){if(!ok(2))return;let p=$('bm_p').value;const np=$('bm_np').value.trim();if(np)p=newItem(np,$('bm_u').value||'قطعة');if(!p||!bomR8.length||!(+$('bm_q').value>0))return msg('اختر المنتج وأضف مكونات وكمية الناتج');FC().boms.push({id:'B'+Date.now(),prod:p,qty:+$('bm_q').value,labor:+$('bm_l').value||0,oh:+$('bm_o').value||0,waste:+$('bm_w').value||0,comps:bomR8.slice()});bomR8=[];logA('قائمة مواد');save();R.fac();msg('تم الحفظ ✔',1)}
function bmDel(id){if(!ok(3))return;const f=FC();if(f.orders.some(o=>o.bom==id))return msg('القائمة مستخدمة في أوامر تشغيل');f.boms=f.boms.filter(b=>b.id!=id);save();R.fac()}
function bmTpl(k){if(!ok(2))return;const T={garment:{p:['قميص قطن','قطعة'],c:[['قماش قطن','متر',1.6],['خيط','بكرة',0.2],['أزرار','قطعة',8]],l:25,o:8,w:5},food:{p:['عبوة مربى 400جم','عبوة'],c:[['فاكهة','كجم',0.3],['سكر','كجم',0.25],['برطمان وغطاء','قطعة',1]],l:2,o:1.5,w:3},plastic:{p:['كرسي بلاستيك','قطعة'],c:[['حبيبات بولي بروبيلين','كجم',2.1],['ملون','كجم',0.05]],l:6,o:4,w:2}}[k];
 const find=(n,u)=>{const x=DB.items.find(i=>i.name==n);return x?x.id:newItem(n,u)};const p=find(T.p[0],T.p[1]);bomR8=T.c.map(c=>({item:find(c[0],c[1]),qty:c[2]}));R.fac();$('bm_p').value=p;$('bm_q').value=1;$('bm_l').value=T.l;$('bm_o').value=T.o;$('bm_w').value=T.w;msg('تم تحميل قالب '+T.p[0]+' - عدّل الكميات ثم احفظ',1)}
FV.rc=()=>`<div class="card noprint"><h2>استلام مواد خام / بضاعة (إيداع مخزني)</h2><div class="grid"><div><label>التاريخ</label><input id="rc_d" type="date" value="${today()}"></div><div><label>الصنف</label>${itemSel('rc_i')}</div><div><label>الكمية</label><input id="rc_q" type="number" step="any"></div><div><label>سعر الوحدة</label><input id="rc_p" type="number" step="any"></div><div><label>المورد</label><select id="rc_s">${partyOpts('مورد','— بدون —')}</select></div><div><label>السداد</label><select id="rc_c"><option value="">آجل على المورد</option>${cashOpts()}</select></div></div><button class="b g" onclick="rcSave()">تسجيل الاستلام</button><p style="font-size:12px;color:#6c757d">القيد: مدين المخزون / دائن المورد أو النقدية. الصرف والتحويل والجرد في شاشات المخازن.</p></div>`;
function rcSave(){if(!ok(2))return;const i=$('rc_i').value,q=+$('rc_q').value,p=+$('rc_p').value,s=$('rc_s').value,c=$('rc_c').value;if(!i||!(q>0)||!(p>0))return msg('أكمل الصنف والكمية والسعر');if(!s&&!c)return msg('اختر المورد أو حساب السداد');let d;try{d={id:DB.stock.reduce((m,x)=>Math.max(m,x.id),0)+1,type:'in',no:nextNo('in'),date:$('rc_d').value,lines:[{item:i,qty:q,price:p}],mode:DB.settings.costing,supplier:s,pay:c,vatRate:0};DB.stock.push(d);postDoc(d);save();R.fac();msg('تم الاستلام ✔',1)}catch(e){if(d)DB.stock=DB.stock.filter(x=>x!==d);msg(e.message)}}
FV.po=()=>{const f=FC();return `<div class="card noprint"><h2>أمر تشغيل جديد</h2><div class="grid"><div><label>القائمة (المنتج)</label><select id="po_b">${opts(f.boms.map(b=>[b.id,(ITEM(b.prod)||{}).name]),'','— القائمة —')}</select></div><div><label>عدد الدفعات</label><input id="po_n" type="number" value="1"></div><div><label>التاريخ</label><input id="po_d" type="date" value="${today()}"></div><div><label>عمالة فعلية (اتركه فارغاً = المعياري)</label><input id="po_l" type="number"></div><div><label>أعباء فعلية (فارغ = المعياري)</label><input id="po_o" type="number"></div><div><label>هالك فعلي % (فارغ = المتوقع)</label><input id="po_w" type="number"></div></div><button class="b g" onclick="poRun()">تنفيذ الإنتاج</button><p style="font-size:12px;color:#6c757d">يُصرف الخام من المخزن بطريقة التكلفة المختارة، ويُضاف المنتج التام للمخزن بتكلفته الفعلية، وقيد: مدين المخزون بقيمة العمالة والأعباء / دائن حساب 3706 (أعباء مُحمَّلة على الإنتاج).</p></div>
 <div class="card"><h2>أوامر التشغيل</h2>${f.orders.length?table(['#','التاريخ','المنتج','الكمية','خامات','عمالة','أعباء','إجمالي','تكلفة الوحدة','قيد',''],f.orders.slice().reverse().map(o=>[o.no,o.date,esc((ITEM(o.prod)||{}).name),fmt(o.qty),fmt(o.mat),fmt(o.labor),fmt(o.oh),fmt(o.total),'<b>'+fmt(o.unit)+'</b>',o.ent||'—',o===f.orders[f.orders.length-1]?`<button class="b r noprint" onclick="poDel('${o.id}')">حذف</button>`:'']),[3,4,5,6,7,8]):'<p>لا توجد أوامر.</p>'}</div>`};
function poRun(){if(!ok(2))return;const f=FC(),b=f.boms.find(x=>x.id==$('po_b').value),n=+$('po_n').value;if(!b||!(n>0))return msg('اختر القائمة وعدد الدفعات');const date=$('po_d').value;const lab=$('po_l').value===''?b.labor*n:+$('po_l').value,oh=$('po_o').value===''?b.oh*n:+$('po_o').value,w=$('po_w').value===''?(b.waste||0):+$('po_w').value;
 const id=100000+DB.prodDocs.length*2,no=f.orders.length+1;const out={id,type:'pout',no:'ت'+no,date,mode:DB.settings.costing,lines:b.comps.map(c=>({item:c.item,qty:r2_(c.qty*n*(1+w/100)*1e4)/1e4}))};DB.prodDocs.push(out);let mat;
 try{replay(DB.stock);mat=r2_(out.lines.reduce((s,l)=>s+l.total,0))}catch(e){DB.prodDocs.pop();return msg(e.message)}
 const tot=r2_(mat+lab+oh),q=b.qty*n,unit=tot/q;const inn={id:id+1,type:'pin',no:'ت'+no,date,lines:[{item:b.prod,qty:q,price:unit}]};DB.prodDocs.push(inn);
 let en=null;if(lab+oh>0){ensureAcc('3706','أعباء تصنيع محمّلة على الإنتاج');try{en=addEntry(date,'إنتاج أمر '+no+' - '+(ITEM(b.prod)||{}).name+' ('+fmt(q)+')','PROD'+no,[{acc:'1601',debit:lab+oh},{acc:'3706',credit:lab+oh}])}catch(e){DB.prodDocs.pop();DB.prodDocs.pop();return msg(e.message)}}
 f.orders.push({id:'O'+Date.now(),no,date,bom:b.id,prod:b.prod,batches:n,qty:q,mat,labor:lab,oh,total:tot,unit:r2_(unit*1e4)/1e4,waste:w,ent:en?en.id:'',pdocs:[out.id,inn.id],std:r2_(bomStd(b,i=>{const l=out.lines.find(x=>x.item==i);return l&&l.total?l.total/l.qty:layerAvg(i).avg}).total/b.qty*1e4)/1e4,stdMat:b.comps.reduce((s,c)=>{const l=out.lines.find(x=>x.item==c.item);return s+(l&&l.qty?l.total/l.qty*c.qty*n:0)},0),stdLab:b.labor*n,stdOh:b.oh*n});
 logA('أمر تشغيل '+no);save();R.fac();msg('تم الإنتاج ✔ تكلفة الوحدة '+fmt(unit),1)}
function poDel(id){if(!ok(3))return;const f=FC(),o=f.orders.find(x=>x.id==id);if(o!==f.orders[f.orders.length-1])return msg('يمكن حذف آخر أمر فقط');if(!confirm('حذف أمر التشغيل وقيده؟'))return;const sv=DB.prodDocs.slice();DB.prodDocs=DB.prodDocs.filter(d=>!o.pdocs.includes(d.id));try{replay(DB.stock)}catch(e){DB.prodDocs=sv;return msg('لا يمكن الحذف: المنتج استُهلك لاحقاً')}
 if(o.ent)DB.entries=DB.entries.filter(e=>e.id!=o.ent);f.orders.pop();save();R.fac()}
FV.cost=()=>{const f=FC();const by={};f.orders.forEach(o=>{const k=o.prod;by[k]=by[k]||{q:0,t:0,m:0,l:0,o:0,sm:0,sl:0,so:0};const x=by[k];x.q+=o.qty;x.t+=o.total;x.m+=o.mat;x.l+=o.labor;x.o+=o.oh;x.sm+=o.stdMat||0;x.sl+=o.stdLab||0;x.so+=o.stdOh||0});
 const rows=Object.keys(by).map(k=>{const x=by[k],it=ITEM(k),st=x.sm+x.sl+x.so,pr=+it.price||0;const unit=x.t/x.q;return[esc(it.name),fmt(x.q),fmt(unit),fmt(st/x.q),(x.t-st>0?'<b style="color:#c0392b">':'<b style="color:#27ae60">')+fmt(x.t-st)+'</b>',fmt(x.m-x.sm),fmt(x.l-x.sl),fmt(x.o-x.so),pr?fmt(pr):'—',pr?fmt((pr-unit)*x.q):'—',pr?fmt(pr-unit)+' ('+r2_((pr-unit)/pr*100)+'%)':'—']});
 return `<div class="card"><h2>تحليل التكلفة: الفعلي مقابل المعياري</h2>${rows.length?table(['المنتج','الكمية المنتجة','تكلفة الوحدة الفعلية','المعيارية','إجمالي الانحراف','انحراف خامات','انحراف عمالة','انحراف أعباء','سعر البيع (صنف)','ربح إجمالي','هامش الوحدة'],rows,[1,2,3,4,5,6,7,8,9]):'<p>لا توجد أوامر تشغيل بعد.</p>'}<p style="font-size:12px;color:#6c757d">المعياري = قائمة المواد بأسعار الخام وقت التشغيل، والعمالة والأعباء المعيارية للقائمة. الانحراف الموجب (أحمر) = تكلفة أعلى من المعيار (هالك زائد أو عمالة أعلى). سعر البيع يؤخذ من خانة السعر في الصنف إن وُجدت.</p></div>`};
FV.wip=()=>{let L=[];try{L=replay(DB.stock)}catch(e){}return `<div class="card"><h2>أرصدة المخزون (خام + تام)</h2>${table(['الصنف','الوحدة','الكمية','متوسط التكلفة','القيمة'],DB.items.map(i=>{const ls=L.filter(x=>x.item==i.id&&x.rem>1e-9),q=ls.reduce((s,x)=>s+x.rem,0),v=ls.reduce((s,x)=>s+x.rem*x.cost,0);return[esc(i.name),i.unit,fmt(q),q?fmt(v/q):'—',fmt(v)]}),[2,3,4])}</div>`};

const PV={};
PV.guar=()=>{const g=PJ().guar,t=today(),soon=new Date(Date.now()+30*864e5).toISOString().slice(0,10);const al=g.filter(x=>x.st!='مفرج عنه'&&x.rel<=soon);
 return (al.length?`<div class="msg er">ضمانات/محتجزات يحل أجل الإفراج عنها خلال 30 يوم أو متأخرة: ${al.map(x=>esc((proj(x.proj)||{}).name)+' - '+x.kind+' ('+x.rel+')').join('، ')}</div>`:'')+`<div class="card noprint"><h2>ضمان / محتجز جديد</h2><div class="grid"><div><label>المشروع</label><select id="gu_p">${projOpts('اختر')}</select></div><div><label>النوع</label><select id="gu_k"><option>خطاب ضمان ابتدائي</option><option>خطاب ضمان نهائي</option><option>محتجز ضمان أعمال (لنا عند العميل)</option><option>محتجز لمقاول باطن (علينا)</option></select></div><div><label>القيمة</label><input id="gu_a" type="number"></div><div><label>الجهة / البنك</label><input id="gu_i"></div><div><label>تاريخ البداية</label><input id="gu_s" type="date" value="${t}"></div><div><label>تاريخ الإفراج / الانتهاء</label><input id="gu_r" type="date"></div></div><button class="b g" onclick="guAdd()">إضافة</button></div>
 <div class="card"><h2>سجل الضمانات والمحتجزات</h2>${g.length?table(['المشروع','النوع','القيمة','الجهة','من','الإفراج','الحالة',''],g.map(x=>[esc((proj(x.proj)||{}).name),x.kind,fmt(x.amt),esc(x.iss||''),x.start,x.rel,x.st!='مفرج عنه'&&x.rel<t?'<b style="color:#c0392b">متأخر</b>':x.st,x.st!='مفرج عنه'?`<button class="b g noprint" onclick="guRel('${x.id}')">تم الإفراج</button>`:'']),[2]):'<p>لا توجد ضمانات.</p>'}<p>إجمالي القائم: <b>${fmt(g.filter(x=>x.st!='مفرج عنه').reduce((s,x)=>s+x.amt,0))}</b></p></div>`};
function guAdd(){if(!ok(2))return;const a=+$('gu_a').value,r=$('gu_r').value,p=$('gu_p').value;if(!p||!(a>0)||!r)return msg('أكمل المشروع والقيمة وتاريخ الإفراج');PJ().guar.push({id:'G'+Date.now(),proj:p,kind:$('gu_k').value,amt:a,iss:$('gu_i').value,start:$('gu_s').value,rel:r,st:'قائم'});save();R.pj()}

PV.ph=()=>{const p=PJ(),P=DB.projects;const act=ph=>{let s=0;DB.entries.forEach(e=>{if(e.date>=ph.start&&e.date<=ph.end)e.lines.forEach(l=>{if(l.project==ph.proj&&/^3[1-6]/.test(l.acc))s+=l.debit-l.credit})});return s};
 return `<div class="card noprint"><h2>مرحلة جديدة</h2><div class="grid"><div><label>المشروع</label><select id="ph_p">${projOpts('اختر')}</select></div><div><label>المرحلة / البند</label><input id="ph_n"></div><div><label>الميزانية</label><input id="ph_b" type="number"></div><div><label>من</label><input id="ph_s" type="date" value="${today()}"></div><div><label>إلى</label><input id="ph_e" type="date" value="${today()}"></div><div><label>نسبة الإنجاز %</label><input id="ph_x" type="number" value="0"></div></div><button class="b g" onclick="phAdd()">إضافة</button></div>
 <div class="card"><h2>المراحل وتكلفتها الفعلية</h2>${p.phases.length?table(['المشروع','المرحلة','الفترة','الميزانية','التكلفة الفعلية','المتبقي','إنجاز %','تقدير التكلفة عند الإتمام',''],p.phases.map(x=>{const a=act(x),e=x.pct>0?a/(x.pct/100):a;return[esc((proj(x.proj)||{}).name),esc(x.name),x.start+' → '+x.end,fmt(x.bud),fmt(a),`<b style="color:${x.bud-a<0?'#c0392b':'#27ae60'}">${fmt(x.bud-a)}</b>`,`<input type="number" value="${x.pct}" style="width:70px" onchange="phPct('${x.id}',this.value)">`,fmt(e),`<button class="b r noprint" onclick="phDel('${x.id}')">×</button>`]}),[3,4,5,7]):'<p>لا توجد مراحل.</p>'}<p style="font-size:12px;color:#6c757d">تكلفة المرحلة = تكاليف المشروع (حسابات 31-36) المسجلة خلال فترة المرحلة. تقدير التكلفة عند الإتمام = التكلفة الفعلية ÷ نسبة الإنجاز.</p></div>`};

function phPct(id,v){if(!ok(2))return;PJ().phases.find(x=>x.id==id).pct=+v||0;save();R.pj()}

RTV.sup=()=>`<div class="card noprint"><h2>مرتجع مواد للمورد (من المخزن)</h2><div class="grid"><div><label>التاريخ</label><input id="rs_d" type="date" value="${today()}"></div><div><label>المورد</label><select id="rs_p">${partyOpts('مورد','— المورد —')}</select></div><div><label>الصنف</label>${itemSel2('rs_i')}</div><div><label>الوحدة</label><select id="rs_i_u"><option value="1">الأساس</option></select></div><div><label>الكمية</label><input id="rs_q" type="number" step="any"></div><div><label>قيمة الإشعار الدائن (فارغ = بتكلفة المخزن)</label><input id="rs_v" type="number" step="any"></div></div><button class="b g" onclick="rtSup()">تسجيل المرتجع</button><p style="font-size:12px;color:#6c757d">القيد عبر حساب 1606 "مرتجعات المخزون": مدين المورد / دائن 1606 بقيمة الإشعار، ومدين 1606 / دائن المخزون 1601 بتكلفة الطبقات. الفرق يظهر في رصيد 1606 (صفر إذا رُدّ بالتكلفة).</p></div>`;
RTV.site=()=>`<div class="card noprint"><h2>مرتجع إلى المخزن</h2><div class="grid"><div><label>التاريخ</label><input id="rr_d" type="date" value="${today()}"></div><div><label>المصدر</label><select id="rr_k"><option value="site">من مشروع / موقع</option><option value="prod">من الإنتاج</option><option value="cust">من عميل (مرتجع مبيعات للمخزن)</option></select></div>${isTr()?'':`<div><label>المشروع</label><select id="rr_p">${projOpts('اختر')}</select></div>`}<div><label>الصنف</label>${itemSel2('rr_i')}</div><div><label>الوحدة</label><select id="rr_i_u"><option value="1">الأساس</option></select></div><div><label>الكمية</label><input id="rr_q" type="number" step="any"></div><div><label>تكلفة الوحدة (فارغ = متوسط التكلفة الحالي)</label><input id="rr_c" type="number" step="any"></div></div><button class="b g" onclick="rtSite()">تسجيل المرتجع</button><p style="font-size:12px;color:#6c757d">القيد: مدين المخزون 1601 / دائن 1606، ثم مدين 1606 / دائن تكلفة المشروع أو الإنتاج (3101). مرتجع العميل يعيد المخزون بتكلفته ويُسجَّل مرتجع المبيعات المالي من شاشة المبيعات.</p></div>`;
function rtDoc(item,qtyBase,date,type,price){const id=100000+DB.prodDocs.length*2;const no='م'+(RT().length+1);const d={id,type,no,date,mode:DB.settings.costing,lines:[type=='pin'?{item,qty:qtyBase,price}:{item,qty:qtyBase}]};DB.prodDocs.push(d);return d}
function rtSup(){if(!ok(2))return;FC();const p=$('rs_p').value,i=$('rs_i').value,f=+$('rs_i_u').value||1,q=(+$('rs_q').value||0)*f,d=$('rs_d').value;if(!p||!i||!(q>0))return msg('أكمل المورد والصنف والكمية');const doc=rtDoc(i,q,d,'pout');let cost;try{replay(DB.stock);cost=r2_(doc.lines[0].total)}catch(e){DB.prodDocs.pop();return msg(e.message)}
 const val=$('rs_v').value===''?cost:+$('rs_v').value;ensureAcc('1606','مرتجعات المخزون (حساب وسيط)');let en;try{en=addEntry(d,'مرتجع مواد للمورد '+((party(p)||{}).name||'')+' - '+(ITEM(i)||{}).name+' × '+fmt(q),'RTS',[{acc:'2801',debit:val,party:p},{acc:'1606',credit:val},{acc:'1606',debit:cost},{acc:'1601',credit:cost}])}catch(e){DB.prodDocs.pop();return msg(e.message)}
 RT().push({id:'RT'+Date.now(),no:RT().length+1,date:d,kind:'للمورد',item:i,qty:q,cost,val,party:p,ent:en.id,doc:doc.id});logA('مرتجع مواد للمورد');save();R.rt();msg('تم المرتجع ✔ بتكلفة '+fmt(cost),1)}
function rtSite(){if(!ok(2))return;FC();const k=$('rr_k').value,i=$('rr_i').value,f=+$('rr_i_u').value||1,q=(+$('rr_q').value||0)*f,d=$('rr_d').value;const pj=$('rr_p')?$('rr_p').value:'';if(!i||!(q>0))return msg('اختر الصنف والكمية');if(!isTr()&&k!='cust'&&!pj)return msg('اختر المشروع');
 const c=$('rr_c').value===''?r2_(layerAvg(i).avg||layerAvg(i).last):r2_((+$('rr_c').value)/f);if(!(c>0))return msg('لا توجد تكلفة سابقة: أدخل تكلفة الوحدة');const tot=r2_(q*c);const doc=rtDoc(i,q,d,'pin',c);ensureAcc('1606','مرتجعات المخزون (حساب وسيط)');ensureAcc('3101','مشتريات / تكلفة مواد');const credAcc=k=='cust'?'1606':'3101';
 let en;try{const L=[{acc:'1601',debit:tot},{acc:'1606',credit:tot}];if(k!='cust'){L.push({acc:'1606',debit:tot},{acc:'3101',credit:tot,project:pj})}else{ensureAcc('3108','فروق مرتجعات المواد');L.push({acc:'1606',debit:tot},{acc:'3108',credit:tot})}en=addEntry(d,'مرتجع مواد للمخزن ('+({site:'من مشروع',prod:'من الإنتاج',cust:'من عميل'})[k]+') - '+(ITEM(i)||{}).name+' × '+fmt(q),'RTW',L)}catch(e){DB.prodDocs.pop();return msg(e.message)}
 RT().push({id:'RT'+Date.now(),no:RT().length+1,date:d,kind:({site:'من مشروع',prod:'من الإنتاج',cust:'من عميل'})[k],item:i,qty:q,cost:tot,val:tot,project:pj,ent:en.id,doc:doc.id});logA('مرتجع للمخزن');save();R.rt();msg('تم المرتجع ✔',1)}
RTV.log=()=>{const r=RT();return `<div class="card"><h2>سجل المرتجعات</h2>${r.length?table(['#','التاريخ','النوع','الصنف','الكمية (أساس)','التكلفة','قيد',''],r.slice().reverse().map(x=>[x.no,x.date,x.kind,esc((ITEM(x.item)||{}).name),fmt(x.qty),fmt(x.cost),x.ent,x===r[r.length-1]?`<button class="b r noprint" onclick="rtDel('${x.id}')">حذف</button>`:'']),[4,5]):'<p>لا مرتجعات.</p>'}<p>رصيد حساب 1606 (فروق المرتجعات): <b>${fmt((()=>{const b=bal('1606');return b.d-b.c})())}</b></p></div>`};
function rtDel(id){if(!ok(3))return;const r=RT(),x=r.find(y=>y.id==id);if(x!==r[r.length-1])return msg('حذف آخر مرتجع فقط');if(!confirm('حذف المرتجع وقيده؟'))return;const sv=DB.prodDocs.slice();DB.prodDocs=DB.prodDocs.filter(d=>d.id!=x.doc);try{replay(DB.stock)}catch(e){DB.prodDocs=sv;return msg('لا يمكن الحذف: الكمية استُخدمت لاحقاً')}DB.entries=DB.entries.filter(e=>e.id!=x.ent);r.pop();save();R.rt()}

const _hrAdj11=hrAdj;hrAdj=function(e,m){const a=_hrAdj11(e,m);const h=HRD();h.bp=h.bp||[];let pen=0,bon=0;h.bp.forEach(x=>{if(x.emp==e.id&&x.m==m){if(x.kind=='جزاء')pen+=x.amt;else bon+=x.amt}});a.pen=r2_(pen);a.bon=r2_(bon);a.total=r2_(a.total+pen);return a};
const _payCalc11=payCalc;payCalc=function(e,I){const c=_payCalc11(e,I);if(window.HR_M){const a=hrAdj(e,window.HR_M);if(a.bon){c.gross=r2_(c.gross+a.bon);c.net=r2_(c.net+a.bon)}}return c};
R.hr=()=>{const h=HRD();$('main').innerHTML=navBar('hr',hrV,[['emps','الموظفون والعقود'],['depts','الأقسام والهيكل'],['att','الحضور والانصراف'],['roster','جدول الورديات'],['leaves','الإجازات'],['adv','السلف'],['bp','مكافآت وجزاءات'],['perf','تقييم الأداء'],['pay','صرف المرتبات والسداد']],'hrV')+`<div id="hb">${HV[hrV]()}</div>`};
HV.bp=()=>{const h=HRD();h.bp=h.bp||[];return `<div class="card noprint"><h2>مكافأة / جزاء</h2><div class="row"><div><label>الموظف</label><select id="bp_e">${empOpts()}</select></div><div><label>النوع</label><select id="bp_k"><option>مكافأة</option><option>جزاء</option></select></div><div><label>المبلغ</label><input id="bp_a" type="number"></div><div><label>على مسير شهر</label><input id="bp_m" type="month" value="${today().slice(0,7)}"></div><div><label>السبب</label><input id="bp_w"></div><div style="flex:0;align-self:end"><button class="b g" onclick="bpAdd()">تسجيل</button></div></div><p style="font-size:12px;color:#6c757d">المكافأة تضاف لإجمالي المرتب (دون إعادة حساب الضريبة)، والجزاء يُخصم. يُطبَّقان تلقائياً عند ترحيل المسير.</p></div><div class="card"><h2>السجل</h2>${h.bp.length?table(['الشهر','الموظف','النوع','المبلغ','السبب'],h.bp.slice().reverse().map(x=>[x.m,esc(eName(x.emp)),x.kind,fmt(x.amt),esc(x.why||'')]),[3]):'<p>لا سجلات.</p>'}</div>`};
function bpAdd(){if(!ok(2))return;const e=$('bp_e').value,a=+$('bp_a').value,m=$('bp_m').value;if(!e||!(a>0)||!m)return msg('أكمل البيانات');if((DB.payruns||[]).some(r=>r.m==m))return msg('مسير هذا الشهر مرحّل بالفعل');HRD().bp.push({id:'B'+Date.now(),emp:e,kind:$('bp_k').value,amt:a,m,why:$('bp_w').value});logA('مكافأة/جزاء');save();R.hr()}
HV.perf=()=>{const h=HRD();h.perf=h.perf||[];const K=[['q','جودة العمل'],['a','الانضباط'],['t','العمل الجماعي'],['p','الإنتاجية']];return `<div class="card noprint"><h2>تقييم جديد</h2><div class="row"><div><label>الموظف</label><select id="pf_e">${empOpts()}</select></div><div><label>الفترة</label><input id="pf_m" value="${today().slice(0,7)}"></div>${K.map(k=>`<div><label>${k[1]} (1-5)</label><input id="pf_${k[0]}" type="number" min="1" max="5" value="3"></div>`).join('')}<div><label>ملاحظات</label><input id="pf_n"></div><div style="flex:0;align-self:end"><button class="b g" onclick="pfAdd()">حفظ</button></div></div></div><div class="card"><h2>التقييمات</h2>${h.perf.length?table(['الفترة','الموظف','جودة','انضباط','جماعي','إنتاجية','المتوسط','ملاحظات'],h.perf.slice().reverse().map(x=>{const v=[x.q,x.a,x.t,x.p];return[x.m,esc(eName(x.emp)),...v,'<b>'+r2_(v.reduce((s,y)=>s+y,0)/4)+'</b>',esc(x.n||'')]}),[2,3,4,5,6]):'<p>لا تقييمات.</p>'}</div>`};
function pfAdd(){if(!ok(2))return;const e=$('pf_e').value;if(!e)return msg('اختر الموظف');const cl=v=>Math.min(5,Math.max(1,+v||3));HRD().perf.push({id:'PF'+Date.now(),emp:e,m:$('pf_m').value,q:cl($('pf_q').value),a:cl($('pf_a').value),t:cl($('pf_t').value),p:cl($('pf_p').value),n:$('pf_n').value});save();R.hr()}
let rsD=today();
HV.roster=()=>{const h=HRD();h.shifts=h.shifts||[{id:'S1',name:'صباحية',from:'08:00',to:'16:00'},{id:'S2',name:'مسائية',from:'16:00',to:'00:00'},{id:'S3',name:'ليلية',from:'00:00',to:'08:00'}];h.roster=h.roster||{};const d0=new Date(rsD);const dow=(d0.getDay()+1)%7;const st=new Date(+d0-dow*864e5);const days=[...Array(7)].map((_,i)=>new Date(+st+i*864e5).toISOString().slice(0,10));const DN=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
 return `<div class="card"><h2>جدول الورديات (أسبوع يبدأ ${days[0]})</h2><div class="row noprint"><div><label>أي يوم في الأسبوع</label><input type="date" value="${rsD}" onchange="rsD=this.value;R.hr()"></div><div style="flex:3;align-self:end;font-size:12px;color:#6c757d">${h.shifts.map(s=>s.name+' '+s.from+'-'+s.to).join(' · ')}</div></div>${DB.emps.length?table(['الموظف',...days.map((d,i)=>DN[i]+'<br>'+d.slice(5))],DB.emps.map(e=>[esc(e.n),...days.map(d=>`<select style="width:90px" onchange="rsSet('${d}','${e.id}',this.value)"><option value="">راحة</option>${h.shifts.map(s=>`<option value="${s.id}" ${((h.roster[d]||{})[e.id])==s.id?'selected':''}>${s.name}</option>`).join('')}</select>`)])):'<p>لا موظفين.</p>'}</div>`};
function rsSet(d,e,v){if(!ok(2))return;const h=HRD();h.roster[d]=h.roster[d]||{};h.roster[d][e]=v;save()}

FXV.qc=()=>{const f=FX();return `<div class="card noprint"><h2>فحص جودة لأمر تشغيل</h2><div class="row"><div><label>أمر التشغيل</label><select id="qc_o">${opts(f.orders.map(o=>[o.id,'#'+o.no+' '+((ITEM(o.prod)||{}).name)+' '+o.date]),'','—')}</select></div><div><label>الكمية المفحوصة</label><input id="qc_q" type="number"></div><div><label>المعيبة</label><input id="qc_d" type="number" value="0"></div><div><label>ملاحظات</label><input id="qc_n"></div><div style="flex:0;align-self:end"><button class="b g" onclick="qcAdd()">تسجيل</button></div></div></div><div class="card"><h2>نتائج الفحص</h2>${f.qc.length?table(['أمر','المنتج','فُحص','معيب','نسبة العيب','النتيجة'],f.qc.slice().reverse().map(q=>{const o=f.orders.find(x=>x.id==q.o)||{},r=q.q?q.d/q.q*100:0;return['#'+o.no,esc((ITEM(o.prod)||{}).name||''),q.q,q.d,r2_(r)+'%',r<=2?'<b style="color:#27ae60">مقبول</b>':r<=5?'<b style="color:#e67e22">ملاحظات</b>':'<b style="color:#c0392b">مرفوض</b>']}),[2,3,4]):'<p>لا فحوص.</p>'}<p style="font-size:12px;color:#6c757d">مقبول ≤ 2% عيوب، ملاحظات ≤ 5%، وفوق ذلك مرفوض (قابلة للتعديل في الكود المرجعي لاحقاً).</p></div>`};

function restoreFile(){if(!ok(3))return;const f=$('rs_f').files[0];if(!f)return msg('اختر ملفاً');const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.entries||!d.accounts)throw 0;if(!confirm('سيتم استبدال كل بيانات الشركة. متابعة؟'))return;DB=d;save();go('dash');alert('تمت الاستعادة ✔')}catch(e){msg('ملف غير صالح')}};r.readText?0:0;r.readAsText(f)}
setInterval(()=>{try{if(CUR&&DB&&DB.settings&&DB.settings.autoBk){const k='cbk_'+CUR.cid+'_'+today();if(!localStorage.getItem(k)){localStorage.setItem(k,JSON.stringify(DB));Object.keys(localStorage).filter(x=>x.startsWith('cbk_'+CUR.cid+'_')).sort().slice(0,-7).forEach(x=>localStorage.removeItem(x))}}}catch(e){}},60000);

/* ---- صحة الشركة، مقارنة أسعار الموردين، فواتير متكررة، كشف واتساب ---- */
OPV.hs=()=>{const t=today(),A={};DB.entries.forEach(e=>e.lines.forEach(l=>{A[l.acc]=(A[l.acc]||0)+l.debit-l.credit}));const s=(...p)=>Object.keys(A).filter(c=>p.some(x=>c.startsWith(x))).reduce((a,c)=>a+A[c],0);
 const cash=s('1901','1902','1903','1920'),ar=s('1701'),ap=-s('2801'),rev=-s('4'),exp=s('3'),net=rev-exp;
 const P=[];const add=(n,max,got,note)=>P.push([n,max,Math.round(Math.max(0,Math.min(max,got))),note]);
 add('السيولة (النقدية مقابل التزامات الموردين)',25,ap<=0?25:25*Math.min(1,(cash+ar*0.5)/ap),'نقدية '+fmt(cash)+' / موردون '+fmt(ap));
 add('الربحية (هامش صافي الربح)',25,rev>0?(net<=0?0:25*Math.min(1,(net/rev)/0.15)):0,rev>0?'الهامش '+(100*net/rev).toFixed(1)+'%':'لا إيرادات');
 add('تحصيل العملاء (العملاء مقابل الإيراد)',20,rev>0?20*(1-Math.min(1,Math.max(0,ar)/rev)):20,'عملاء '+fmt(ar));
 const al=(()=>{try{return alertList().length}catch(e){return 0}})();
 add('التنبيهات المفتوحة',15,15-Math.min(15,al*3),al+' تنبيه');
 const dr=(DB.drafts||[]).length;add('سلامة الدفاتر (مسودات / قفل فترة)',15,15-Math.min(10,dr*2)-(DB.settings.lock?0:5),dr+' مسودة'+(DB.settings.lock?' / الفترة مقفلة حتى '+DB.settings.lock:' / بدون قفل فترة'));
 const tot=P.reduce((a,x)=>a+x[2],0),col=tot>=75?'#27ae60':tot>=50?'#f39c12':'#c0392b';
 return `<div class="card" style="text-align:center"><h2>مؤشر صحة الشركة</h2><div style="font-size:64px;font-weight:700;color:${col}">${tot}<span style="font-size:24px"> / 100</span></div><div style="background:#eee;border-radius:8px;height:14px"><div style="width:${tot}%;background:${col};height:14px;border-radius:8px"></div></div></div><div class="card">${table(['المحور','من','الدرجة','ملاحظة'],P.map(x=>[x[0],x[1],x[2],esc(x[3])]))}<p style="font-size:12px;color:#6c757d">المؤشر تقديري من أرقامك الحالية لمساعدتك على المتابعة، وليس تقييماً مالياً رسمياً.</p></div>`};
OPV.spc=()=>{const rows=[];DB.items.forEach(it=>{const L={};DB.stock.forEach(d=>{if(d.type=='in')d.lines.forEach(l=>{if(l.item==it.id&&+l.price>0){const n=(party(d.supplier)||{}).name||'نقدي';if(!L[n]||L[n].d<=d.date)L[n]={d:d.date,p:+l.price}}})});const ks=Object.keys(L);if(ks.length<2)return;const mn=Math.min(...ks.map(k=>L[k].p));rows.push([esc(it.name),ks.map(k=>`${esc(k)}: ${fmt(L[k].p)}${L[k].p==mn?' ✔':''}`).join(' | '),'<b>'+fmt(mn)+'</b>',fmt(Math.max(...ks.map(k=>L[k].p))-mn)])});
 return `<div class="card"><h2>مقارنة أسعار الموردين لنفس الصنف (آخر سعر لكل مورد)</h2>${rows.length?table(['الصنف','الموردون','أقل سعر','الفرق إلى أعلى سعر'],rows):'<p>تظهر المقارنة عند وجود صنف اشتريته من موردَين أو أكثر.</p>'}</div>`};
/* فواتير متكررة */
OPV.rec=()=>{const R_=OP().rec=OP().rec||[];return `<div class="card noprint"><h2>فاتورة متكررة (إيجار / اشتراك)</h2><div class="grid"><div><label>العميل</label><select id="rc_p">${opts(DB.parties.filter(p=>p.type=='عميل').map(p=>[p.id,p.name]))}</select></div><div><label>البيان</label><input id="rc_d" placeholder="إيجار شهري"></div><div><label>المبلغ</label><input id="rc_a" type="number"></div><div><label>التكرار</label><select id="rc_e"><option value="1">شهري</option><option value="3">ربع سنوي</option><option value="12">سنوي</option></select></div><div><label>أول فاتورة</label><input id="rc_n" type="date" value="${today()}"></div></div><button class="b g" onclick="rcAdd()">حفظ</button> <button class="b" onclick="rcRun(1)">إنشاء المستحق الآن</button></div><div class="card"><h2>الفواتير المتكررة (تُنسخ تلقائياً عند فتح البرنامج)</h2>${table(['العميل','البيان','المبلغ','كل (شهر)','التالية',''],R_.map(r=>[esc(pName(r.p)),esc(r.d),fmt(+r.a),r.e,r.n,opX('rec',r.id)]))}</div>`};
function rcAdd(){const p=$('rc_p').value,a=+$('rc_a').value;if(!p||!(a>0))return msg('اختر العميل والمبلغ');opAdd('rec',{p,d:$('rc_d').value||'فاتورة متكررة',a,e:+$('rc_e').value,n:$('rc_n').value||today()})}
function rcRun(show){if(!DB||!CUR||CUR.perms&&0)return 0;const O=OP();let n=0;const t=today();(O.rec||[]).forEach(r=>{let g=0;while(r.n<=t&&g++<24){ensureAcc('4101','إيرادات');const e=post(r.n,r.d+' - '+pName(r.p),'REC',[{acc:'1701',debit:r.a,credit:0,party:r.p},{acc:'4101',debit:0,credit:r.a}]);if(!e)break;const d=new Date(r.n);d.setMonth(d.getMonth()+r.e);r.n=d.toISOString().slice(0,10);n++}});if(n){save();if(show)R.ops()}if(show)msg('تم إنشاء '+n+' فاتورة',1);return n}
setTimeout(()=>{try{if(CUR&&CUR.role=='مدير'&&!CUR.isAdmin&&ok(2)&&(DB.ops||{}).rec&&DB.ops.rec.length)rcRun(0)}catch(e){}},4000);
/* كشف حساب واتساب */
OPV.wst=()=>{const B={};DB.entries.forEach(e=>e.lines.forEach(l=>{if(l.party&&(l.acc=='1701'||l.acc=='2801')){B[l.party]=(B[l.party]||0)+(l.acc=='1701'?l.debit-l.credit:l.credit-l.debit)}}));DB.phones=DB.phones||{};
 return `<div class="card"><h2>كشف حساب بالواتساب بضغطة واحدة</h2>${table(['الطرف','النوع','الرصيد','رقم الواتساب',''],DB.parties.filter(p=>B[p.id]).map(p=>[esc(p.name),p.type,fmt(B[p.id]),`<input value="${esc(DB.phones[p.id]||'')}" onchange="DB.phones['${p.id}']=this.value;save()" placeholder="01xxxxxxxxx">`,`<button class="b g" onclick="wstSend('${p.id}')">إرسال</button>`]))}<p style="font-size:12px;color:#6c757d">يفتح واتساب برسالة جاهزة تضم الرصيد وآخر الحركات، وأنت تضغط إرسال بنفسك.</p></div>`};
function wstSend(id){const p=DB.parties.find(x=>x.id==id),M=[];let b=0;const cu=p.type=='عميل';DB.entries.forEach(e=>e.lines.forEach(l=>{if(l.party==id&&(l.acc=='1701'||l.acc=='2801')){const v=cu?l.debit-l.credit:l.credit-l.debit;b+=v;M.push(e.date+' '+(e.desc||'')+' : '+fmt(v))}}));
 const txt='السلام عليكم '+p.name+'\nكشف حسابك لدى '+CUR.name+'\n'+M.slice(-8).join('\n')+'\nالرصيد الحالي: '+fmt(b)+'\nشكراً لتعاملكم';const ph=(DB.phones||{})[id];if(!ph)return msg('اكتب رقم الواتساب أولاً');window.open(waLink8(ph,txt),'_blank')}

/* ---- حاسبة تقدير، إدخال نصي، تعليقات، حجز مخزون، جرد بالموبايل، إعدادات إقليمية ---- */
const onHandQ=it=>{let q=0;try{replay(DB.stock).forEach(x=>{if(x.item==it)q+=x.rem||0})}catch(e){}return q};
OPV.est=()=>`<div class="card"><h2>حاسبة تقدير تكلفة (مسطح × أسعار)</h2><div class="grid"><div><label>المسطح (م2)</label><input id="es_a" type="number" oninput="esCalc()"></div><div><label>تكلفة المتر: مواد</label><input id="es_m" type="number" oninput="esCalc()"></div><div><label>عمالة</label><input id="es_l" type="number" oninput="esCalc()"></div><div><label>معدات ومصاريف</label><input id="es_o" type="number" oninput="esCalc()"></div><div><label>هامش الربح %</label><input id="es_p" type="number" value="15" oninput="esCalc()"></div><div><label>هالك %</label><input id="es_w" type="number" value="5" oninput="esCalc()"></div></div><div id="es_r" style="font-size:16px;margin-top:10px"></div></div>`;
function esCalc(){const g=i=>+$(i).value||0,a=g('es_a'),c=(g('es_m')*(1+g('es_w')/100)+g('es_l')+g('es_o'))*a,p=c*(1+g('es_p')/100);$('es_r').innerHTML='التكلفة: <b>'+fmt(c)+'</b> | سعر البيع المقترح: <b>'+fmt(p)+'</b> | سعر المتر: <b>'+fmt(a?p/a:0)+'</b>'}
const TXK=[[/كهرب|مياه|غاز|نور/,'3703'],[/ايجار|إيجار/,'3702'],[/مرتب|راتب|اجر|أجر|يوميه|يومية/,'3701'],[/بنك|عمول/,'3704']];
OPV.txt=()=>`<div class="card"><h2>إدخال نصي سريع</h2><p>اكتب مثل: <b>صرفت 500 كهرباء</b> أو <b>استلمت 2000 من أحمد</b> (قواعد بسيطة بدون ذكاء اصطناعي).</p><div class="row"><div style="flex:4"><input id="tx_t" placeholder="اكتب العملية"></div><div><button class="b g" onclick="txRun()">فهم</button></div></div><div id="tx_o"></div></div>`;
let TXP=null;
function txRun(){const t=($('tx_t').value||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));const m=/(\d+(?:\.\d+)?)/.exec(t);if(!m)return msg('اكتب مبلغاً');const a=+m[1],inn=/استلم|قبض|حصل|ورد/.test(t);let ac=inn?'4501':'3703';if(!inn)for(const k of TXK)if(k[0].test(t))ac=k[1];if(inn&&/من\s/.test(t)){ac='1701'}
 TXP={a,ac,inn,d:t};$('tx_o').innerHTML=`<p>المقترح: ${inn?'قبض':'صرف'} <b>${fmt(a)}</b> ${inn?'إلى':'من'} الخزنة، الحساب المقابل: <b>${ac} ${(acc(ac)||{name:'(سيُنشأ)'}).name}</b></p><button class="b g" onclick="txPost()">ترحيل</button>`}
function txPost(){if(!ok(2)||!TXP)return;const x=TXP;ensureAcc(x.ac,x.inn?'إيرادات أخرى':'مصروفات إدارية وعمومية');ensureAcc('1901','الخزنة');const e=post(today(),x.d,'TXT',x.inn?[{acc:'1901',debit:x.a,credit:0},{acc:x.ac,debit:0,credit:x.a}]:[{acc:x.ac,debit:x.a,credit:0},{acc:'1901',debit:0,credit:x.a}]);if(e){save();msg('تم الترحيل ✔',1);TXP=null;$('tx_o').innerHTML=''}}
OPV.cm=()=>{const O=OP();O.cm=O.cm||[];return `<div class="card noprint"><h2>تعليق / إشارة على مستند</h2><div class="grid"><div><label>رقم المستند / القيد</label><input id="cm_d"></div><div style="flex:3"><label>التعليق (اذكر @المستخدم)</label><input id="cm_t"></div></div><button class="b g" onclick="cmAdd()">إضافة</button></div><div class="card"><h2>التعليقات</h2>${table(['الوقت','المستخدم','المستند','التعليق',''],O.cm.slice().reverse().map(c=>[c.t,esc(c.u),esc(c.d),esc(c.x).replace(/@(\S+)/g,'<b style="color:#0984e3">@$1</b>'),opX('cm',c.id)]))}</div>`};
function cmAdd(){const x=$('cm_t').value.trim();if(!x)return;opAdd('cm',{d:$('cm_d').value,x,u:CUR.user,t:new Date().toISOString().slice(0,16).replace('T',' ')})}
OPV.rsv=()=>{const O=OP();O.rsv=O.rsv||[];return `<div class="card noprint"><h2>حجز كمية لطلب</h2><div class="grid"><div><label>الصنف</label>${itemSel('rv_i')}</div><div><label>الكمية</label><input id="rv_q" type="number"></div><div><label>الطلب / العميل</label><input id="rv_r"></div></div><button class="b g" onclick="rvAdd()">حجز</button></div><div class="card"><h2>الأصناف: المتاح بعد الحجز</h2>${table(['الصنف','بالمخزن','محجوز','المتاح'],DB.items.map(i=>{const r=O.rsv.filter(x=>x.i==i.id).reduce((s,x)=>s+x.q,0),h=onHandQ(i.id);return r||h?[esc(i.name),fmt(h),fmt(r),'<b style="color:'+(h-r<0?'#c0392b':'#27ae60')+'">'+fmt(h-r)+'</b>']:null}).filter(Boolean))}</div><div class="card"><h2>الحجوزات</h2>${table(['الصنف','الكمية','الطلب',''],O.rsv.map(x=>[esc((ITEM(x.i)||{}).name),x.q,esc(x.r),opX('rsv',x.id)]))}</div>`};
function rvAdd(){const i=$('rv_i').value,q=+$('rv_q').value;if(!i||!(q>0))return;if(q>onHandQ(i)-OP().rsv.filter(x=>x.i==i).reduce((s,x)=>s+x.q,0)&&!confirm('الكمية أكبر من المتاح. متابعة؟'))return;opAdd('rsv',{i,q,r:$('rv_r').value})}
OPV.cnt=()=>{const O=OP();O.cnt=O.cnt||{};return `<div class="card"><h2>جرد بالموبايل (اكتب الكمية الفعلية لكل صنف)</h2>${DB.items.length?DB.items.map(i=>{const h=onHandQ(i.id),c=O.cnt[i.id];return `<div class="row" style="align-items:center;border-bottom:1px solid #eee;padding:6px 0"><div style="flex:3"><b>${esc(i.name)}</b><br><small>بالدفاتر ${fmt(h)} ${esc(i.unit)}</small></div><div><input type="number" inputmode="decimal" value="${c===undefined?'':c}" onchange="cnSet('${i.id}',this.value)" style="width:100%"></div><div style="flex:1" id="cv_${i.id}">${c===undefined?'':fmt(c-h)}</div></div>`}).join(''):'<p>لا أصناف.</p>'}<p style="font-size:12px;color:#6c757d">الفروق هنا للمراجعة. لترحيل تسوية الجرد استخدم تبويب المخزون > جرد.</p><button class="b" onclick="OP().cnt={};save();R.ops()">مسح الجرد</button></div>`};

const REG={eg:['مصر',14,'ج.م'],sa:['السعودية',15,'ر.س'],ae:['الإمارات',5,'د.إ']};
OPV.set=()=>{const s=DB.settings;return `<div class="card"><h2>إعدادات إقليمية</h2><div class="row"><div><label>الدولة (ضريبة القيمة المضافة الافتراضية)</label><select id="rg_c" onchange="rgSet(this.value)">${Object.keys(REG).map(k=>`<option value="${k}" ${(s.region||'eg')==k?'selected':''}>${REG[k][0]} - ${REG[k][1]}%</option>`).join('')}</select></div><div><label>رمز العملة</label><input id="rg_u" value="${esc(s.curSym||'ج.م')}" onchange="DB.settings.curSym=this.value;save()"></div></div><p style="font-size:12px;color:#6c757d">يغيّر النسبة الافتراضية فقط (مصر 14% افتراضي). يمكنك تعديل النسبة في أي مستند. الواجهة بالعربية فقط حالياً.</p></div>`};

let svP='';
OPV.sv=()=>{if(CUR.type!='contractor'&&CUR.type)return '<div class="card"><p>هذه الأدوات لشركات المقاولات.</p></div>';const O=OP();O.sv=O.sv||{};O.bc=O.bc||{};const pr=DB.projects||[];svP=svP||(pr[0]||{}).id||'';const bq=(DB.boq[svP]||[]);
 return `<div class="card noprint"><h2>حصر الكميات بالموقع وفرق التكلفة</h2><label>المشروع</label><select onchange="svP=this.value;R.ops()">${opts(pr.map(p=>[p.id,p.name]),svP)}</select></div><div class="card">${bq.length?table(['البند','كمية العقد','المنفذ (معتمد)','حصر الموقع','فرق الحصر','تكلفة الوحدة التقديرية','هامش البند'],bq.map(b=>{const d=doneQ(svP,b.id),s=O.sv[b.id],c=O.bc[b.id];return [esc(b.desc),fmt(b.qty),fmt(d),`<input type="number" step="any" style="width:90px" value="${s===undefined?'':s}" onchange="svSet('${b.id}',this.value)">`,s===undefined?'-':'<b style="color:'+(s-d<0?'#c0392b':'#27ae60')+'">'+fmt(s-d)+'</b>',`<input type="number" step="any" style="width:90px" value="${c===undefined?'':c}" onchange="bcSet('${b.id}',this.value)">`,c===undefined?'-':fmt(d*(b.price-c))+' ('+(b.price?(100*(b.price-c)/b.price).toFixed(0):0)+'%)']})):'<p>لا بنود لهذا المشروع.</p>'}<p style="font-size:12px;color:#6c757d">حصر الموقع أكبر من المعتمد يعني أعمالاً منفذة لم تُستخلص بعد.</p></div>`};

OPV.mrs=()=>{const O=OP();O.mrs=O.mrs||[];return `<div class="card noprint"><h2>استلام مواد بالموقع</h2><div class="grid"><div><label>المشروع</label><select id="mr_p">${opts((DB.projects||[]).map(p=>[p.id,p.name]))}</select></div><div><label>الصنف</label><input id="mr_i"></div><div><label>الكمية</label><input id="mr_q" type="number"></div><div><label>الوحدة</label><input id="mr_u" value="قطعة"></div><div><label>المورد</label><input id="mr_s"></div><div><label>التاريخ</label><input id="mr_d" type="date" value="${today()}"></div></div><button class="b g" onclick="mrAdd()">تسجيل الاستلام</button></div><div class="card">${table(['التاريخ','المشروع','الصنف','الكمية','المورد',''],O.mrs.slice().reverse().map(m=>[m.d,esc(((DB.projects||[]).find(p=>p.id==m.p)||{}).name||'-'),esc(m.i),m.q+' '+esc(m.u),esc(m.s),opX('mrs',m.id)]))}</div>`};

OPV.dsum=()=>{const t=today(),se=salesE().filter(e=>e.date==t),tot=se.reduce((s,e)=>s+sAmt(e),0),cu=new Set(se.map(e=>(e.lines.find(l=>l.party)||{}).party).filter(Boolean));const late=lateCust();const ex=DB.entries.filter(e=>e.date==t).length;return `<div class="card"><h2>ملخص اليوم ${t}</h2><p style="font-size:18px">النهارده بعت بـ <b>${fmt(tot)}</b> لعدد <b>${cu.size}</b> عميل، و<b>${late.length}</b> عميل متأخر في السداد، وتم تسجيل <b>${ex}</b> قيد.</p>${late.length?table(['العميل','الرصيد','أيام التأخير'],late.map(x=>[esc(x.n),fmt(x.b),x.days])):'<p>لا متأخرات.</p>'}</div>`};
function custFifo(){const R={};(DB.parties||[]).filter(p=>p.type=='عميل').forEach(p=>{const ev=[];DB.entries.forEach(e=>e.lines.forEach(l=>{if(l.acc=='1701'&&l.party==p.id)ev.push({d:e.date,dr:l.debit,cr:l.credit,id:e.id})}));ev.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);const inv=[];let w=0,pd=0,bal=0;ev.forEach(x=>{bal+=x.dr-x.cr;if(x.dr>0)inv.push({d:x.d,r:x.dr});let c=x.cr;while(c>0&&inv.length){const f=inv[0],u=Math.min(f.r,c),dd=(new Date(x.d)-new Date(f.d))/864e5;w+=dd*u;pd+=u;f.r-=u;c-=u;if(f.r<=0.005)inv.shift()}});const old=inv.length?Math.floor((Date.now()-new Date(inv[0].d))/864e5):0;R[p.id]={n:p.name,b:bal,avg:pd?w/pd:0,paid:pd,days:old}});return R}

{let tm;new MutationObserver(()=>{clearTimeout(tm);tm=setTimeout(addHelp,120)}).observe(document.documentElement,{childList:true,subtree:true})}

function atCalc(e,m){const o=AO(),sh=o.shf.find(s=>s.id==e.shift)||o.shf[0];const y=+m.slice(0,4),mo=+m.slice(5,7),nd=new Date(y,mo,0).getDate();const R={late:0,early:0,ot:0,abs:0,pres:0,lv:0,days:[]};for(let i=1;i<=nd;i++){const d=m+'-'+String(i).padStart(2,'0');if(d>today())break;if(wkOff(d))continue;const ev=o.at.filter(a=>a.n==e.n&&a.d==d);const inn=ev.filter(a=>a.k=='in').map(a=>a.t).sort()[0],out=ev.filter(a=>a.k=='out').map(a=>a.t).sort().pop();const lv=o.lv.find(l=>l.s=='ok'&&l.n==e.n&&l.f<=d&&l.t>=d);if(!inn&&lv){R.lv++;R.days.push([d,'إجازة '+lv.k]);continue}if(!inn){R.abs++;R.days.push([d,'غياب']);continue}R.pres++;let l=Math.max(0,t2m(inn)-t2m(sh.s)-(+sh.g||0)),ea=out?Math.max(0,t2m(sh.e)-t2m(out)):0,ot=out?Math.max(0,t2m(out)-t2m(sh.e)):0;R.late+=l;R.early+=ea;R.ot+=ot;R.days.push([d,inn+' - '+(out||'-'),l?'تأخير '+l+'د':'',ea?'مبكر '+ea+'د':'',ot?'إضافي '+ot+'د':''].join(' '))}return R}

OPV.abc=()=>{const m={};DB.stock.forEach(d=>{if(d.type=='out')d.lines.forEach(l=>{const x=m[l.item]=m[l.item]||{v:0};x.v+=(+l.qty||0)*((+l.price)||(+l.total/(+l.qty||1))||0)})});const r=Object.keys(m).map(k=>({n:(ITEM(k)||{}).name||k,v:m[k].v})).sort((a,b)=>b.v-a.v);const tot=r.reduce((s,x)=>s+x.v,0)||1;let c=0;r.forEach(x=>{c+=x.v;x.cum=c/tot*100;x.c=x.cum<=80?'A':x.cum<=95?'B':'C'});return `<div class="card"><h2>تحليل ABC (حسب قيمة المصروف)</h2>${r.length?table(['الصنف','القيمة','تراكمي %','الفئة'],r.map(x=>[esc(x.n),fmt(x.v),fmt(x.cum),x.c])):'<p>لا حركة صرف.</p>'}<h3>أفضل 10</h3><p>${r.slice(0,10).map(x=>esc(x.n)).join('، ')||'-'}</p><h3>أضعف 10</h3><p>${r.slice(-10).map(x=>esc(x.n)).join('، ')||'-'}</p></div>`};
OPV.mmx=()=>{const {m}=qtyMap();return `<div class="card"><h2>حد أدنى وأقصى لكل صنف</h2>${table(['الصنف','الرصيد','أدنى','أقصى','المقترح شراؤه'],DB.items.map(i=>{const q=m[i.id]||0,mn=+i.min||0,mx=+i.max||0;return[esc(i.name),fmt(q),`<input type="number" value="${mn||''}" style="width:80px" onchange="ITEM('${i.id}').min=+this.value;save();R.ops()">`,`<input type="number" value="${mx||''}" style="width:80px" onchange="ITEM('${i.id}').max=+this.value;save();R.ops()">`,mn&&q<=mn?'<b style="color:#c22">'+fmt(Math.max(0,(mx||mn*2)-q))+'</b>':'-']}))}</div>`};
OPV.exq=()=>{const t=today(),L=[];const lots=(DB.uom&&DB.uom.lots)||[];lots.forEach(l=>{if(l.exp&&l.exp<=addDays12(t,90))L.push([esc((ITEM(l.item)||{}).name||''),l.no,fmt(l.qty),l.exp,l.exp<t?'<span class="bd r">منتهي</span>':'<span class="bd">باقي '+Math.ceil((new Date(l.exp)-new Date(t))/864e5)+' يوم</span>',l.exp>=t&&l.exp<=addDays12(t,30)?'اقترح خصم 20-30%':''])});return `<div class="card"><h2>قرب الانتهاء (90 يوم)</h2>${L.length?table(['الصنف','الدفعة','الكمية','الانتهاء','الحالة','اقتراح'],L):'<p>لا دفعات قاربت الانتهاء (سجّلها من تبويب الدفعات والصلاحية).</p>'}</div>`};

OPV.lpl=()=>`<div class="card"><h2>جدول سداد قرض / عقد تأجير تمويلي</h2><div class="grid"><div><label>المبلغ</label><input id="lp_a" type="number"></div><div><label>الفائدة السنوية %</label><input id="lp_r" type="number"></div><div><label>عدد الأشهر</label><input id="lp_n" type="number" value="12"></div></div><button class="b g" onclick="lplGo()">احسب</button><div id="lp_o"></div></div>`;
window.lplGo=()=>{const A=+$('lp_a').value,r=(+$('lp_r').value||0)/1200,n=+$('lp_n').value||1,p=r?A*r/(1-Math.pow(1+r,-n)):A/n;let b=A;const R=[];for(let i=1;i<=n;i++){const it=b*r,pr=p-it;b-=pr;R.push([i,fmt(p),fmt(it),fmt(pr),fmt(Math.max(0,b))])}$('lp_o').innerHTML='<p>القسط الشهري: <b>'+fmt(p)+'</b> — إجمالي الفوائد: <b>'+fmt(p*n-A)+'</b></p>'+table(['القسط','المبلغ','فائدة','أصل','المتبقي'],R)};

 if(!x){x={id:'T'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),item:l.item,lot:l.lot,qty:0,exp:'',loc:''};Lt.push(x)}x.qty=Math.round((x.qty+delta)*1000)/1000;return{id:x.id,delta}}

  if(cmEq(rv,bv)){if(lv!==undefined)out[k]=lv;continue}
  if(cmIsO(lv)&&cmIsO(rv)&&(path.length>0)&&k!='_cf'){out[k]=cmObj(cmIsO(bv)?bv:{},lv,rv,path.concat(k),C,key,rid);continue}

function cmMerge0(base,local,remote,who){const C=[],N=[],out={};const LN=new Set(),pend=[];
 base=base||{};

 for(const k of keys){const b=base[k],l=local[k],r=remote[k];
  if(cmEq(l,r)){if(l!==undefined)out[k]=l;continue}
  if(cmEq(l,b)){if(r!==undefined)out[k]=r;continue}
  if(cmEq(r,b)){if(l!==undefined)out[k]=l;continue}
  if(k=='seq'){out[k]=Math.max(+l||0,+r||0);continue}
  if(k=='log'&&Array.isArray(l)&&Array.isArray(r)){const bs=new Set((b||[]).map(x=>JSON.stringify(x))),rs=new Set(r.map(x=>JSON.stringify(x)));out[k]=r.concat(l.filter(x=>!rs.has(JSON.stringify(x))&&!bs.has(JSON.stringify(x)))).slice(-1500);continue}
  if(Array.isArray(l)&&Array.isArray(r)&&(cmIdArr(l)||l.length==0)&&(cmIdArr(r)||r.length==0)&&(Array.isArray(b)||b===undefined)){
   const bm=new Map((b||[]).map(x=>[x.id,x])),lm=new Map(l.map(x=>[x.id,x])),rm=new Map(r.map(x=>[x.id,x])),arr=[];
   for(const rec of r){const B=bm.get(rec.id),L=lm.get(rec.id);
    if(!B&&L&&!cmEq(L,rec)){arr.push(rec);const c=Object.assign({},L);LN.add(c);pend.push({key:k,rec:c,old:L.id})}
    else if(!B||!L&&!B){arr.push(rec)}
    else if(!L){if(cmEq(rec,B))continue;rec._cf=1;arr.push(rec);C.push({key:k,rid:rec.id,path:[k,rec.id],kind:'del',label:cmLabel(k,rec),mine:undefined,theirs:rec})}
    else{const cc=[];const m=cmObj(B,L,rec,[k,rec.id],cc,k,rec.id);if(cc.length){m._cf=1;cc.forEach(x=>{x.label=cmLabel(k,m);x.mineRec=L;x.theirsRec=rec});C.push(...cc)}arr.push(m)}}
   for(const L of l){if(rm.has(L.id))continue;const B=bm.get(L.id);
    if(!B){const c=Object.assign({},L);LN.add(c);arr.push(c)}
    else if(!cmEq(L,B)){const c=Object.assign({},L,{_cf:1});arr.push(c);C.push({key:k,rid:L.id,path:[k,L.id],kind:'deledit',label:cmLabel(k,L),mine:L,theirs:undefined})}}
   out[k]=arr;continue}
  if(cmIsO(l)&&cmIsO(r)){out[k]=cmObj(cmIsO(b)?b:{},l,r,[k],C,k,null);continue}
  if(Array.isArray(l)&&Array.isArray(r)&&!cmIdArr(l)&&!cmIdArr(r)&&l.every(x=>typeof x!='object')&&r.every(x=>typeof x!='object')){out[k]=Array.from(new Set([...r,...l]));continue}

 /* ترقيم المستندات الجديدة التي تصادم أرقام الجهاز الآخر */
 const mx=(ks)=>Math.max(0,...ks.flatMap(q=>(out[q]||[]).map(x=>+x.id||0)));
 let eM=Math.max(mx(['entries','drafts','cancelled']),(+out.seq||1)-1);const emap={},imap={},amap={};

  if(['entries','drafts','cancelled'].includes(p.key)){nw=++eM;emap[old]=nw}

async function clUp(a,cid){const c=clCfg(),b=dataToBlob(a.data);if(!b)return;const ext=((a.name||'').match(/\.[A-Za-z0-9]{1,5}$/)||[''])[0];const path=cid+'/'+a.id+'-'+Math.random().toString(36).slice(2,8)+ext;const r=await fetch(c.url+'/storage/v1/object/'+c.bucket+'/'+path,{method:'POST',headers:Object.assign({apikey:c.key,Authorization:'Bearer '+c.key,'Content-Type':b.type,'x-upsert':'false'},clS&&clS.admin?{'x-adm':clS.admin}:{'x-u':btoa(unescape(encodeURIComponent((clS&&clS.u)||''))),'x-h':(clS&&clS.h)||''}),body:b});if(!r.ok)throw new Error('up '+r.status);a.url=c.url+'/storage/v1/object/public/'+c.bucket+'/'+path}
