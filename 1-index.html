function clCard(){const c=clCfg(),s=clSt(),n=Object.keys(s).filter(k=>!k.startsWith('__')&&!k.startsWith('del_')).length;return `<div class="card"><h2>السحابة والمزامنة</h2>${window.__sysClosed?`<div class="msg er">الإعداد الأول للسحابة مقفول للأمان. لتفعيل مدير النظام على السحابة: افتح SQL Editor في مشروع Supabase ونفّذ السطر التالي ثم سجّل الدخول كمدير النظام خلال 30 دقيقة (يُغلق تلقائياً بعد أول تفعيل أو انتهاء المهلة):<br><code style="direction:ltr;display:block;user-select:all">insert into public.sys(k,v) values('setup', jsonb_build_object('until', now()+interval '30 minutes')) on conflict (k) do update set v=excluded.v;</code>لاسترجاع الوصول عند نسيان كلمة سر مدير النظام: نفّذ <code>delete from public.sys where k='root';</code> ثم السطر السابق (بيانات الشركات تبقى).</div>`:''}<p style="margin-top:0">الحالة: <b>${clS?(clMsg||'متصل'):'غير مفعّل'}</b> | شركات متزامنة: ${n}</p><p><button class="b g" onclick="clTick(true)">مزامنة الآن</button></p><details><summary>ربط مشروع تخزين آخر (أكبر سعة)</summary><p style="font-size:13px;color:#6b7686">البرنامج يستخدم مشروع Supabase مجانياً (قاعدة 500MB وتخزين مرفقات 1GB). لربط مشروعك الخاص: أنشئ مشروعاً، شغّل ملف الإعداد SQL في محرر SQL، ثم ضع الرابط والمفتاح العام (anon) واسم الحاوية هنا. لا تضع مفتاح service_role أبداً.</p><div class="row"><div style="flex:2"><label>رابط المشروع</label><input id="cl_u" value="${c.url}"></div><div style="flex:2"><label>المفتاح العام (anon)</label><input id="cl_k" value="${c.key}"></div><div><label>حاوية المرفقات</label><input id="cl_b" value="${c.bucket}"></div></div><p><button class="b" onclick="clSaveCfg()">حفظ الربط</button> <button class="b l" onclick="clSchema()">تنزيل ملف إعداد SQL</button></p></details></div>`}
function clSaveCfg(){const o={url:$('cl_u').value.trim().replace(/\/+$/,''),key:$('cl_k').value.trim(),bucket:$('cl_b').value.trim()||'att'};if(!/^https:\/\//.test(o.url)||o.key.length<30)return alert('الرابط أو المفتاح غير صحيح');if(!confirm('تغيير مشروع السحابة؟ ستُرفع بيانات الأجهزة للمشروع الجديد عند أول مزامنة.'))return;localStorage.setItem('cacc_cloud',JSON.stringify(o));localStorage.removeItem('cacc_sync');alert('تم الحفظ. سجّل الخروج ثم ادخل كمدير النظام ليتم الرفع.')}
function clSchema(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([CL_SQL],{type:'text/plain'}));a.download='setup-supabase.sql';a.click()}

const CL_SQL="create table if not exists public.sys(k text primary key, v jsonb);\ncreate table if not exists public.co(cid text primary key, meta jsonb not null, data jsonb not null default '{}'::jsonb, ver bigint not null default 1, upd timestamptz default now());\nalter table public.sys enable row level security;\nalter table public.co enable row level security;\nrevoke all on public.sys, public.co from anon, authenticated;\n\ncreate or replace function public._role(p_cid text, p_u text, p_h text) returns text language plpgsql security definer set search_path=public as $f$\ndeclare m jsonb; r text; adm text;\nbegin\n if p_cid='admin' then\n  select v->>'admin' into adm from public.sys where k='root';\n  if adm is not null and adm=p_h then return 'admin'; end if;\n  return null;\n end if;\n select meta into m from public.co where cid=p_cid;\n if m is null then return null; end if;\n select x->>'role' into r from jsonb_array_elements(m->'users') x where x->>'u'=p_u and x->>'h'=p_h limit 1;\n return r;\nend $f$;\nrevoke all on function public._role(text,text,text) from public, anon, authenticated;\n\ncreate or replace function public.api_pull(p_cid text, p_u text, p_h text, p_admin text default null) returns jsonb language plpgsql security definer set search_path=public as $f$\ndeclare r text; c public.co%rowtype; adm text;\nbegin\n if p_admin is not null then\n  select v->>'admin' into adm from public.sys where k='root';\n  if adm is null or adm<>p_admin then return jsonb_build_object('err','auth'); end if;\n  r:='admin';\n else\n  r:=public._role(p_cid,p_u,p_h);\n end if;\n if r is null then return jsonb_build_object('err','auth'); end if;\n select * into c from public.co where cid=p_cid;\n if c.cid is null then return jsonb_build_object('err','none'); end if;\n return jsonb_build_object('role',r,'meta',c.meta,'data',c.data,'ver',c.ver);\nend $f$;\n\ncreate or replace function public.api_push(p_cid text, p_u text, p_h text, p_meta jsonb, p_data jsonb, p_base bigint, p_admin text default null) returns jsonb language plpgsql security definer set search_path=public as $f$\ndeclare r text; c public.co%rowtype; adm text; nv bigint;\nbegin\n if p_admin is not null then\n  select v->>'admin' into adm from public.sys where k='root';\n  if adm is null or adm<>p_admin then return jsonb_build_object('err','auth'); end if;\n  r:='admin';\n else\n  r:=public._role(p_cid,p_u,p_h);\n end if;\n if r is null then return jsonb_build_object('err','auth'); end if;\n select * into c from public.co where cid=p_cid for update;\n if c.cid is null then\n  if r<>'admin' then return jsonb_build_object('err','auth'); end if;\n  insert into public.co(cid,meta,data,ver) values(p_cid,p_meta,p_data,1);\n  return jsonb_build_object('ok',true,'ver',1);\n end if;\n if c.ver<>p_base then return jsonb_build_object('err','conflict','ver',c.ver,'meta',c.meta,'data',c.data); end if;\n nv:=c.ver+1;\n if r in ('admin','\u0645\u062f\u064a\u0631') then\n  update public.co set meta=p_meta,data=p_data,ver=nv,upd=now() where cid=p_cid;\n else\n  update public.co set data=p_data,ver=nv,upd=now() where cid=p_cid;\n end if;\n return jsonb_build_object('ok',true,'ver',nv);\nend $f$;\n\ncreate or replace function public.api_ver(p_cid text, p_u text, p_h text, p_admin text default null) returns jsonb language plpgsql security definer set search_path=public as $f$\ndeclare r text; adm text; v bigint;\nbegin\n if p_admin is not null then\n  select s.v->>'admin' into adm from public.sys s where k='root';\n  if adm is null or adm<>p_admin then return jsonb_build_object('err','auth'); end if;\n else\n  r:=public._role(p_cid,p_u,p_h);\n  if r is null then return jsonb_build_object('err','auth'); end if;\n end if;\n select ver into v from public.co where cid=p_cid;\n return jsonb_build_object('ver',v);\nend $f$;\n\ncreate or replace function public.api_sys_pull(p_admin text) returns jsonb language plpgsql security definer set search_path=public as $f$\ndeclare s jsonb; cs jsonb;\nbegin\n select v into s from public.sys where k='root';\n if s is null or s->>'admin'<>p_admin then return jsonb_build_object('err','auth'); end if;\n select coalesce(jsonb_agg(jsonb_build_object('cid',cid,'ver',ver)),'[]'::jsonb) into cs from public.co;\n return jsonb_build_object('root',s,'cos',cs);\nend $f$;\n\ncreate or replace function public.api_sys_push(p_admin text, p_root jsonb) returns jsonb language plpgsql security definer set search_path=public as $f$\ndeclare s jsonb; na text;\nbegin\n select v into s from public.sys where k='root';\n na:=coalesce(p_root->>'admin',p_admin);\n if s is null then\n  insert into public.sys(k,v) values('root', coalesce(p_root,'{}'::jsonb) || jsonb_build_object('admin',na));\n  return jsonb_build_object('ok',true);\n end if;\n if s->>'admin'<>p_admin then return jsonb_build_object('err','auth'); end if;\n update public.sys set v=coalesce(p_root,'{}'::jsonb) || jsonb_build_object('admin',na) where k='root';\n return jsonb_build_object('ok',true);\nend $f$;\n\ncreate or replace function public.api_del(p_cid text, p_admin text) returns jsonb language plpgsql security definer set search_path=public as $f$\ndeclare s jsonb;\nbegin\n select v into s from public.sys where k='root';\n if s is null or s->>'admin'<>p_admin then return jsonb_build_object('err','auth'); end if;\n delete from public.co where cid=p_cid;\n return jsonb_build_object('ok',true);\nend $f$;\n\ngrant execute on function public.api_pull(text,text,text,text), public.api_push(text,text,text,jsonb,jsonb,bigint,text), public.api_ver(text,text,text,text), public.api_sys_pull(text), public.api_sys_push(text,jsonb), public.api_del(text,text) to anon;\n\ninsert into storage.buckets(id,name,public,file_size_limit) values('att','att',true,15728640) on conflict (id) do nothing;\ndrop policy if exists att_ins on storage.objects;\ncreate policy att_ins on storage.objects for insert to anon with check (bucket_id='att');\n\ncreate table if not exists public.portal(tok text primary key, cid text not null, data jsonb not null, upd timestamptz default now());\nalter table public.portal enable row level security;\nrevoke all on public.portal from anon, authenticated;\ncreate or replace function public.api_portal_put(p_cid text, p_u text, p_h text, p_tok text, p_data jsonb, p_admin text default null) returns jsonb language plpgsql security definer set search_path=public as $f$\ndeclare r text; adm text;\nbegin\n if p_admin is not null then\n  select v->>'admin' into adm from public.sys where k='root';\n  if adm is null or adm<>p_admin then return jsonb_build_object('err','auth'); end if;\n else\n  r:=public._role(p_cid,p_u,p_h);\n  if r is null or r<>'\u0645\u062f\u064a\u0631' then return jsonb_build_object('err','auth'); end if;\n end if;\n if length(p_tok)<12 then return jsonb_build_object('err','tok'); end if;\n insert into public.portal(tok,cid,data,upd) values(p_tok,p_cid,p_data,now()) on conflict (tok) do update set data=excluded.data, upd=now() where public.portal.cid=p_cid;\n return jsonb_build_object('ok',true);\nend $f$;\ncreate or replace function public.api_portal_get(p_tok text) returns jsonb language sql security definer set search_path=public as $f$\n select coalesce((select jsonb_build_object('ok',true,'data',data,'upd',upd) from public.portal where tok=p_tok), jsonb_build_object('err','none'))\n$f$;\ngrant execute on function public.api_portal_put(text,text,text,text,jsonb,text) to anon;\ngrant execute on function public.api_portal_get(text) to anon;\n\ncreate or replace function public._lvl(p_meta jsonb, p_u text, p_h text, p_mod text) returns int language sql immutable as $f$\n select coalesce((select (x->'perms'->>p_mod)::int from jsonb_array_elements(p_meta->'users') x where x->>'u'=p_u and x->>'h'=p_h limit 1),2)\n$f$;\ncreate or replace function public._perm_ok(p_meta jsonb, p_u text, p_h text, p_old jsonb, p_new jsonb) returns text language plpgsql immutable as $f$\ndeclare k text; m text; mods text[]; ok boolean; mm text;\nbegin\n for k in select jsonb_object_keys(coalesce(p_old,'{}'::jsonb) || coalesce(p_new,'{}'::jsonb)) loop\n  if (p_old->k) is not distinct from (p_new->k) then continue; end if;\n  m := case k\n   when 'stock' then 'stock' when 'items' then 'stock' when 'counts' then 'stock'\n   when 'extracts' then 'ext' when 'boq' then 'ext'\n   when 'parties' then 'party' when 'projects' then 'proj' when 'accounts' then 'chart'\n   when 'cheques' then 'bank' when 'books' then 'bank' when 'bankrec' then 'bank'\n   when 'recon' then 'recon' when 'workers' then 'wages' when 'wlog' then 'wages'\n   when 'payroll' then 'payroll' when 'fa' then 'fa'\n   when 'budgets' then 'bud' when 'eta' then 'eta' when 'phones' then 'wa'\n   when 'whs' then 'wh' when 'whmov' then 'wh' when 'custody' then 'cus' when 'cusx' then 'cus' when 'emps' then 'payroll' when 'payruns' then 'payroll' when 'curs' then 'cur' when 'qt' then 'qt' when 'equip' then 'eq' when 'maint' then 'eq' when 'inst' then 'inst' when 'hr' then 'hr' when 'crm' then 'crm' when 'fac' then 'fac' when 'prodDocs' then 'fac' when 'pj' then 'pj' when 'jtpl' then 'je' when 'sl' then 'sl' when 'fn' then 'fn' when 'mc' then 'mc' when 'cat' then 'ct' when 'uom' then 'ct' when 'rt' then 'rt' when 'ops' then 'ops' when 'closedYears' then '#mgr'\n   when 'settings' then '#mgr'\n   when 'entries' then '#post'\n   else null end;\n  if m is null then continue; end if;\n  if m='#mgr' then return k; end if;\n  if m='#post' then\n   ok:=false;\n   foreach mm in array array['je','pay','trade','ext','sub','stock','bank','recon','rev','wages','pos','payroll','fa','cus','cur','eq','inst','qt','wh','hr','fac','crm','pj','sl','fn','rt','ops'] loop\n    if public._lvl(p_meta,p_u,p_h,mm)>=2 then ok:=true; end if;\n   end loop;\n   if not ok then return k; end if;\n  elsif public._lvl(p_meta,p_u,p_h,m)<2 then return k;\n  end if;\n end loop;\n return null;\nend $f$;\ncreate or replace function public.api_push(p_cid text, p_u text, p_h text, p_meta jsonb, p_data jsonb, p_base bigint, p_admin text default null) returns jsonb language plpgsql security definer set search_path=public as $f$\ndeclare r text; c public.co%rowtype; adm text; nv bigint; bad text;\nbegin\n if p_admin is not null then\n  select v->>'admin' into adm from public.sys where k='root';\n  if adm is null or adm<>p_admin then return jsonb_build_object('err','auth'); end if;\n  r:='admin';\n else\n  r:=public._role(p_cid,p_u,p_h);\n end if;\n if r is null then return jsonb_build_object('err','auth'); end if;\n select * into c from public.co where cid=p_cid for update;\n if c.cid is null then\n  if r<>'admin' then return jsonb_build_object('err','auth'); end if;\n  insert into public.co(cid,meta,data,ver) values(p_cid,p_meta,p_data,1);\n  return jsonb_build_object('ok',true,'ver',1);\n end if;\n if c.ver<>p_base then return jsonb_build_object('err','conflict','ver',c.ver,'meta',c.meta,'data',c.data); end if;\n if r in ('admin','\u0645\u062f\u064a\u0631') then\n  update public.co set meta=p_meta,data=p_data,ver=c.ver+1,upd=now() where cid=p_cid;\n else\n  bad:=public._perm_ok(c.meta,p_u,p_h,c.data,p_data);\n  if bad is not null then return jsonb_build_object('err','perm','key',bad,'ver',c.ver); end if;\n  update public.co set data=p_data,ver=c.ver+1,upd=now() where cid=p_cid;\n end if;\n return jsonb_build_object('ok',true,'ver',c.ver+1);\nend $f$;\ngrant execute on function public.api_push(text,text,text,jsonb,jsonb,bigint,text) to anon;\nrevoke all on function public._lvl(jsonb,text,text,text), public._perm_ok(jsonb,text,text,jsonb,jsonb) from public, anon, authenticated;\n\ncreate or replace function public.api_sys_push(p_admin text, p_root jsonb) returns jsonb language plpgsql security definer set search_path=public as $f$\ndeclare s jsonb; o jsonb; na text;\nbegin\n if p_admin is null or length(p_admin)<4 then return jsonb_build_object('err','auth'); end if;\n select v into s from public.sys where k='root';\n na:=coalesce(p_root->>'admin',p_admin);\n if s is null then\n  select v into o from public.sys where k='setup';\n  if o is null or coalesce((o->>'until')::timestamptz,'1970-01-01'::timestamptz)<now() then return jsonb_build_object('err','closed'); end if;\n  insert into public.sys(k,v) values('root', coalesce(p_root,'{}'::jsonb) || jsonb_build_object('admin',na));\n  delete from public.sys where k='setup';\n  return jsonb_build_object('ok',true);\n end if;\n if s->>'admin' is distinct from p_admin then return jsonb_build_object('err','auth'); end if;\n update public.sys set v=coalesce(p_root,'{}'::jsonb) || jsonb_build_object('admin',na) where k='root';\n return jsonb_build_object('ok',true);\nend $f$;\ncreate or replace function public.api_sys_pull(p_admin text) returns jsonb language plpgsql security definer set search_path=public as $f$\ndeclare s jsonb; cs jsonb;\nbegin\n select v into s from public.sys where k='root';\n if s is null or p_admin is null or s->>'admin' is distinct from p_admin then return jsonb_build_object('err','auth'); end if;\n select coalesce(jsonb_agg(jsonb_build_object('cid',cid,'ver',ver)),'[]'::jsonb) into cs from public.co;\n return jsonb_build_object('root',s,'cos',cs);\nend $f$;\ncreate or replace function public.api_del(p_cid text, p_admin text) returns jsonb language plpgsql security definer set search_path=public as $f$\ndeclare s jsonb;\nbegin\n select v into s from public.sys where k='root';\n if s is null or p_admin is null or s->>'admin' is distinct from p_admin then return jsonb_build_object('err','auth'); end if;\n delete from public.co where cid=p_cid;\n return jsonb_build_object('ok',true);\nend $f$;\ngrant execute on function public.api_sys_push(text,jsonb), public.api_sys_pull(text), public.api_del(text,text) to anon;\n\ncreate or replace function public._strip(p_meta jsonb, p_u text) returns jsonb language sql immutable as $f$\n select case when p_meta ? 'users' then jsonb_set(p_meta,'{users}', coalesce((select jsonb_agg(case when x->>'u'=p_u then x else x - 'h' end) from jsonb_array_elements(p_meta->'users') x),'[]'::jsonb)) else p_meta end\n$f$;\ncreate or replace function public._fillh(p_new jsonb, p_old jsonb) returns jsonb language sql immutable as $f$\n select case when p_new ? 'users' then jsonb_set(p_new,'{users}', coalesce((select jsonb_agg(case when coalesce(x->>'h','')<>'' then x else x || jsonb_build_object('h', coalesce((select y->>'h' from jsonb_array_elements(coalesce(p_old->'users','[]'::jsonb)) y where y->>'u'=x->>'u' limit 1),'')) end) from jsonb_array_elements(p_new->'users') x),'[]'::jsonb)) else p_new end\n$f$;\nrevoke all on function public._strip(jsonb,text), public._fillh(jsonb,jsonb) from public, anon, authenticated;\ncreate or replace function public.api_upgrade_pw(p_cid text, p_u text, p_old text, p_new text) returns jsonb language plpgsql security definer set search_path=public as $f$\ndeclare m jsonb;\nbegin\n if p_new is null or p_new not like 'p2:%' or length(p_new)<40 or p_old is null or p_old like 'p2:%' then return jsonb_build_object('err','bad'); end if;\n select meta into m from public.co where cid=p_cid;\n if m is null or not exists(select 1 from jsonb_array_elements(m->'users') x where x->>'u'=p_u and x->>'h'=p_old) then return jsonb_build_object('err','auth'); end if;\n update public.co set meta=jsonb_set(meta,'{users}',(select jsonb_agg(case when x->>'u'=p_u and x->>'h'=p_old then x||jsonb_build_object('h',p_new) else x end) from jsonb_array_elements(meta->'users') x)), ver=ver+1, upd=now() where cid=p_cid;\n return jsonb_build_object('ok',true);\nend $f$;\ngrant execute on function public.api_upgrade_pw(text,text,text,text) to anon;\ncreate or replace function public.api_pull(p_cid text, p_u text, p_h text, p_admin text default null) returns jsonb language plpgsql security definer set search_path=public as $f$\ndeclare r text; c public.co%rowtype; adm text;\nbegin\n if p_admin is not null then\n  select v->>'admin' into adm from public.sys where k='root';\n  if adm is null or adm<>p_admin then return jsonb_build_object('err','auth'); end if;\n  r:='admin';\n else\n  r:=public._role(p_cid,p_u,p_h);\n end if;\n if r is null then return jsonb_build_object('err','auth'); end if;\n select * into c from public.co where cid=p_cid;\n if c.cid is null then return jsonb_build_object('err','none'); end if;\n return jsonb_build_object('role',r,'meta',case when r in ('admin','مدير') then c.meta else public._strip(c.meta,p_u) end,'data',c.data,'ver',c.ver);\nend $f$;\ncreate or replace function public.api_push(p_cid text, p_u text, p_h text, p_meta jsonb, p_data jsonb, p_base bigint, p_admin text default null) returns jsonb language plpgsql security definer set search_path=public as $f$\ndeclare r text; c public.co%rowtype; adm text; bad text;\nbegin\n if p_admin is not null then\n  select v->>'admin' into adm from public.sys where k='root';\n  if adm is null or adm<>p_admin then return jsonb_build_object('err','auth'); end if;\n  r:='admin';\n else\n  r:=public._role(p_cid,p_u,p_h);\n end if;\n if r is null then return jsonb_build_object('err','auth'); end if;\n select * into c from public.co where cid=p_cid for update;\n if c.cid is null then\n  if r<>'admin' then return jsonb_build_object('err','auth'); end if;\n  insert into public.co(cid,meta,data,ver) values(p_cid,p_meta,p_data,1);\n  return jsonb_build_object('ok',true,'ver',1);\n end if;\n if c.ver<>p_base then return jsonb_build_object('err','conflict','ver',c.ver,'meta',case when r in ('admin','مدير') then c.meta else public._strip(c.meta,p_u) end,'data',c.data); end if;\n if r in ('admin','مدير') then\n  update public.co set meta=public._fillh(p_meta,c.meta),data=p_data,ver=c.ver+1,upd=now() where cid=p_cid;\n else\n  bad:=public._perm_ok(c.meta,p_u,p_h,c.data,p_data);\n  if bad is not null then return jsonb_build_object('err','perm','key',bad,'ver',c.ver); end if;\n  update public.co set data=p_data,ver=c.ver+1,upd=now() where cid=p_cid;\n end if;\n return jsonb_build_object('ok',true,'ver',c.ver+1);\nend $f$;\ngrant execute on function public.api_pull(text,text,text,text), public.api_push(text,text,text,jsonb,jsonb,bigint,text) to anon;\ndrop policy if exists att_ins on storage.objects;\ngrant execute on function public._role(text,text,text) to anon;\ncreate policy att_ins on storage.objects for insert to anon with check (bucket_id='att' and ((current_setting('request.headers',true)::jsonb->>'x-adm') is not null and exists(select 1 from public.sys where k='root' and v->>'admin'=(current_setting('request.headers',true)::jsonb->>'x-adm')) or public._role((storage.foldername(name))[1], convert_from(decode(coalesce(current_setting('request.headers',true)::jsonb->>'x-u',''),'base64'),'UTF8'), current_setting('request.headers',true)::jsonb->>'x-h') is not null));\n";

{const _f=invForm;invForm=function(){_f.apply(this,arguments);invCurUI()}}
