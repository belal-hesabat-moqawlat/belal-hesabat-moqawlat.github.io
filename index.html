function xRead(x){x.no=+$('xf_no').value||x.no;x.date=$('xf_d').value;x.customer=$('xf_c').value;x.vatRate=+$('xf_v').value||0;x.whRate=+$('xf_w').value||0;

function xlive(id){const x=DB.extracts.find(e=>e.id==id);xRead(x);(DB.boq[x.project]||[]).forEach(b=>{const pq=prevQty(x.project,b.id,x.no),c=(x.items.find(i=>i.boq==b.id)||{}).cur;$('xc_'+b.id).textContent=fmt(pq+c);$('xv_'+b.id).textContent=fmt(c*b.price);$('xpc_'+b.id).textContent=(b.qty?Math.round((pq+c)/b.qty*100):0)+'%'});
 $('xt_g').textContent=fmt(x.gross);$('xt_v').textContent=fmt(x.vat);$('xt_w').textContent=fmt(x.wh);$('xt_d').textContent=fmt(x.dedTot);$('xt_n').textContent=fmt(x.net)}
function xSave(id,approve){try{const x=DB.extracts.find(e=>e.id==id);xRead(x);
 if(DB.extracts.some(e=>e!==x&&e.project==x.project&&e.no==x.no))throw new Error('رقم المستخلص مكرر في نفس المشروع');
 for(const b of DB.boq[x.project]){const pq=prevQty(x.project,b.id,x.no),c=(x.items.find(i=>i.boq==b.id)||{}).cur;if(pq+c>b.qty+1e-9)throw new Error('الكمية التراكمية تتجاوز كمية العقد للبند: '+b.desc)}
 if(!x.gross)throw new Error('لا توجد كميات حالية');
 DB.last.vat=x.vatRate;DB.last.wh=x.whRate;save();if(approve){if(!ok(3))throw new Error('الاعتماد يحتاج صلاحية اعتماد');xPost(x);}xedit=null;R.ext();msg(approve?'تم اعتماد المستخلص وترحيله ✔':'تم الحفظ',1)}catch(e){msg(e.message)}}

 const L=[{acc:'1701',debit:x.gross+x.vat,party:c,project:p},{acc:'4101',credit:x.gross,project:p},{acc:'2851',credit:x.vat,project:p},{acc:'1751',debit:x.wh,project:p}];
 DEDS.forEach(d=>{const a=+x.ded[d[0]]||0;if(a)L.push(d[2]=='2805'||d[2]=='1703'||d[2]=='1704'?{acc:d[2],[d[2]=='2805'?'debit':'debit']:a,party:c,project:p}:{acc:d[2],debit:a,project:p})});
 L.push({acc:'1701',credit:x.wh+x.dedTot,party:c,project:p});
 const e=addEntry(x.date,'مستخلص رقم '+x.no+' - '+proj(p).name,'مستخلص '+x.no,L);x.status='معتمد';x.entry=e.id;save()}

 const rows=bq.map((b,i)=>{const pq=prevQty(x.project,b.id,x.no),cu=(x.items.find(t=>t.boq==b.id)||{}).cur||0;return `<tr><td>${i+1}</td><td>${b.desc}</td><td>${b.unit}</td><td>${fmt(b.price)}</td><td>${fmt(b.qty)}</td><td>${fmt(pq)}</td><td>${fmt(cu)}</td><td>${fmt(pq+cu)}</td><td>${fmt(cu*b.price)}</td></tr>`}).join('');

 <table><tr><th>م</th><th>البند</th><th>الوحدة</th><th>السعر</th><th>كمية العقد</th><th>سابق</th><th>حالي</th><th>تراكمي</th><th>قيمة حالية</th></tr>${rows}</table>
 <table class="s" style="width:55%"><tr><td>إجمالي الأعمال</td><td>${fmt(x.gross)}</td></tr><tr><td>ض.ق.م ${x.vatRate}%</td><td>${fmt(x.vat)}</td></tr><tr><td>خصم وإضافة ${x.whRate}%</td><td>(${fmt(x.wh)})</td></tr>${ded}<tr><th>الصافي المستحق</th><th>${fmt(x.net)}</th></tr></table>
 <div class="sg"><span>المحاسب</span><span>المهندس</span><span>الاعتماد</span></div><script>setTimeout(()=>print(),300)<\/script></body></html>`);w.document.close()}

 <p><button class="b g" onclick="wageDay()">تسجيل يوميات</button> <button class="b" onclick="wageAdv()">صرف سلفة</button> <button class="b" onclick="wageSettle()">تسوية وصرف الصافي</button></p><div id="msg"></div></div>
 <div class="card"><h2>كشف العمالة</h2>${W.length?table(['العامل','اليومية','المستحق','السلف','الصافي'],W.map(w=>{const s=st(w);return[esc(w.name),fmt(w.daily),fmt(s.e),fmt(s.a),fmt(s.net)]}),[1,2,3,4]):'<p>لا يوجد عمال</p>'}</div>`;window._wst=st};
function addWorker(){const n=$('wn').value.trim();if(!n)return msg('اكتب الاسم');DB.workers.push({id:'W'+Date.now(),name:n,daily:+$('wd').value||0});logA('عامل جديد '+n);save();R.wages()}
function wInit(){ensureAcc('1708','سلف عاملين');ensureAcc('2807','أجور مستحقة');ensureAcc('3201','أجور عمالة مباشرة')}
function wageDay(){try{if(!ok(2))return;wInit();const w=DB.workers.find(x=>x.id==$('ww').value);if(!w)throw new Error('اختر العامل');const p=$('wp').value;if(!p)throw new Error('اختر المشروع');const d=+$('wdy').value,amt=d*w.daily;if(!(amt>0))throw new Error('اليومية أو الأيام = 0');
 const e=addEntry($('wdt').value,'يومية عامل '+w.name+' ('+d+' يوم)','',[{acc:'3201',debit:amt,project:p},{acc:'2807',credit:amt}]);DB.wlog.push({k:'w',w:w.id,amt,date:$('wdt').value,e:e.id});save();R.wages();msg('تم التسجيل',1)}catch(e){msg(e.message)}}
function wageAdv(){try{if(!ok(2))return;wInit();const w=DB.workers.find(x=>x.id==$('ww').value),a=+$('wa').value;if(!w||!(a>0))throw new Error('اختر العامل واكتب المبلغ');
 const e=addEntry($('wdt').value,'سلفة عامل '+w.name,'',[{acc:'1708',debit:a},{acc:$('wc').value,credit:a}]);DB.wlog.push({k:'a',w:w.id,amt:a,date:$('wdt').value,e:e.id});save();R.wages();msg('تم صرف السلفة',1)}catch(e){msg(e.message)}}
function wageSettle(){try{if(!ok(2))return;wInit();const w=DB.workers.find(x=>x.id==$('ww').value);if(!w)throw new Error('اختر العامل');const s=_wst(w);if(!(s.e>0))throw new Error('لا يوجد مستحق');const ded=Math.min(s.a,s.e),net=s.e-ded;
 const L=[{acc:'2807',debit:s.e}];if(ded)L.push({acc:'1708',credit:ded});if(net)L.push({acc:$('wc').value,credit:net});const e=addEntry($('wdt').value,'تسوية أجور '+w.name,'',L);DB.wlog.push({k:'s',w:w.id,e:s.e,a:ded,date:$('wdt').value,en:e.id});save();R.wages();msg('تمت التسوية: صافي مصروف '+fmt(net),1)}catch(e){msg(e.message)}}

let CART=[];
R.pos=()=>{const its=DB.items;$('main').innerHTML=`<div class="card"><h2>نقطة البيع</h2><div class="row"><div style="flex:2"><label>الباركود (اضغط Enter)</label><input id="bc" onkeydown="if(event.key=='Enter'){posScan(this.value);this.value=''}" autofocus></div><div><label>العميل (اختياري)</label><select id="pc2">${partyOpts('عميل','— نقدي —')}</select></div><div><label>الدفع</label><select id="pm">${accOpts('1901',a=>/^19/.test(a.code))}</select></div></div>
 <div class="apps" style="margin:10px 0">${its.filter(i=>i.price).map(i=>`<a class="app" onclick="posAdd('${i.id}')"><span style="font-weight:700">${esc(i.name)}</span><span>${fmt(i.price)}</span></a>`).join('')||'<p>أضف أصنافاً بسعر بيع من الأسفل أو من استيراد Excel</p>'}</div>
 <div id="cart"></div></div>
 <div class="card"><h2>إضافة صنف سريع</h2><div class="row"><div><label>الاسم</label><input id="pn1"></div><div><label>الوحدة</label><input id="pu1" value="قطعة"></div><div><label>الباركود</label><input id="pb1"></div><div><label>سعر البيع</label><input id="pp1" type="number"></div><div><button class="b g" onclick="posNew()">حفظ</button></div></div><div id="msg"></div></div>`;posDraw()};
function posNew(){const n=$('pn1').value.trim();if(!n||!(+$('pp1').value>0))return msg('اكتب الاسم والسعر');DB.items.push({id:'I'+String(DB.items.length+1).padStart(3,'0'),name:n,unit:$('pu1').value,barcode:$('pb1').value,price:+$('pp1').value});save();R.pos()}
function posScan(c){c=c.trim();if(!c)return;const i=DB.items.find(x=>x.barcode==c);if(!i)return msg('الباركود غير موجود: '+c);posAdd(i.id)}
function posAdd(id){const i=DB.items.find(x=>x.id==id),l=CART.find(x=>x.id==id);if(l)l.q++;else CART.push({id,name:i.name,p:i.price||+prompt('سعر البيع؟')||0,q:1});posDraw()}
function posQ(id,d){const l=CART.find(x=>x.id==id);l.q+=d;if(l.q<=0)CART=CART.filter(x=>x.id!=id);posDraw()}
function posTot(){return CART.reduce((s,l)=>s+l.p*l.q,0)}
function posDraw(){const c=$('cart');if(!c)return;c.innerHTML=CART.length?table(['الصنف','السعر','الكمية','الإجمالي',''],CART.map(l=>[esc(l.name),fmt(l.p),`<button class="b l" onclick="posQ('${l.id}',-1)">-</button> ${l.q} <button class="b l" onclick="posQ('${l.id}',1)">+</button>`,fmt(l.p*l.q),'']),[1,3])+`<p style="font-size:22px"><b>الإجمالي: ${fmt(posTot())}</b></p><button class="b g" onclick="posPay()">إتمام البيع</button> <button class="b l" onclick="CART=[];posDraw()">إلغاء</button>`:'<p>السلة فارغة</p>'}
function posPay(){try{if(!ok(2))return;const t=posTot(),cu=$('pc2').value;const d=CART.map(l=>l.name+' x'+l.q).join('، ');addEntry(today(),'نقطة بيع: '+d,'',[cu?{acc:'1701',debit:t,party:cu}:{acc:$('pm').value,debit:t},{acc:'4101',credit:t}]);const rc=table(['الصنف','السعر','الكمية','الإجمالي'],CART.map(l=>[esc(l.name),fmt(l.p),l.q,fmt(l.p*l.q)]),[1,2,3])+'<h2>الإجمالي: '+fmt(t)+'</h2>';CART=[];posDraw();msg('تم البيع',1);if(confirm('طباعة الإيصال؟'))printHTML('إيصال بيع',rc)}catch(e){msg(e.message)}}
/* ETA e-invoice */
R.eta=()=>{const E=DB.eta=DB.eta||{issuer:{}};const i=E.issuer;
 $('main').innerHTML=`<div class="card"><h2>الفاتورة الإلكترونية (صيغة مصلحة الضرائب ETA)</h2><p style="color:#6b7686">يجهّز الفاتورة بنفس هيكل بيانات منظومة الفاتورة الإلكترونية (JSON) لتحميلها أو طباعتها. التوقيع الإلكتروني والإرسال للمنظومة يتمان من أداة التوقيع المعتمدة.</p>
 <h3>بيانات المُصدر</h3><div class="grid"><div><label>الرقم الضريبي</label><input id="e_rin" value="${esc(i.rin||'')}"></div><div><label>الاسم</label><input id="e_in" value="${esc(i.name||CUR.name)}"></div><div><label>كود الفرع</label><input id="e_br" value="${esc(i.br||'0')}"></div><div><label>كود النشاط</label><input id="e_ac" value="${esc(i.act||'')}"></div></div>
 <h3>المستلم</h3><div class="grid"><div><label>النوع</label><select id="e_rt"><option value="B">شركة (B)</option><option value="P">فرد (P)</option></select></div><div><label>الاسم</label><input id="e_rn"></div><div><label>الرقم الضريبي / القومي</label><input id="e_rid"></div><div><label>التاريخ والوقت</label><input id="e_dt" type="datetime-local" value="${new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16)}"></div><div><label>رقم الفاتورة الداخلي</label><input id="e_no" value="INV-${(E.docs||[]).length+1}"></div></div>
 <h3>البنود</h3><div class="scroll"><table id="el"><tr><th>الوصف</th><th>كود الصنف</th><th>الكمية</th><th>سعر الوحدة</th><th>ض.ق.م %</th></tr></table></div><p><button class="b l" onclick="etaRow()">+ بند</button> <button class="b g" onclick="etaBuild()">إنشاء</button></p><div id="msg"></div><div id="eo"></div></div>`;etaRow()};
function etaRow(){$('el').insertAdjacentHTML('beforeend','<tr><td><input class="ed"></td><td><input class="ec"></td><td><input class="eq" type="number" value="1" style="width:70px"></td><td><input class="ep" type="number" style="width:100px"></td><td><input class="ev" type="number" value="14" style="width:60px"></td></tr>')}
function etaBuild(){try{const E=DB.eta;E.issuer={rin:$('e_rin').value,name:$('e_in').value,br:$('e_br').value,act:$('e_ac').value};
 let sales=0,vat=0;const lines=[...document.querySelectorAll('#el tr')].slice(1).map(r=>{const q=+r.querySelector('.eq').value,p=+r.querySelector('.ep').value,v=+r.querySelector('.ev').value||0,d=r.querySelector('.ed').value;if(!d||!(q>0)||!(p>0))return null;const tot=Math.round(q*p*100)/100,t=Math.round(tot*v)/100;sales+=tot;vat+=t;return{description:d,itemType:'EGS',itemCode:r.querySelector('.ec').value||'EG-'+E.issuer.rin+'-1',unitType:'EA',quantity:q,internalCode:'',salesTotal:tot,total:Math.round((tot+t)*100)/100,valueDifference:0,totalTaxableFees:0,netTotal:tot,itemsDiscount:0,unitValue:{currencySold:'EGP',amountEGP:p},discount:{rate:0,amount:0},taxableItems:[{taxType:'T1',amount:t,subType:'V009',rate:v}]}}).filter(Boolean);
 if(!lines.length)throw new Error('أضف بنداً صحيحاً');if(!E.issuer.rin)throw new Error('اكتب الرقم الضريبي للمُصدر');
 const doc={issuer:{type:'B',id:E.issuer.rin,name:E.issuer.name,address:{branchID:E.issuer.br,country:'EG'}},receiver:{type:$('e_rt').value,id:$('e_rid').value,name:$('e_rn').value},documentType:'I',documentTypeVersion:'1.0',dateTimeIssued:$('e_dt').value+':00Z',taxpayerActivityCode:E.issuer.act,internalID:$('e_no').value,invoiceLines:lines,totalSalesAmount:sales,totalDiscountAmount:0,netAmount:sales,taxTotals:[{taxType:'T1',amount:vat}],totalAmount:Math.round((sales+vat)*100)/100,extraDiscountAmount:0,totalItemsDiscountAmount:0};
 E.docs=E.docs||[];E.docs.push({no:doc.internalID,at:doc.dateTimeIssued,total:doc.totalAmount});logA('فاتورة إلكترونية '+doc.internalID);save();window._eta=doc;
 $('eo').innerHTML=`<h3>الإجمالي: ${fmt(sales)} + ض.ق.م ${fmt(vat)} = ${fmt(doc.totalAmount)}</h3><p><button class="b g" onclick="etaDl()">تحميل JSON</button> <button class="b l" onclick="etaPr()">طباعة / PDF</button></p><textarea rows="10" style="width:100%;direction:ltr" readonly>${esc(JSON.stringify(doc,null,2))}</textarea>`}catch(e){msg(e.message)}}
function etaDl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({documents:[window._eta]},null,1)],{type:'application/json'}));a.download=window._eta.internalID+'.json';a.click()}
function etaPr(){const d=window._eta;printHTML('فاتورة ضريبية '+d.internalID,`<p>الرقم الضريبي: ${esc(d.issuer.id)} | المستلم: ${esc(d.receiver.name)} (${esc(d.receiver.id)}) | ${d.dateTimeIssued}</p>`+table(['الوصف','الكمية','السعر','الإجمالي','ض.ق.م %','الصافي'],d.invoiceLines.map(l=>[esc(l.description),l.quantity,fmt(l.unitValue.amountEGP),fmt(l.salesTotal),l.taxableItems[0].rate,fmt(l.total)]),[1,2,3,4,5])+`<h2>الإجمالي: ${fmt(d.totalAmount)}</h2>`)}

/* Q&A */
function balParty(id){let d=0,c=0;DB.entries.forEach(e=>e.lines.forEach(l=>{if(l.party==id){d+=l.debit;c+=l.credit}}));return d-c}
function answerQ(q){q=q.replace(/[؟?!]/g,'').trim();if(!q)return 'اكتب سؤالك';const has=(...w)=>w.some(x=>q.includes(x));const rows=tb();
 const sum=p=>rows.filter(r=>!r.a.header&&r.a.code[0]==p).reduce((s,r)=>s+(p=='4'?r.c-r.d:p=='3'?r.d-r.c:r.c-r.d),0);
 const cashAcc=DB.accounts.filter(a=>!a.header&&/^19/.test(a.code)).map(a=>{const b=bal(a.code);return[a.name,b.d-b.c]});
 const pj=DB.projects.find(p=>q.includes(p.name)),pa=DB.parties.find(p=>q.includes(p.name)),it=DB.items.find(i=>q.includes(i.name));
 if(pj){let rev=0,cost=0;DB.entries.forEach(e=>e.lines.forEach(l=>{if(l.project!=pj.id)return;if(l.acc[0]=='4')rev+=l.credit-l.debit;if(l.acc[0]=='3')cost+=l.debit-l.credit}));return `مشروع ${pj.name}: الإيراد ${fmt(rev)} ، التكلفة ${fmt(cost)} ، الربح ${fmt(rev-cost)} ، قيمة العقد ${fmt(pj.value)}`}
 if(pa){const b=balParty(pa.id);return `${pa.name} (${pa.type}): ${b>0.005?'عليه لنا '+fmt(b):b<-0.005?'له علينا '+fmt(-b):'الرصيد صفر'}`}
 if(it){try{const L=replay(DB.stock).filter(l=>l.item==it.id);const qn=L.reduce((s,l)=>s+l.rem,0),v=L.reduce((s,l)=>s+l.rem*l.cost,0);return `${it.name}: المتاح ${fmt(qn)} ${it.unit} بقيمة ${fmt(v)}`}catch(e){}}
 if(has('خزنة','نقدية','كاش','سيولة','بنك','فلوس'))return 'النقدية والبنوك: '+fmt(cashAcc.reduce((s,x)=>s+x[1],0))+'\n'+cashAcc.map(x=>x[0]+': '+fmt(x[1])).join('\n');
 if(has('ربح','كسب','خسار','خسران'))return `صافي الربح ${fmt(sum('4')-sum('3'))} (إيرادات ${fmt(sum('4'))} - تكاليف ${fmt(sum('3'))})`;
 if(has('مبيعات','إيراد','دخل'))return 'إجمالي الإيرادات/المبيعات: '+fmt(sum('4'));
 if(has('مصروف','تكلفة','تكاليف','صرفنا'))return 'إجمالي التكاليف والمصروفات: '+fmt(sum('3'));
 if(has('متأخر','مديونية','العملاء','عليهم','مستحق لنا')){const L=DB.parties.filter(p=>p.type=='عميل').map(p=>[p.name,balParty(p.id)]).filter(x=>x[1]>0.005).sort((a,b)=>b[1]-a[1]);return L.length?'أرصدة العملاء:\n'+L.map(x=>x[0]+': '+fmt(x[1])).join('\n'):'لا توجد مبالغ مستحقة على العملاء'}
 if(has('مورد','موردين','ندين','علينا','مستحق للموردين')){const L=DB.parties.filter(p=>p.type!='عميل').map(p=>[p.name,-balParty(p.id)]).filter(x=>x[1]>0.005).sort((a,b)=>b[1]-a[1]);return L.length?'مستحق للموردين:\n'+L.map(x=>x[0]+': '+fmt(x[1])).join('\n'):'لا توجد مستحقات للموردين'}
 if(has('مخزون','مخزن','أصناف')){try{const m={};replay(DB.stock).forEach(l=>{m[l.item]=(m[l.item]||0)+l.rem});return 'أرصدة المخزون:\n'+DB.items.map(i=>i.name+': '+fmt(m[i.id]||0)+' '+i.unit).join('\n')}catch(e){}}
 if(has('تنبيه','ملاحظات')){const A=alertList();return A.length?A.map(a=>a[1]).join('\n'):'لا توجد تنبيهات'}
 return 'أقدر أجاوب عن: النقدية، الربح، المبيعات، المصروفات، العملاء المتأخرين، الموردين، المخزون، التنبيهات، أو اكتب اسم عميل أو مورد أو مشروع أو صنف.'}
R.ask=()=>{$('main').innerHTML=`<div class="card"><h2>اسأل البرنامج</h2><p style="color:#6b7686">مساعد محلي يجاوب من بيانات شركتك مباشرة على جهازك (بدون إنترنت أو خدمة مدفوعة). أمثلة:</p><p>${['كام رصيد الخزنة؟','صافي الربح كام؟','مين العملاء المتأخرين؟','الموردين علينا كام؟','رصيد المخزون','فيه تنبيهات؟'].map(x=>`<a class="lk" style="margin-left:12px" onclick="$('qq').value='${x}';askGo()">${x}</a>`).join(' ')}</p><div class="row"><div style="flex:4"><input id="qq" placeholder="اكتب سؤالك" onkeydown="if(event.key=='Enter')askGo()"></div><div><button class="b g" onclick="askGo()">اسأل</button></div></div><pre id="qa" style="white-space:pre-wrap;font-family:inherit;font-size:15px;margin-top:12px"></pre></div>`};
function askGo(){$('qa').textContent=answerQ($('qq').value)}
/* WhatsApp + daily */
const waNum=p=>{p=(p||'').replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);else if(p.startsWith('0'))p='20'+p.slice(1);return p};
const waLink=(p,t)=>'https://wa.me/'+waNum(p)+'?text='+encodeURIComponent(t);
function dailyText(d){let sales=0,exp=0,rin=0,rout=0,cash=0;DB.entries.forEach(e=>e.lines.forEach(l=>{if(/^19/.test(l.acc)&&e.date<=d)cash+=l.debit-l.credit;if(e.date!=d)return;if(l.acc[0]=='4')sales+=l.credit-l.debit;if(l.acc[0]=='3')exp+=l.debit-l.credit;if(/^19/.test(l.acc)){rin+=l.debit;rout+=l.credit}}));
 return `ملخص يوم ${d} - ${CUR.name}\nالمبيعات/الإيرادات: ${fmt(sales)}\nالمصروفات والتكاليف: ${fmt(exp)}\nالمقبوضات: ${fmt(rin)}\nالمدفوعات: ${fmt(rout)}\nرصيد النقدية والبنوك: ${fmt(cash)}`}
R.wa=()=>{DB.phones=DB.phones||{};$('main').innerHTML=`<div class="card"><h2>الملخص اليومي</h2><div class="row"><div><label>اليوم</label><input id="wd1" type="date" value="${today()}" onchange="$('wt1').value=dailyText(this.value)"></div></div><textarea id="wt1" rows="6" style="width:100%">${dailyText(today())}</textarea><p><button class="b g" onclick="window.open(waLink('',$('wt1').value),'_blank')">إرسال عبر واتساب</button> <button class="b l" onclick="navigator.clipboard&&navigator.clipboard.writeText($('wt1').value);msg('تم النسخ',1)">نسخ</button></p></div>
 <div class="card"><h2>كشف حساب / تذكير سداد لعميل أو مورد</h2><div class="row"><div><label>الطرف</label><select id="wp1" onchange="waParty()">${partyOpts('','— اختر —')}</select></div><div><label>رقم الواتساب</label><input id="wph" placeholder="01xxxxxxxxx" onchange="waSavePh()"></div></div><textarea id="wt2" rows="8" style="width:100%"></textarea><p><button class="b g" onclick="waSend()">إرسال عبر واتساب</button> <button class="b" onclick="waParty(1)">صيغة تذكير بالسداد</button> <button class="b l" onclick="waParty()">صيغة كشف حساب</button></p><div id="msg"></div></div>`};
function waSavePh(){const p=$('wp1').value;if(p){DB.phones[p]=$('wph').value;save()}}
function waParty(rem){const id=$('wp1').value;if(!id)return;$('wph').value=DB.phones[id]||'';const p=party(id),b=balParty(id);const mv=[];DB.entries.forEach(e=>e.lines.forEach(l=>{if(l.party==id)mv.push(e.date+' '+e.desc.slice(0,30)+' : '+(l.debit?'+'+fmt(l.debit):'-'+fmt(l.credit)))}));
 const who=p.type=='عميل'?b:-b;$('wt2').value=rem===1?`السلام عليكم ${p.name}،\nتذكير ودي من ${CUR.name}: يوجد رصيد مستحق بقيمة ${fmt(Math.abs(b))} نرجو التكرم بالسداد في أقرب وقت.\nشكراً لتعاملكم.`:`كشف حساب ${p.name} - ${CUR.name}\n${mv.slice(-10).join('\n')}\nالرصيد: ${fmt(Math.abs(b))} ${b>0.005?'(مستحق لنا)':b<-0.005?'(مستحق لكم)':''}`}

function chqs(){DB.cheques=DB.cheques||[];DB.cheques.forEach(c=>{if(!c.status)c.status=c.done?(c.kind=='r'?'collected':'cleared'):(c.kind=='r'?'under':'issued');if(!c.ent)c.ent=[]});return DB.cheques}

 $('main').innerHTML=`<div class="card"><h2>البنك والشيكات والكمبيالات</h2><div class="grid"><div class="kpi">شيكات وارد تحت التحصيل<b>${fmt(sm('under'))}</b></div><div class="kpi">شيكات صادرة لم تُصرف<b>${fmt(sm('issued'))}</b></div><div class="kpi">مرتدة<b>${fmt(sm('bounced'))}</b></div></div></div>
 <div class="card"><h2>ورقة جديدة (شيك / كمبيالة)</h2><div class="grid"><div><label>الاتجاه</label><select id="ck_k" onchange="chBook()"><option value="r">وارد (من عميل)</option><option value="p">صادر (لمورد)</option></select></div><div><label>النوع</label><select id="ck_t"><option>شيك</option><option>كمبيالة / سند إذني</option></select></div><div><label>الطرف</label><select id="ck_p">${partyOpts('','— اختر —')}</select></div><div><label>رقم الورقة</label><input id="ck_n"></div><div><label>دفتر الشيكات (للصادر)</label><select id="ck_b" onchange="chBook()"><option value="">— بدون —</option>${DB.books.filter(b=>b.kind=='chq').map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div><div><label>البنك</label><select id="ck_a">${bankO}</select></div><div><label>المبلغ</label><input id="ck_m" type="number" step="any"></div><div><label>تاريخ الاستحقاق</label><input id="ck_due" type="date" value="${today()}"></div></div><p><button class="b g" onclick="chAdd()">تسجيل وإنشاء القيد</button></p><div id="msg"></div></div>
 <div class="card"><h2>سجل الأوراق</h2>${C.length?table(['النوع','الرقم','الطرف','المبلغ','الاستحقاق','الحالة','القيود','مرفقات','إجراءات'],C.map(c=>[(c.kind=='r'?'وارد ':'صادر ')+esc(c.type||'شيك'),esc(c.no),esc(c.party||''),fmt(c.amt),c.due,`<span class="bd" style="background:${CST[c.status][1]};color:#fff">${CST[c.status][0]}</span>`,c.ent.map(i=>'<a class="lk" onclick="go(\'je\')">'+i+'</a>').join(' '),attBtn('c'+c.id),chActs(c)]),[3]):'<p>لا توجد أوراق</p>'}</div>
 <div class="card"><h2>الدفاتر (شيكات / كمبيالات / إيصالات)</h2><div class="row"><div><label>اسم الدفتر</label><input id="bk_n" placeholder="مثال: دفتر شيكات CIB"></div><div><label>النوع</label><select id="bk_k"><option value="chq">دفتر شيكات</option><option value="note">دفتر كمبيالات</option><option value="rcpt">دفتر إيصالات</option></select></div><div><label>من رقم</label><input id="bk_f" type="number"></div><div><label>إلى رقم</label><input id="bk_t" type="number"></div><div><button class="b g" onclick="bkAdd()">إضافة دفتر</button></div></div>
 ${DB.books.map(b=>`<h3>${esc(b.name)} (${b.from} - ${b.to})</h3><div style="display:flex;flex-wrap:wrap;gap:4px">${bkLeaves(b)}</div>`).join('')}<p style="color:#6b7686">أخضر = مستخدمة، رمادي = ملغاة (اضغط على ورقة لإلغائها أو إعادتها)</p></div>`};
function bkLeaves(b){let h='';for(let n=b.from;n<=b.to&&n-b.from<400;n++){const u=b.used[n];h+=`<a onclick="bkVoid('${b.id}',${n})" style="cursor:pointer;min-width:42px;text-align:center;padding:3px 5px;border-radius:5px;font-size:12px;border:1px solid #ccc;${u=='used'?'background:#27ae60;color:#fff':u=='void'?'background:#bbb;color:#fff':''}">${n}</a>`}return h}

function bkVoid(id,n){const b=DB.books.find(x=>x.id==id);if(b.used[n]=='used')return msg('الورقة مستخدمة');b.used[n]=b.used[n]=='void'?'':'void';save();R.bank()}
function chBook(){const k=$('ck_k').value,b=DB.books.find(x=>x.id==$('ck_b').value);if(k=='p'&&b){let n=b.from;while(b.used[n]&&n<=b.to)n++;$('ck_n').value=n>b.to?'':n}}
function chAdd(){try{if(!ok(2))return;chqAcc();const k=$('ck_k').value,p=party($('ck_p').value),no=$('ck_n').value.trim(),m=+$('ck_m').value;if(!p)throw new Error('اختر الطرف');if(!no||!(m>0))throw new Error('اكتب الرقم والمبلغ');if(chqs().some(c=>c.no==no&&c.kind==k&&c.party==p.name&&c.status!='void'))throw new Error('الرقم مسجل من قبل');
 const b=DB.books.find(x=>x.id==$('ck_b').value);if(k=='p'&&b){if(+no<b.from||+no>b.to)throw new Error('الرقم خارج الدفتر');if(b.used[no])throw new Error('الورقة مستخدمة أو ملغاة')}
 const c={id:'K'+Date.now(),kind:k,type:$('ck_t').value,no,party:p.name,pid:p.id,amt:m,due:$('ck_due').value,bank:$('ck_a').value,book:b?b.id:'',status:k=='r'?'under':'issued',ent:[]};
 chqJ(c,(k=='r'?'استلام ':'إصدار ')+c.type+' رقم '+no+' - '+p.name,k=='r'?[{acc:'1940',debit:m},{acc:'1701',credit:m,party:p.id}]:[{acc:'2801',debit:m,party:p.id},{acc:'2804',credit:m}]);
 if(b)b.used[no]='used';DB.cheques.push(c);logA('ورقة جديدة '+no);save();R.bank()}catch(e){msg(e.message)}}
function chActs(c){const B=(a,t,cl)=>`<button class="b ${cl||''}" onclick="chDo('${c.id}','${a}')">${t}</button> `;let h='';
 if(c.status=='under')h=B('collect','تحصيل','g')+B('bounce','ارتداد','r');else if(c.status=='bounced')h=B('retry','إعادة للتحصيل');else if(c.status=='issued')h=B('clear','صرف من البنك','g')+B('void','إلغاء','r');
 return h+`<button class="b" style="background:#c0392b" onclick="chRm('${c.id}')">حذف</button>`}
function chDo(id,a){try{if(!ok(2))return;chqAcc();const c=chqs().find(x=>x.id==id),m=c.amt,n=c.type+' '+c.no+' - '+c.party;
 if(a=='collect'){chqJ(c,'تحصيل '+n,[{acc:c.bank,debit:m},{acc:'1940',credit:m}]);c.status='collected'}
 else if(a=='bounce'){chqJ(c,'ارتداد '+n,[{acc:'1701',debit:m,party:c.pid},{acc:'1940',credit:m}]);c.status='bounced'}
 else if(a=='retry'){chqJ(c,'إعادة تقديم '+n,[{acc:'1940',debit:m},{acc:'1701',credit:m,party:c.pid}]);c.status='under'}
 else if(a=='clear'){chqJ(c,'صرف '+n,[{acc:'2804',debit:m},{acc:c.bank,credit:m}]);c.status='cleared'}
 else if(a=='void'){chqJ(c,'إلغاء '+n,[{acc:'2804',debit:m},{acc:'2801',credit:m,party:c.pid}]);c.status='void';const b=DB.books.find(x=>x.id==c.book);if(b)b.used[c.no]='void'}
 logA('ورقة '+c.no+' ← '+CST[c.status][0]);save();R.bank()}catch(e){msg(e.message)}}
function chRm(id){if(!ok(3))return;const c=chqs().find(x=>x.id==id);if(c.ent.length&&!confirm('الورقة لها قيود مرتبطة تبقى في اليومية. حذف الورقة من السجل فقط؟'))return;trashI('ورقة',c.no+' - '+c.party,[['cheques',c]]);DB.cheques=DB.cheques.filter(x=>x.id!=id);save();R.bank()}

/* global search */
function gsearch(q){q=(q||'').trim().toLowerCase();const out={};if(!q||!DB)return out;const num=q.replace(/,/g,'');const has=(...v)=>v.some(x=>x!=null&&String(x).toLowerCase().includes(q));
 const add=(k,r)=>{(out[k]=out[k]||[]).push(r)};
 const st=(e)=>DB.entries.includes(e)?'مرحّل':(DB.drafts||[]).includes(e)?'مسودة':'ملغي';
 [...DB.entries,...(DB.drafts||[]),...(DB.cancelled||[])].forEach(e=>{const tot=e.lines.reduce((s,l)=>s+l.debit,0);const hit=has(e.id,'قيد '+e.id,e.date,e.desc,e.ref,st(e),tot,fmt(tot))||e.lines.some(l=>has(accName(l.acc),(party(l.party)||{}).name,(proj(l.project)||{}).name,l.debit,l.credit));if(hit)add('القيود',{t:'قيد '+e.id+' | '+e.date+' | '+e.desc+' | '+fmt(tot)+' | '+st(e),go:()=>{go('je')}})});
 DB.parties.forEach(p=>{if(has(p.name,p.type,(DB.phones||{})[p.id]))add('الأطراف',{t:p.name+' ('+p.type+') | الرصيد '+fmt(balParty(p.id)),go:()=>go('party')})});
 DB.projects.forEach(p=>{if(has(p.name,p.value))add('المشاريع',{t:p.name+' | العقد '+fmt(p.value),go:()=>go('proj')})});
 DB.items.forEach(i=>{if(has(i.name,i.id,i.barcode,i.unit))add('الأصناف',{t:i.name+' ('+i.unit+')',go:()=>go('stock')})});
 DB.accounts.forEach(a=>{if(has(a.code,a.name))add('الحسابات',{t:a.code+' - '+a.name,go:()=>acctLedger(a.code)})});
 DB.stock.forEach(d=>{if(has(d.no,d.date,d.type=='in'?'إيداع':'صرف',d.total)||d.lines.some(l=>has((DB.items.find(i=>i.id==l.item)||{}).name)))add('مستندات المخزن',{t:(d.type=='in'?'إيداع ':'صرف ')+d.no+' | '+d.date+' | '+fmt(d.total||0),go:()=>go('stock')})});
 (DB.extracts||[]).forEach(x=>{if(has('مستخلص',x.no,x.date,x.status,(proj(x.project)||{}).name))add('المستخلصات',{t:'مستخلص '+x.no+' | '+((proj(x.project)||{}).name||'')+' | '+x.status,go:()=>go('ext')})});
 chqs().forEach(c=>{if(has(c.no,c.party,c.amt,c.due,CST[c.status][0]))add('الشيكات',{t:(c.kind=='r'?'وارد ':'صادر ')+c.no+' | '+(c.party||'')+' | '+fmt(c.amt)+' | '+CST[c.status][0],go:()=>go('bank')})});
 return out}

function replay(docs){const L=[];const ds=docs.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id);
 ds.forEach(d=>{d.lines.forEach((l,i)=>{if(d.type=='in'||d.type=='pin')L.push({id:d.id+'_'+i,item:l.item,doc:d.no,date:d.date,qty:+l.qty,cost:+l.price,rem:+l.qty});
  else if(d.mode=='avg'){const ls=L.filter(x=>x.item==l.item&&x.rem>1e-9);const tot=ls.reduce((q,x)=>q+x.rem,0),val=ls.reduce((q,x)=>q+x.rem*x.cost,0),need=+l.qty;if(need>tot+1e-9)throw new Error('الرصيد غير كافٍ للصنف: '+(ITEM(l.item)||{}).name+' (ينقص '+fmt(need-tot)+')');const av=tot?val/tot:0;l.alloc=[{layer:'avg',doc:'متوسط مرجح',qty:need,cost:av}];l.total=need*av;const f=tot?(tot-need)/tot:0;ls.forEach(x=>x.rem*=f)}
  else{let need=+l.qty;l.alloc=[];const pick=(l.layer&&l.layer!='fifo')?L.filter(x=>x.id==l.layer&&x.item==l.item):L.filter(x=>x.item==l.item&&x.rem>1e-9);
   for(const x of pick){if(need<=1e-9)break;const t=Math.min(x.rem,need);x.rem-=t;need-=t;l.alloc.push({layer:x.id,doc:x.doc,qty:t,cost:x.cost})}
   if(need>1e-9)throw new Error('الرصيد غير كافٍ للصنف: '+(ITEM(l.item)||{}).name+' (ينقص '+fmt(need)+')');l.total=l.alloc.reduce((s,a)=>s+a.qty*a.cost,0)}})});return L}

function chartSvg(){const {ms,rev,cost,cat}=chartData();const mx=Math.max(1,...ms.map(m=>Math.max(rev[m],cost[m])));const W=420,H=170,bw=22;

 ms.forEach((m,i)=>{const x=14+i*68,h1=Math.max(0,rev[m]/mx*(H-10)),h2=Math.max(0,cost[m]/mx*(H-10));s+=`<rect x="${x}" y="${H-h1}" width="${bw}" height="${h1}" fill="#017e84"/><rect x="${x+bw+2}" y="${H-h2}" width="${bw}" height="${h2}" fill="#c0392b"/><text x="${x+bw}" y="${H+14}" font-size="10" text-anchor="middle">${m.slice(5)}/${m.slice(2,4)}</text><title>${m}: إيراد ${fmt(rev[m])} / تكلفة ${fmt(cost[m])}</title>`});
 s+='</svg>';
 const cs=Object.entries(cat).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,6),tot=cs.reduce((q,x)=>q+x[1],0)||1,cols=['#714b67','#017e84','#e67e22','#2980b9','#27ae60','#c0392b'];
 const bars=cs.map((x,i)=>`<div style="margin:4px 0;font-size:12px"><div style="display:flex;justify-content:space-between"><span>${esc(accName(x[0]))}</span><span>${fmt(x[1])} (${Math.round(x[1]/tot*100)}%)</span></div><div style="background:#eee;border-radius:4px"><div style="width:${x[1]/tot*100}%;background:${cols[i]};height:10px;border-radius:4px"></div></div></div>`).join('')||'<p>لا توجد مصروفات.</p>';
 return `<div class="card"><h2>الإيرادات والتكاليف (آخر 6 أشهر)</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div>${s}<div style="font-size:12px"><span style="color:#017e84">■</span> إيراد &nbsp;<span style="color:#c0392b">■</span> تكلفة ومصروفات</div></div><div><b>أعلى بنود المصروفات</b>${bars}</div></div></div>`}

const smOn=k=>{const s=(DB.settings||{}).sm||{};return s[k]!==false};
function smCash(){const t=today(),cash=['1901','1902','1903','1920'].reduce((s,c)=>{const b=bal(c);return s+b.d-b.c},0);
 const d90=addDays(t,-90);let rc=0,pay=0;DB.entries.forEach(e=>{if(e.date<d90)return;e.lines.forEach(l=>{if(l.acc=='1701')rc+=l.credit;if(l.acc=='2801'||l.acc=='2802')pay+=l.debit;if(l.acc=='3201'||l.acc=='3701')pay+=l.debit})});
 const wIn=rc/13,wOut=pay/13;const cq=chqs();const W=[];let run=cash;
 for(let w=1;w<=4;w++){const a=addDays(t,(w-1)*7+1),b=addDays(t,w*7);const ci=cq.filter(c=>c.kind=='r'&&c.status=='under'&&c.due>=a&&c.due<=b).reduce((s,c)=>s+c.amt,0),co=cq.filter(c=>c.kind!='r'&&c.status=='issued'&&c.due>=a&&c.due<=b).reduce((s,c)=>s+c.amt,0);
  const inn=wIn*0.7+ci,out=wOut*0.7+co;run+=inn-out;W.push({w,inn,out,run})}return{cash,W,wIn,wOut}}
function smartList(){const A=[],t=today(),P=(k,sev,title,why,act)=>{if(smOn(k))A.push({k,sev,title,why,act})};
 try{const L=replay(DB.stock),q={};L.forEach(l=>{q[l.item]=(q[l.item]||0)+l.rem});const d90=addDays(t,-90),out={},lastOut={};
  DB.stock.filter(d=>d.type=='out').forEach(d=>d.lines.forEach(l=>{if(d.date>=d90)out[l.item]=(out[l.item]||0)+(+l.qty);if(!lastOut[l.item]||d.date>lastOut[l.item])lastOut[l.item]=d.date}));

   if(daily>0){const days=qq/daily;if(days<lead+7){const need=Math.ceil(daily*(lead+30)-qq);P('reorder',days<lead?'er':'wn','اطلب '+fmt(need)+' '+(i.unit||'')+' من '+i.name,'متوسط الصرف '+fmt(daily*30)+' '+(i.unit||'')+' شهرياً (آخر 90 يوم). الرصيد '+fmt(qq)+' يكفي حوالي '+Math.floor(days)+' يوم فقط، ومدة التوريد المقدرة '+lead+' يوم. الكمية المقترحة تغطي مدة التوريد + 30 يوم.','أنشئ أمر شراء بكمية '+fmt(need))}}
   if(qq>0&&!(out[i.id])){const firstIn=(DB.stock.filter(d=>d.type=='in'&&d.lines.some(l=>l.item==i.id)).map(d=>d.date).sort()[0])||t;if(firstIn<d90)P('slow','wn','صنف راكد: '+i.name,'رصيد '+fmt(qq)+' '+(i.unit||'')+' ولم يُصرف منه شيء منذ أكثر من 90 يوماً'+(lastOut[i.id]?' (آخر صرف '+lastOut[i.id]+')':''),'أوقف الشراء أو اعرضه للبيع/التحويل لمشروع آخر')}})}catch(e){}
 chqs().filter(c=>['under','issued'].includes(c.status)&&c.due<=addDays(t,7)).forEach(c=>P('chq',c.due<t?'er':'wn',(c.due<t?'شيك متأخر: ':'شيك مستحق قريباً: ')+(c.kind=='r'?'وارد':'صادر')+' '+c.no,(c.party||'')+' - '+fmt(c.amt)+' بتاريخ '+c.due,c.kind=='r'?'حصّل الشيك أو تابع العميل':'وفّر السيولة في الحساب'));
 DB.parties.filter(p=>p.type=='عميل').forEach(p=>{let b=0,old='',oldAmt=0;DB.entries.forEach(e=>e.lines.forEach(l=>{if(l.acc=='1701'&&l.party==p.id){b+=l.debit-l.credit;if(l.debit&&(!old||e.date<old)){old=e.date}}}));
  if(b>0.005&&old){const age=Math.round((new Date(t)-new Date(old))/864e5),lim=+p.limit||0;
   if(age>60||(lim&&b>lim))P('stop',age>60?'er':'wn','أوقف الائتمان عن العميل: '+p.name,'المتبقي '+fmt(b)+' وأقدم فاتورة مفتوحة منذ '+age+' يوم'+(lim&&b>lim?' والرصيد أعلى من حد الائتمان '+fmt(lim):''),'بيع بالدفع المقدم حتى السداد');
   else if(age>30)P('od','wn','تابع تحصيل: '+p.name,'المتبقي '+fmt(b)+' منذ '+age+' يوم','اتصل بالعميل / ابعث كشف حساب')}});
 const bu=DB.budgets||{};DB.projects.forEach(p=>{let rev=0,cost=0;DB.entries.forEach(e=>e.lines.forEach(l=>{if(l.project!=p.id)return;if(l.acc[0]=='4')rev+=l.credit-l.debit;if(l.acc[0]=='3')cost+=l.debit-l.credit}));const b=+bu[p.id]||0,v=+p.value||0;
  if(b){const pc=cost/b*100;if(pc>=100)P('over','er','المشروع '+p.name+' تجاوز الموازنة','التكلفة '+fmt(cost)+' من موازنة '+fmt(b)+' ('+Math.round(pc)+'%)','أوقف الصرف غير الضروري وراجع المستخلصات');

 /* مصروفات غير معتادة */
 const ms=lastMonths(4),cur=ms[3],prev=ms.slice(0,3),tot={};DB.entries.forEach(e=>e.lines.forEach(l=>{if(l.acc[0]!='3'||l.acc=='3102')return;const m=mthOf(e.date);if(!ms.includes(m))return;tot[l.acc]=tot[l.acc]||{};tot[l.acc][m]=(tot[l.acc][m]||0)+l.debit-l.credit}));

 const sh=Object.keys(files).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort()[0];const dom=new DOMParser().parseFromString(await get(sh),'text/xml'),rows=[];
 dom.querySelectorAll('row').forEach(r=>{const row=[];r.querySelectorAll('c').forEach(c=>{let col=0;(c.getAttribute('r')||'').replace(/[A-Z]+/,m=>{for(const ch of m)col=col*26+ch.charCodeAt(0)-64});col--;const t=c.getAttribute('t'),v=c.querySelector('v');let val=v?v.textContent:'';if(t=='s')val=ss[+val]||'';else if(t=='inlineStr')val=c.textContent;row[col>=0?col:row.length]=val});rows.push(Array.from(row,x=>x==null?'':x))});

function layerAvg(it){let L=[];try{L=replay(DB.stock)}catch(e){}const ls=L.filter(x=>x.item==it&&x.rem>1e-9);const q=ls.reduce((s,x)=>s+x.rem,0),v=ls.reduce((s,x)=>s+x.rem*x.cost,0);return{q,avg:q?v/q:0,last:(L.filter(x=>x.item==it).slice(-1)[0]||{}).cost||0}}

function bomStd(b,price){let m=0;b.comps.forEach(c=>{const p=price?price(c.item):layerAvg(c.item).avg||layerAvg(c.item).last;m+=c.qty*(1+(b.waste||0)/100)*p});const tot=m+(+b.labor||0)+(+b.oh||0);return{mat:m,total:tot,unit:b.qty?tot/b.qty:0}}

const CM_NUM=['entries','drafts','cancelled','stock','counts'];
function cmEq(a,b){return JSON.stringify(a)===JSON.stringify(b)}
function cmIsO(x){return x&&typeof x=='object'&&!Array.isArray(x)}
function cmIdArr(a){return Array.isArray(a)&&a.length>0&&a.every(x=>cmIsO(x)&&x.id!==undefined)}
function cmLabel(key,x){if(!x)return key;const t={entries:'قيد',drafts:'قيد (مسودة)',cancelled:'قيد ملغي',extracts:'مستخلص',stock:'مستند مخزن',cheques:'ورقة',parties:'طرف',items:'صنف',projects:'مشروع',accounts:'حساب',workers:'عامل',fa:'أصل ثابت',payroll:'مسير مرتبات'}[key]||key;const n=x.desc||x.name||(x.no!=null?(x.type?x.type+' رقم ':'رقم ')+x.no:'')||x.id;return t+' '+(x.id!=null&&x.desc?x.id+' ':'')+(typeof n=='string'?n.slice(0,40):n)}
function cmObj(b,l,r,path,C,key,rid){b=b||{};const out={};const ks=new Set([...Object.keys(b),...Object.keys(l),...Object.keys(r)]);
 for(const k of ks){const bv=b[k],lv=l[k],rv=r[k];
  if(cmEq(lv,rv)){if(lv!==undefined)out[k]=lv;continue}
  if(cmEq(lv,bv)){if(rv!==undefined)out[k]=rv;continue}
  if(cmEq(rv,bv)){if(lv!==undefined)out[k]=lv;continue}
  if(cmIsO(lv)&&cmIsO(rv)&&(path.length>0)&&k!='_cf'){out[k]=cmObj(cmIsO(bv)?bv:{},lv,rv,path.concat(k),C,key,rid);continue}
  if(C)C.push({key,rid,path:path.concat(k),mine:lv,theirs:rv});out[k]=lv}
 return out}
function cmTid(d){d=JSON.parse(JSON.stringify(d||{}));if(Array.isArray(d.accounts))d.accounts.forEach(a=>{if(a.id===undefined&&a.code!==undefined){a.id='ac_'+a.code;a._tid=1}});return d}
function cmMerge(base,local,remote,who){const r=cmMerge0(cmTid(base),cmTid(local),cmTid(remote),who);if(Array.isArray(r.data.accounts))r.data.accounts.forEach(a=>{if(a._tid){delete a.id;delete a._tid}});return r}
function cmMerge0(base,local,remote,who){const C=[],N=[],out={};const LN=new Set(),pend=[];
 base=base||{};
 const keys=new Set([...Object.keys(base),...Object.keys(local),...Object.keys(remote)]);
 for(const k of keys){const b=base[k],l=local[k],r=remote[k];
  if(cmEq(l,r)){if(l!==undefined)out[k]=l;continue}
  if(cmEq(l,b)){if(r!==undefined)out[k]=r;continue}
  if(cmEq(r,b)){if(l!==undefined)out[k]=l;continue}
  if(k=='seq'){out[k]=Math.max(+l||0,+r||0);continue}
  if(k=='log'&&Array.isArray(l)&&Array.isArray(r)){const bs=new Set((b||[]).map(x=>JSON.stringify(x))),rs=new Set(r.map(x=>JSON.stringify(x)));out[k]=r.concat(l.filter(x=>!rs.has(JSON.stringify(x))&&!bs.has(JSON.stringify(x)))).slice(-1500);continue}
  if(Array.isArray(l)&&Array.isArray(r)&&(cmIdArr(l)||l.length==0)&&(cmIdArr(r)||r.length==0)&&(Array.isArray(b)||b===undefined)){
   const bm=new Map((b||[]).map(x=>[x.id,x])),lm=new Map(l.map(x=>[x.id,x])),rm=new Map(r.map(x=>[x.id,x])),arr=[];
   for(const rec of r){const B=bm.get(rec.id),L=lm.get(rec.id);
    if(!B&&L&&!cmEq(L,rec)){arr.push(rec);const c=Object.assign({},L);LN.add(c);pend.push({key:k,rec:c,old:L.id})}
    else if(!B||!L&&!B){arr.push(rec)}
    else if(!L){if(cmEq(rec,B))continue;rec._cf=1;arr.push(rec);C.push({key:k,rid:rec.id,path:[k,rec.id],kind:'del',label:cmLabel(k,rec),mine:undefined,theirs:rec})}
    else{const cc=[];const m=cmObj(B,L,rec,[k,rec.id],cc,k,rec.id);if(cc.length){m._cf=1;cc.forEach(x=>{x.label=cmLabel(k,m);x.mineRec=L;x.theirsRec=rec});C.push(...cc)}arr.push(m)}}
   for(const L of l){if(rm.has(L.id))continue;const B=bm.get(L.id);
    if(!B){const c=Object.assign({},L);LN.add(c);arr.push(c)}
    else if(!cmEq(L,B)){const c=Object.assign({},L,{_cf:1});arr.push(c);C.push({key:k,rid:L.id,path:[k,L.id],kind:'deledit',label:cmLabel(k,L),mine:L,theirs:undefined})}}
   out[k]=arr;continue}
  if(cmIsO(l)&&cmIsO(r)){out[k]=cmObj(cmIsO(b)?b:{},l,r,[k],C,k,null);continue}
  if(Array.isArray(l)&&Array.isArray(r)&&!cmIdArr(l)&&!cmIdArr(r)&&l.every(x=>typeof x!='object')&&r.every(x=>typeof x!='object')){out[k]=Array.from(new Set([...r,...l]));continue}
  C.push({key:k,rid:null,path:[k],mine:l,theirs:r,label:k});out[k]=l}
 /* ترقيم المستندات الجديدة التي تصادم أرقام الجهاز الآخر */
 const mx=(ks)=>Math.max(0,...ks.flatMap(q=>(out[q]||[]).map(x=>+x.id||0)));
 let eM=Math.max(mx(['entries','drafts','cancelled']),(+out.seq||1)-1);const emap={},imap={},amap={};
 for(const p of pend){const old=p.old;let nw;
  if(['entries','drafts','cancelled'].includes(p.key)){nw=++eM;emap[old]=nw}
  else if(typeof old=='number'){nw=mx([p.key])+1}
  else{nw=old+'_'+Math.random().toString(36).slice(2,6);if(p.key=='items')imap[old]=nw}
  p.rec.id=nw;out[p.key].push(p.rec);N.push({key:p.key,old,nw,label:cmLabel(p.key,p.rec)});
  if(p.key=='stock')amap['s'+old]='s'+nw;if(['entries','drafts'].includes(p.key))amap['e'+old]='e'+nw}
 out.seq=Math.max(+out.seq||1,eM+1);
 /* تكرار رقم المستند (no) */
 for(const [k,gf] of [['stock',x=>x.type],['extracts',x=>x.project||'']]){const A=out[k]||[];const seen={};
  A.filter(x=>!LN.has(x)).forEach(x=>{if(x.no!=null)seen[gf(x)+'|'+x.no]=1});
  for(const x of A){if(!LN.has(x)||x.no==null)continue;const g=gf(x);if(seen[g+'|'+x.no]){const nn=Math.max(0,...A.filter(y=>gf(y)==g).map(y=>+y.no||0))+1;N.push({key:k,old:'رقم '+x.no,nw:'رقم '+nn,label:cmLabel(k,x)});x.no=nn}seen[g+'|'+x.no]=1}}
 /* إعادة ربط المراجع في المستندات الجديدة */
 for(const k of Object.keys(out)){if(!Array.isArray(out[k]))continue;for(const x of out[k]){if(!LN.has(x))continue;
  if(x.entry!=null&&emap[x.entry]!=null)x.entry=emap[x.entry];if(Array.isArray(x.ent))x.ent=x.ent.map(i=>emap[i]!=null?emap[i]:i);
  if(x.item!=null&&imap[x.item]!=null)x.item=imap[x.item];if(Array.isArray(x.lines))x.lines.forEach(l=>{if(l&&imap[l.item]!=null)l.item=imap[l.item]});
  if(k=='att'&&amap[x.ref])x.ref=amap[x.ref]}}
 /* سجل التعارضات */
 const log=(out.conflicts||[]).slice(),now=new Date().toISOString().slice(0,16).replace('T',' ');
 const open=[];
 for(const c of C){const o=Object.assign({cid:'c'+Date.now()+Math.random().toString(36).slice(2,5),at:now,by:who,st:'open'},c);log.push(o);open.push(o)}
 for(const n of N)log.push({cid:'n'+Date.now()+Math.random().toString(36).slice(2,5),at:now,by:who,st:'renum',key:n.key,old:n.old,nw:n.nw,label:n.label});
 out.conflicts=log.slice(-300);
 return{data:out,open,renum:N}}

async function cmResolve(cid,res,meta,d,A){try{
 const bs=cmBaseGet(cid),isM=clS.admin||(meta.users||[]).some(u=>u.u==clS.u&&u.role=='مدير');

 const r=rootLoad();r.companies[cid]=nm;rootSave(r);localStorage.setItem('cacc_co_'+cid,JSON.stringify(mg.data));
 const ss=clSt();ss[cid]={ver:res.ver,dg:'x'};clStSave(ss);cmBaseSet(cid,res.meta,res.data||{});
 const pd=JSON.parse(JSON.stringify(mg.data));if(pd.att)pd.att=pd.att.map(a=>a.url?Object.assign({},a,{data:''}):a);
 const r2=await rpc('api_push',Object.assign({p_cid:cid,p_u:clS.u||'',p_h:clS.h||'',p_meta:nm,p_data:pd,p_base:res.ver},A));

   const res=await rpc('api_push',Object.assign({p_cid:cid,p_u:clS.u||'',p_h:clS.h||'',p_meta:meta,p_data:d,p_base:st.ver||0},A));

function dataToBlob(d){const m=d.match(/^data:([^;,]*)(;base64)?,(.*)$/s);if(!m)return null;const bin=m[2]?atob(m[3]):decodeURIComponent(m[3]);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:m[1]||'application/octet-stream'})}
async function clUp(a,cid){const c=clCfg(),b=dataToBlob(a.data);if(!b)return;const ext=((a.name||'').match(/\.[A-Za-z0-9]{1,5}$/)||[''])[0];const path=cid+'/'+a.id+'-'+Math.random().toString(36).slice(2,8)+ext;const r=await fetch(c.url+'/storage/v1/object/'+c.bucket+'/'+path,{method:'POST',headers:{apikey:c.key,Authorization:'Bearer '+c.key,'Content-Type':b.type,'x-upsert':'false'},body:b});if(!r.ok)throw new Error('up '+r.status);a.url=c.url+'/storage/v1/object/public/'+c.bucket+'/'+path}
async function clUpAll(){if(!clS||!navigator.onLine)return;const cids=clS.admin?Object.keys(rootLoad().companies):[clS.cid];for(const cid of cids){const k='cacc_co_'+cid;let d;try{d=JSON.parse(localStorage.getItem(k))}catch(e){continue}if(!d||!d.att)continue;let ch=false;for(const a of d.att){if(a.data&&!a.url&&a.data.startsWith('data:')){try{await clUp(a,cid);ch=true}catch(e){}}}if(ch){localStorage.setItem(k,JSON.stringify(d));if(CUR&&CUR.cid==cid)DB=load()}}}
function clCard(){const c=clCfg(),s=clSt(),n=Object.keys(s).filter(k=>!k.startsWith('__')&&!k.startsWith('del_')).length;return `<div class="card"><h2>السحابة والمزامنة</h2><p style="margin-top:0">الحالة: <b>${clS?(clMsg||'متصل'):'غير مفعّل'}</b> | شركات متزامنة: ${n}</p><p><button class="b g" onclick="clTick(true)">مزامنة الآن</button></p><details><summary>ربط مشروع تخزين آخر (أكبر سعة)</summary><p style="font-size:13px;color:#6b7686">البرنامج يستخدم مشروع Supabase مجانياً (قاعدة 500MB وتخزين مرفقات 1GB). لربط مشروعك الخاص: أنشئ مشروعاً، شغّل ملف الإعداد SQL في محرر SQL، ثم ضع الرابط والمفتاح العام (anon) واسم الحاوية هنا. لا تضع مفتاح service_role أبداً.</p><div class="row"><div style="flex:2"><label>رابط المشروع</label><input id="cl_u" value="${c.url}"></div><div style="flex:2"><label>المفتاح العام (anon)</label><input id="cl_k" value="${c.key}"></div><div><label>حاوية المرفقات</label><input id="cl_b" value="${c.bucket}"></div></div><p><button class="b" onclick="clSaveCfg()">حفظ الربط</button> <button class="b l" onclick="clSchema()">تنزيل ملف إعداد SQL</button></p></details></div>`}
function clSaveCfg(){const o={url:$('cl_u').value.trim().replace(/\/+$/,''),key:$('cl_k').value.trim(),bucket:$('cl_b').value.trim()||'att'};if(!/^https:\/\//.test(o.url)||o.key.length<30)return alert('الرابط أو المفتاح غير صحيح');if(!confirm('تغيير مشروع السحابة؟ ستُرفع بيانات الأجهزة للمشروع الجديد عند أول مزامنة.'))return;localStorage.setItem('cacc_cloud',JSON.stringify(o));localStorage.removeItem('cacc_sync');alert('تم الحفظ. سجّل الخروج ثم ادخل كمدير النظام ليتم الرفع.')}
function clSchema(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([CL_SQL],{type:'text/plain'}));a.download='setup-supabase.sql';a.click()}

const CL_SQL="create table if not exists public.sys(k text primary key, v jsonb);\ncreate table if not exists public.co(cid text primary key, meta jsonb not null, data jsonb not null default '{}'::jsonb, ver bigint not null default 1, upd timestamptz default now());\nalter table public.sys enable row level security;\nalter table public.co enable row level security;\nrevoke all on public.sys, public.co from anon, authenticated;\n\ncreate or replace function public._role(p_cid text, p_u text, p_h text) returns text language plpgsql security definer set search_path=public as $f$\ndeclare m jsonb; r text; adm text;\nbegin\n if p_cid='admin' then\n  select v->>'admin' into adm from public.sys where k='root';\n  if adm is not null and adm=p_h then return 'admin'; end if;\n  return null;\n end if;\n select meta into m from public.co where cid=p_cid;\n if m is null then return null; end if;\n select x->>'role' into r from jsonb_array_elements(m->'users') x where x->>'u'=p_u and x->>'h'=p_h limit 1;\n return r;\nend $f$;\nrevoke all on function public._role(text,text,text) from public, anon, authenticated;\n\ncreate or replace function public.api_pull(p_cid text, p_u text, p_h text, p_admin text default null) returns jsonb language plpgsql security definer set search_path=public as $f$\ndeclare r text; c public.co%rowtype; adm text;\nbegin\n if p_admin is not null then\n  select v->>'admin' into adm from public.sys where k='root';\n  if adm is null or adm<>p_admin then return jsonb_build_object('err','auth'); end if;\n  r:='admin';\n else\n  r:=public._role(p_cid,p_u,p_h);\n end if;\n if r is null then return jsonb_build_object('err','auth'); end if;\n select * into c from public.co where cid=p_cid;\n if c.cid is null then return jsonb_build_object('err','none'); end if;\n return jsonb_build_object('role',r,'meta',c.meta,'data',c.data,'ver',c.ver);\nend $f$;\n\ncreate or replace function public.api_push(p_cid text, p_u text, p_h text, p_meta jsonb, p_data jsonb, p_base bigint, p_admin text default null) returns jsonb language plpgsql security definer set search_path=public as $f$\ndeclare r text; c public.co%rowtype; adm text; nv bigint;\nbegin\n if p_admin is not null then\n  select v->>'admin' into adm from public.sys where k='root';\n  if adm is null or adm<>p_admin then return jsonb_build_object('err','auth'); end if;\n  r:='admin';\n else\n  r:=public._role(p_cid,p_u,p_h);\n end if;\n if r is null then return jsonb_build_object('err','auth'); end if;\n select * into c from public.co where cid=p_cid for update;\n if c.cid is null then\n  if r<>'admin' then return jsonb_build_object('err','auth'); end if;\n  insert into public.co(cid,meta,data,ver) values(p_cid,p_meta,p_data,1);\n  return jsonb_build_object('ok',true,'ver',1);\n end if;\n if c.ver<>p_base then return jsonb_build_object('err','conflict','ver',c.ver,'meta',c.meta,'data',c.data); end if;\n nv:=c.ver+1;\n if r in ('admin','\u0645\u062f\u064a\u0631') then\n  update public.co set meta=p_meta,data=p_data,ver=nv,upd=now() where cid=p_cid;\n else\n  update public.co set data=p_data,ver=nv,upd=now() where cid=p_cid;\n end if;\n return jsonb_build_object('ok',true,'ver',nv);\nend $f$;\n\ncreate or replace function public.api_ver(p_cid text, p_u text, p_h text, p_admin text default null) returns jsonb language plpgsql security definer set search_path=public as $f$\ndeclare r text; adm text; v bigint;\nbegin\n if p_admin is not null then\n  select s.v->>'admin' into adm from public.sys s where k='root';\n  if adm is null or adm<>p_admin then return jsonb_build_object('err','auth'); end if;\n else\n  r:=public._role(p_cid,p_u,p_h);\n  if r is null then return jsonb_build_object('err','auth'); end if;\n end if;\n select ver into v from public.co where cid=p_cid;\n return jsonb_build_object('ver',v);\nend $f$;\n\ncreate or replace function public.api_sys_pull(p_admin text) returns jsonb language plpgsql security definer set search_path=public as $f$\ndeclare s jsonb; cs jsonb;\nbegin\n select v into s from public.sys where k='root';\n if s is null or s->>'admin'<>p_admin then return jsonb_build_object('err','auth'); end if;\n select coalesce(jsonb_agg(jsonb_build_object('cid',cid,'ver',ver)),'[]'::jsonb) into cs from public.co;\n return jsonb_build_object('root',s,'cos',cs);\nend $f$;\n\ncreate or replace function public.api_sys_push(p_admin text, p_root jsonb) returns jsonb language plpgsql security definer set search_path=public as $f$\ndeclare s jsonb; na text;\nbegin\n select v into s from public.sys where k='root';\n na:=coalesce(p_root->>'admin',p_admin);\n if s is null then\n  insert into public.sys(k,v) values('root', coalesce(p_root,'{}'::jsonb) || jsonb_build_object('admin',na));\n  return jsonb_build_object('ok',true);\n end if;\n if s->>'admin'<>p_admin then return jsonb_build_object('err','auth'); end if;\n update public.sys set v=coalesce(p_root,'{}'::jsonb) || jsonb_build_object('admin',na) where k='root';\n return jsonb_build_object('ok',true);\nend $f$;\n\ncreate or replace function public.api_del(p_cid text, p_admin text) returns jsonb language plpgsql security definer set search_path=public as $f$\ndeclare s jsonb;\nbegin\n select v into s from public.sys where k='root';\n if s is null or s->>'admin'<>p_admin then return jsonb_build_object('err','auth'); end if;\n delete from public.co where cid=p_cid;\n return jsonb_build_object('ok',true);\nend $f$;\n\ngrant execute on function public.api_pull(text,text,text,text), public.api_push(text,text,text,jsonb,jsonb,bigint,text), public.api_ver(text,text,text,text), public.api_sys_pull(text), public.api_sys_push(text,jsonb), public.api_del(text,text) to anon;\n\ninsert into storage.buckets(id,name,public,file_size_limit) values('att','att',true,15728640) on conflict (id) do nothing;\ndrop policy if exists att_ins on storage.objects;\ncreate policy att_ins on storage.objects for insert to anon with check (bucket_id='att');\n\ncreate table if not exists public.portal(tok text primary key, cid text not null, data jsonb not null, upd timestamptz default now());\nalter table public.portal enable row level security;\nrevoke all on public.portal from anon, authenticated;\ncreate or replace function public.api_portal_put(p_cid text, p_u text, p_h text, p_tok text, p_data jsonb, p_admin text default null) returns jsonb language plpgsql security definer set search_path=public as $f$\ndeclare r text; adm text;\nbegin\n if p_admin is not null then\n  select v->>'admin' into adm from public.sys where k='root';\n  if adm is null or adm<>p_admin then return jsonb_build_object('err','auth'); end if;\n else\n  r:=public._role(p_cid,p_u,p_h);\n  if r is null or r<>'\u0645\u062f\u064a\u0631' then return jsonb_build_object('err','auth'); end if;\n end if;\n if length(p_tok)<12 then return jsonb_build_object('err','tok'); end if;\n insert into public.portal(tok,cid,data,upd) values(p_tok,p_cid,p_data,now()) on conflict (tok) do update set data=excluded.data, upd=now() where public.portal.cid=p_cid;\n return jsonb_build_object('ok',true);\nend $f$;\ncreate or replace function public.api_portal_get(p_tok text) returns jsonb language sql security definer set search_path=public as $f$\n select coalesce((select jsonb_build_object('ok',true,'data',data,'upd',upd) from public.portal where tok=p_tok), jsonb_build_object('err','none'))\n$f$;\ngrant execute on function public.api_portal_put(text,text,text,text,jsonb,text) to anon;\ngrant execute on function public.api_portal_get(text) to anon;\n\ncreate or replace function public._lvl(p_meta jsonb, p_u text, p_h text, p_mod text) returns int language sql immutable as $f$\n select coalesce((select (x->'perms'->>p_mod)::int from jsonb_array_elements(p_meta->'users') x where x->>'u'=p_u and x->>'h'=p_h limit 1),2)\n$f$;\ncreate or replace function public._perm_ok(p_meta jsonb, p_u text, p_h text, p_old jsonb, p_new jsonb) returns text language plpgsql immutable as $f$\ndeclare k text; m text; mods text[]; ok boolean; mm text;\nbegin\n for k in select jsonb_object_keys(coalesce(p_old,'{}'::jsonb) || coalesce(p_new,'{}'::jsonb)) loop\n  if (p_old->k) is not distinct from (p_new->k) then continue; end if;\n  m := case k\n   when 'stock' then 'stock' when 'items' then 'stock' when 'counts' then 'stock'\n   when 'extracts' then 'ext' when 'boq' then 'ext'\n   when 'parties' then 'party' when 'projects' then 'proj' when 'accounts' then 'chart'\n   when 'cheques' then 'bank' when 'books' then 'bank' when 'bankrec' then 'bank'\n   when 'recon' then 'recon' when 'workers' then 'wages' when 'wlog' then 'wages'\n   when 'payroll' then 'payroll' when 'fa' then 'fa'\n   when 'budgets' then 'bud' when 'eta' then 'eta' when 'phones' then 'wa'\n   when 'whs' then 'wh' when 'whmov' then 'wh' when 'custody' then 'cus' when 'cusx' then 'cus' when 'emps' then 'payroll' when 'payruns' then 'payroll' when 'curs' then 'cur' when 'qt' then 'qt' when 'equip' then 'eq' when 'maint' then 'eq' when 'inst' then 'inst' when 'hr' then 'hr' when 'crm' then 'crm' when 'fac' then 'fac' when 'prodDocs' then 'fac' when 'pj' then 'pj' when 'jtpl' then 'je' when 'sl' then 'sl' when 'fn' then 'fn' when 'mc' then 'mc' when 'cat' then 'ct' when 'uom' then 'ct' when 'rt' then 'rt' when 'closedYears' then '#mgr'\n   when 'settings' then '#mgr'\n   when 'entries' then '#post'\n   else null end;\n  if m is null then continue; end if;\n  if m='#mgr' then return k; end if;\n  if m='#post' then\n   ok:=false;\n   foreach mm in array array['je','pay','trade','ext','sub','stock','bank','recon','rev','wages','pos','payroll','fa','cus','cur','eq','inst','qt','wh','hr','fac','crm','pj','sl','fn','rt'] loop\n    if public._lvl(p_meta,p_u,p_h,mm)>=2 then ok:=true; end if;\n   end loop;\n   if not ok then return k; end if;\n  elsif public._lvl(p_meta,p_u,p_h,m)<2 then return k;\n  end if;\n end loop;\n return null;\nend $f$;\ncreate or replace function public.api_push(p_cid text, p_u text, p_h text, p_meta jsonb, p_data jsonb, p_base bigint, p_admin text default null) returns jsonb language plpgsql security definer set search_path=public as $f$\ndeclare r text; c public.co%rowtype; adm text; nv bigint; bad text;\nbegin\n if p_admin is not null then\n  select v->>'admin' into adm from public.sys where k='root';\n  if adm is null or adm<>p_admin then return jsonb_build_object('err','auth'); end if;\n  r:='admin';\n else\n  r:=public._role(p_cid,p_u,p_h);\n end if;\n if r is null then return jsonb_build_object('err','auth'); end if;\n select * into c from public.co where cid=p_cid for update;\n if c.cid is null then\n  if r<>'admin' then return jsonb_build_object('err','auth'); end if;\n  insert into public.co(cid,meta,data,ver) values(p_cid,p_meta,p_data,1);\n  return jsonb_build_object('ok',true,'ver',1);\n end if;\n if c.ver<>p_base then return jsonb_build_object('err','conflict','ver',c.ver,'meta',c.meta,'data',c.data); end if;\n if r in ('admin','\u0645\u062f\u064a\u0631') then\n  update public.co set meta=p_meta,data=p_data,ver=c.ver+1,upd=now() where cid=p_cid;\n else\n  bad:=public._perm_ok(c.meta,p_u,p_h,c.data,p_data);\n  if bad is not null then return jsonb_build_object('err','perm','key',bad,'ver',c.ver); end if;\n  update public.co set data=p_data,ver=c.ver+1,upd=now() where cid=p_cid;\n end if;\n return jsonb_build_object('ok',true,'ver',c.ver+1);\nend $f$;\ngrant execute on function public.api_push(text,text,text,jsonb,jsonb,bigint,text) to anon;\nrevoke all on function public._lvl(jsonb,text,text,text), public._perm_ok(jsonb,text,text,jsonb,jsonb) from public, anon, authenticated;\n";
showLogin();if(localStorage.getItem('cacc_theme')=='dark')document.body.classList.add('dark');if(LANG=='en')setLang('en');else{setThemeLbl()}
