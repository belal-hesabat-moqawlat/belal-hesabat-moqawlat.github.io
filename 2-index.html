<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>برنامج حسابات المقاولات</title>
<style>
:root{--p:#714b67;--p2:#5b3b53;--t:#017e84;--bg:#f1f2f6;--ink:#212529;--mut:#6c757d;--line:#e3e6ec}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5}
#app{display:flex;min-height:100vh}
#side{width:236px;background:#2b2233;color:#e8e1ec;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:16px 18px;font-size:17px;font-weight:700;color:#fff;background:var(--p);display:flex;gap:8px;align-items:center}
.brand small{display:block;font-weight:400;font-size:11px;opacity:.8}
#nav{padding:8px 8px 20px}
.grp{font-size:11px;color:#a897b2;margin:14px 10px 4px;letter-spacing:.3px}
#nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:#e8e1ec;padding:9px 12px;border-radius:8px;cursor:pointer;font:inherit;text-align:right}
#nav button:hover{background:#3b2f45}
#nav button.on{background:var(--p);color:#fff;font-weight:600}
#nav .ic{width:22px;text-align:center}
#content{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;flex-wrap:wrap}
#burger{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:18px;padding:2px 10px;cursor:pointer}
#crumb{font-size:15px;color:var(--mut);flex:1}#crumb b{color:var(--ink);font-size:17px}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#who{background:#f1ecf3;color:var(--p2);padding:4px 12px;border-radius:20px;font-size:13px}
main{padding:20px;max-width:1200px;width:100%;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 2px #0000000a}
h2{margin:0 0 12px;font-size:16px;color:var(--p2);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #ced4da;border-radius:6px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid #017e8433;border-color:var(--t)}
button.b{background:var(--p);color:#fff;border:0;padding:8px 16px;border-radius:6px;cursor:pointer;font:inherit;font-weight:600}
button.b:hover{background:var(--p2)}
button.b.g{background:var(--t)}button.b.g:hover{background:#016166}
button.b.r{background:#fff;color:#c0392b;border:1px solid #e6b0aa}button.b.r:hover{background:#fdecea}
button.b.l{background:#fff;color:var(--p2);border:1px solid #d8cfdd}button.b.l:hover{background:#f6f2f8}
button:disabled{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
th{background:#f7f5f8;color:#495057;font-weight:600;font-size:12.5px;border-top:1px solid var(--line)}
tbody tr:hover td,tr:hover>td{background:#faf8fb}
td.n,th.n{text-align:left;direction:ltr;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;background:#f4eff6;color:var(--p2)}
.kpi{padding:14px 16px;border-radius:10px;background:#fff;border:1px solid var(--line);border-right:5px solid var(--p);color:var(--mut);font-size:13px}
.grid>.kpi:nth-child(2){border-right-color:#e67e22}.grid>.kpi:nth-child(3){border-right-color:#27ae60}.grid>.kpi:nth-child(4){border-right-color:var(--t)}.grid>.kpi:nth-child(5){border-right-color:#2980b9}.grid>.kpi:nth-child(6){border-right-color:#c0392b}
.kpi b{display:block;font-size:22px;color:var(--ink);direction:ltr;text-align:right;margin-top:4px}
.msg{padding:10px 14px;border-radius:8px;margin:8px 0;font-size:14px}
.msg:empty{display:none}
.ok{background:#e6f4ea;color:#1e6b34;border:1px solid #c7e5d0}.er{background:#fdecea;color:#a93226;border:1px solid #f3c6c1}
.bd{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;background:#e9ecef;color:#495057}.bd.g{background:#d9f2e3;color:#1e6b34}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:8px}
.row>div{flex:1;min-width:150px}
.scroll{overflow-x:auto}
.qd{display:inline-flex;gap:6px;margin-top:4px}.qd a{font-size:12px;color:var(--t);cursor:pointer;background:#e6f4f4;padding:1px 8px;border-radius:10px}.qd a:hover{background:#cfeaea}
.sec{font-size:13px;color:var(--p2);font-weight:700;margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
body.lg #side,body.lg .tools,body.lg #crumb{display:none}
body.lg #content{background:linear-gradient(135deg,#714b67,#2b2233);min-height:100vh;justify-content:center}
body.lg .top{background:none;border:0}
body.lg main .card{box-shadow:0 10px 40px #0005}
@media(max-width:860px){#side{position:fixed;right:-250px;top:0;z-index:20;transition:right .2s}#side.open{right:0}#burger{display:block}main{padding:12px}.top{padding:8px 12px}}
@media print{#side,.top,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none;border:0}#content{display:block}}
</style>
</head>

const chartFor=t=>t=='trader'?TRADER:CHART;
function typeOf(c){const f=c[0];return f=='1'?'أصل':f=='2'?(c<'27'?'حقوق ملكية':'التزام'):f=='3'?'تكلفة':'إيراد'}
function nature(c){return (c[0]=='1'||c[0]=='3')?'D':'C'}
let DB=null;
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d){d.boq=d.boq||{};d.extracts=d.extracts||[];d.items=d.items||[];d.stock=d.stock||[];d.settings=d.settings||{costing:'fifo'};d.last=d.last||{};d.counts=d.counts||[];return d}}catch(e){}
 return{boq:{},extracts:[],items:[],stock:[],settings:{costing:'fifo'},last:{},counts:[],accounts:chartFor(CUR?CUR.type:'contractor').map(a=>({code:a[0],name:a[1],header:a[2]=='H',contra:!!a[3]})),projects:[],parties:[],entries:[],seq:1}}
function save(){localStorage.setItem(KEY,JSON.stringify(DB))}
const $=id=>document.getElementById(id);
const fmt=n=>(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const acc=c=>DB.accounts.find(a=>a.code==c);
const accName=c=>{const a=acc(c);return a?a.code+' - '+a.name:c};
const proj=id=>DB.projects.find(p=>p.id==id);
const party=id=>DB.parties.find(p=>p.id==id);
const today=()=>new Date().toISOString().slice(0,10);
const leafs=()=>DB.accounts.filter(a=>!a.header&&!a.disabled);
function opts(list,sel,blank){return (blank?'<option value="">'+blank+'</option>':'')+list.map(x=>`<option value="${x[0]}" ${x[0]==sel?'selected':''}>${x[1]}</option>`).join('')}
const accOpts=(sel,filter)=>opts(leafs().filter(filter||(()=>true)).map(a=>[a.code,a.code+' - '+a.name]),sel);
const projOpts=(blank)=>opts(DB.projects.map(p=>[p.id,p.name]),'',blank||'— بدون مشروع —');
const partyOpts=(type,blank)=>opts(DB.parties.filter(p=>!type||p.type==type).map(p=>[p.id,p.name]),'',blank||'— اختر —');
function addEntry(date,desc,ref,lines){
 if(CUR&&CUR.role!='مدير'&&typeof lvl=='function'&&lvl(tab)<2)throw new Error('لا تملك صلاحية الإدخال في هذه الشاشة');
 lines=lines.filter(l=>(+l.debit||0)||(+l.credit||0)).map(l=>({acc:l.acc,debit:+l.debit||0,credit:+l.credit||0,project:l.project||'',party:l.party||''}));
 const d=lines.reduce((s,l)=>s+l.debit,0),c=lines.reduce((s,l)=>s+l.credit,0);
 if(Math.abs(d-c)>0.005)throw new Error('القيد غير متوازن: مدين '+fmt(d)+' دائن '+fmt(c));
 if(!(CUR&&CUR.type=='trader')&&lines.some(l=>/^3[1-6]/.test(l.acc)&&!l.project))throw new Error('المشروع إجباري على حسابات التكاليف (31-36)');
 if(!lines.length)throw new Error('القيد فارغ');
 const e={id:DB.seq++,date,desc,ref:ref||'',lines};DB.entries.push(e);save();return e}
function bal(code,filter){let d=0,c=0;DB.entries.forEach(e=>e.lines.forEach(l=>{if(l.acc==code&&(!filter||filter(l,e))){d+=l.debit;c+=l.credit}}));return{d,c}}
// balances including parent roll-up
function tb(from,to){const rows=DB.accounts.map(a=>({a,d:0,c:0}));
 DB.entries.forEach(e=>{if((from&&e.date<from)||(to&&e.date>to))return;e.lines.forEach(l=>{rows.forEach(r=>{if(!r.a.header?r.a.code==l.acc:l.acc.startsWith(r.a.code)){r.d+=l.debit;r.c+=l.credit}})})});
 return rows}

const R={};

  else if(d.mode=='avg'){const ls=L.filter(x=>x.item==l.item&&x.rem>1e-9);const tot=ls.reduce((q,x)=>q+x.rem,0),val=ls.reduce((q,x)=>q+x.rem*x.cost,0),need=+l.qty;if(need>tot+1e-9)throw new Error('الرصيد غير كافٍ للصنف: '+(ITEM(l.item)||{}).name+' (ينقص '+fmt(need-tot)+')');const av=tot?val/tot:0;l.alloc=[{layer:'avg',doc:'متوسط مرجح',qty:need,cost:av}];l.total=need*av;const f=tot?(tot-need)/tot:0;ls.forEach(x=>x.rem*=f)}
  else{let need=+l.qty;l.alloc=[];const pick=(l.layer&&l.layer!='fifo')?L.filter(x=>x.id==l.layer&&x.item==l.item):L.filter(x=>x.item==l.item&&x.rem>1e-9);
   for(const x of pick){if(need<=1e-9)break;const t=Math.min(x.rem,need);x.rem-=t;need-=t;l.alloc.push({layer:x.id,doc:x.doc,qty:t,cost:x.cost})}
   if(need>1e-9)throw new Error('الرصيد غير كافٍ للصنف: '+(ITEM(l.item)||{}).name+' (ينقص '+fmt(need)+')');l.total=l.alloc.reduce((s,a)=>s+a.qty*a.cost,0)}})});return L}

function saveDoc(t){let d;try{const rows=[...$('dl').rows].slice(1).filter(r=>r.cells[0].firstChild.value);if(!rows.length)throw new Error('أضف صنفاً واحداً على الأقل');

 if(lines.some(l=>!(l.qty>0)||(t=='in'&&!(l.price>0))))throw new Error('أكمل الكمية'+(t=='in'?' والسعر':''));
 const no=+$('d_no').value;if(DB.stock.some(x=>x.type==t&&x.no==no))throw new Error('رقم المستند مكرر');
 d={id:(DB.stock.reduce((m,x)=>Math.max(m,x.id),0))+1,type:t,no,date:$('d_d').value,lines,mode:DB.settings.costing};

 DB.stock.push(d);postDoc(d);save();sk='docs';R.stock();msg('تم ترحيل المستند ✔',1)}catch(e){if(d&&DB.stock.includes(d))DB.stock=DB.stock.filter(x=>x!==d);msg(e.message)}}

 addEntry('2026-01-31','إيجار المحل','',[{acc:'3702',debit:10000},{acc:'1901',credit:10000}]);
 DB.counts=[];const lines=[{item:'I001',qty:60,cost:800},{item:'I002',qty:30,cost:1200}];const total=84000;
 const e=addEntry('2026-01-31','تسوية جرد دوري','جرد',[{acc:'1601',debit:total},{acc:'3102',credit:total}]);DB.counts.push({id:1,date:'2026-01-31',lines,total,entry:e.id});
 save();go('dash')}
// ===== تحسينات الإدخال السريع والصلاحيات =====
const REM=['s_p','s_c','s_a','s_t','y_t','y_c','y_p','y_b','y_a','d_s','d_p','d_j','xf_c','x_p','ts_c','ts_pay','tp_s','tp_pay'],REMI=['ts_v','tp_v','d_v'];
function setD(el,k){const i=el.parentElement.previousElementSibling;const d=new Date();d.setDate(d.getDate()-k);i.value=d.toISOString().slice(0,10);i.dispatchEvent(new Event('input'))}
let _obs=null;
function enhance(){const m=$('main');if(!m)return;_obs&&_obs.disconnect();
 m.querySelectorAll('input[type=date]').forEach(i=>{if(i.dataset.q)return;i.dataset.q=1;i.insertAdjacentHTML('afterend','<span class="qd noprint"><a onclick="setD(this,0)">اليوم</a><a onclick="setD(this,1)">أمس</a></span>')});
 m.querySelectorAll('select').forEach(e=>{if(e.dataset.r||!REM.includes(e.id))return;e.dataset.r=1;const v=DB&&DB.last[e.id];if(v!==undefined&&[...e.options].some(o=>o.value==v)){e.value=v;e.dispatchEvent(new Event('change'))}});
 m.querySelectorAll('input[type=number]').forEach(e=>{if(e.dataset.r||!REMI.includes(e.id))return;e.dataset.r=1;const v=DB&&DB.last[e.id];if(v!==undefined)e.value=v});
 if(CUR&&CUR.role!='مدير'&&!['dash','rep','users'].includes(tab)){const L=lvl(tab);
  if(L<2){m.querySelectorAll('input,select,textarea').forEach(e=>e.disabled=true);m.querySelectorAll('button').forEach(b=>{if(!/^(R\.|sk=|go\(|exportXls|window\.print|rep\(|xOpen|xPrint|chEdit|skItem)/.test(b.getAttribute('onclick')||''))b.disabled=true})}
  if(L<3)m.querySelectorAll('button').forEach(b=>{if(/xApprove|xUnapprove|delE|delDoc|xDel|delAcc|togAcc|,1\)/.test(b.getAttribute('onclick')||''))b.disabled=true})}
 if(CUR&&CUR.role!='مدير'&&tab=='dash')m.querySelectorAll('button').forEach(b=>b.disabled=true);
 _obs&&_obs.observe(m,{childList:true,subtree:true})}
(()=>{const m=$('main');_obs=new MutationObserver(()=>enhance());_obs.observe(m,{childList:true,subtree:true});
 m.addEventListener('change',e=>{const t=e.target;if(DB&&REM.includes(t.id)){DB.last[t.id]=t.value;save()}});m.addEventListener('input',e=>{const t=e.target;if(DB&&REMI.includes(t.id)){DB.last[t.id]=t.value;save()}})})();
async function login(){const r=rootLoad();const code=$('l_c').value.trim().toLowerCase(),u=$('l_u').value.trim(),p=$('l_p').value;
 if(code=='admin'){const h=await sha(p);if(!r.admin){r.admin=h;rootSave(r);}else if(r.admin!=h)return lmsg('كلمة السر غير صحيحة');return adminScreen()}
 const co=r.companies[code];const h=await sha(p);const us=co&&co.users.find(x=>x.u==u&&x.h==h);
 if(!us)return lmsg('بيانات الدخول غير صحيحة');
 CUR={cid:code,name:co.name,user:u,role:us.role,type:co.type||'contractor',perms:us.perms||{}};KEY='cacc_co_'+code;DB=load();$('who').textContent=co.name+' | '+u;document.body.classList.remove('lg');go('dash')}
function lmsg(t){$('l_m').style.display='block';$('l_m').textContent=t}
function logout(){CUR=null;DB=null;KEY='';showLogin()}
function showLogin(){$('who').textContent='';document.body.classList.add('lg');
 $('main').innerHTML=`<div class="card" style="max-width:420px;margin:30px auto"><h2>تسجيل الدخول</h2><label>كود الشركة</label><input id="l_c" autocomplete="off"><label style="margin-top:8px">اسم المستخدم</label><input id="l_u"><label style="margin-top:8px">كلمة السر</label><input id="l_p" type="password" onkeydown="if(event.key=='Enter')login()"><p><button class="b" onclick="login()">دخول</button></p><div id="l_m" class="er msg" style="display:none"></div>
 <p style="font-size:12px;color:#6b7686">لإدارة الشركات: اكتب admin في كود الشركة (أول مرة: كلمة السر التي تكتبها تصبح كلمة سر مدير النظام).</p></div>`}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function coStats(k){try{const d=JSON.parse(localStorage.getItem('cacc_co_'+k))||{};return (d.entries||[]).length}catch(e){return 0}}
function adminScreen(){const r=rootLoad();CUR=null;DB=null;KEY='';document.body.classList.add('lg');$('who').innerHTML='مدير النظام';
 const ks=Object.keys(r.companies);const nu=ks.reduce((a,k)=>a+r.companies[k].users.length,0);const nc=ks.filter(k=>r.companies[k].type!='trader').length;
 const stat=(t,v)=>`<div class="card" style="flex:1;min-width:140px;margin:0;text-align:center"><div style="font-size:12px;color:#6b7686">${t}</div><div style="font-size:26px;font-weight:700;color:#714b67">${v}</div></div>`;
 $('main').innerHTML=`<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">${stat('عدد الشركات',ks.length)}${stat('مقاولات',nc)}${stat('تجارة',ks.length-nc)}${stat('إجمالي المستخدمين',nu)}</div>
 <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">لوحة تحكم النظام: الشركات</h2><button class="b g" onclick="showAddCo()">+ إضافة شركة</button></div>
 <div id="addco" style="display:none;margin-top:12px"></div><div id="l_m" class="msg er" style="display:none"></div>
 ${ks.length?`<div style="overflow:auto"><table><thead><tr><th>الكود</th><th>الاسم</th><th>النشاط</th><th>المستخدمون</th><th>القيود</th><th>إجراءات</th></tr></thead><tbody>${ks.map(k=>{const c=r.companies[k];return `<tr><td>${esc(k)}</td><td>${esc(c.name)}</td><td>${c.type=='trader'?'تجارة':'مقاولات'}</td><td>${c.users.length}</td><td>${coStats(k)}</td><td style="white-space:nowrap"><button class="b g" onclick="adminEnter('${esc(k)}')">دخول</button> <button class="b" onclick="adminUsers('${esc(k)}')">المستخدمون</button> <button class="b" onclick="adminRename('${esc(k)}')">تعديل الاسم</button> <button class="b" style="background:#c0392b" onclick="adminDelCo('${esc(k)}')">حذف</button></td></tr>`}).join('')}</tbody></table></div>`:'<p style="margin-top:12px">لا توجد شركات بعد. اضغط "إضافة شركة" أو جرّب البيانات التجريبية.</p>'}</div>
 <div class="card"><h2>أدوات النظام</h2><button class="b" onclick="adminPass()">تغيير كلمة سر مدير النظام</button></div>`}
function showAddCo(){const d=$('addco');d.style.display=d.style.display=='none'?'block':'none';d.innerHTML=`<div class="row"><div><label>كود الشركة (إنجليزي بدون مسافات)</label><input id="n_c"></div><div><label>اسم الشركة</label><input id="n_n"></div><div><label>نوع النشاط</label><select id="n_t"><option value="contractor">مقاولات</option><option value="trader">تجارة / محلات</option></select></div><div><label>مستخدم المدير</label><input id="n_u"></div><div><label>كلمة السر</label><input id="n_p" type="password"></div><div><button class="b g" onclick="addCo()">إنشاء</button></div></div>`}
function adminEnter(k){const r=rootLoad(),co=r.companies[k];if(!co)return;CUR={cid:k,name:co.name,user:'مدير النظام',role:'مدير',type:co.type||'contractor',perms:{},isAdmin:true};KEY='cacc_co_'+k;DB=load();$('who').innerHTML=esc(co.name)+' | مدير النظام <a style="background:#714b67;color:#fff;padding:2px 8px;border-radius:5px;margin-right:8px;cursor:pointer" onclick="adminScreen()">لوحة التحكم</a>';document.body.classList.remove('lg');go('dash')}
function adminUsers(k){const r=rootLoad(),co=r.companies[k];$('main').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between"><h2 style="margin:0">مستخدمو ${esc(co.name)} (${esc(k)})</h2><button class="b" onclick="adminScreen()">رجوع</button></div><div id="l_m" class="msg er" style="display:none"></div>
 <div style="overflow:auto"><table><thead><tr><th>المستخدم</th><th>الدور</th><th>إجراءات</th></tr></thead><tbody>${co.users.map((x,i)=>`<tr><td>${esc(x.u)}</td><td>${esc(x.role)}</td><td style="white-space:nowrap"><button class="b" onclick="adminReset('${esc(k)}',${i})">إعادة تعيين كلمة السر</button> <button class="b" onclick="adminRole('${esc(k)}',${i})">${x.role=='مدير'?'جعله محاسب':'جعله مدير'}</button> <button class="b" style="background:#c0392b" onclick="adminDelUser('${esc(k)}',${i})">حذف</button></td></tr>`).join('')}</tbody></table></div></div>
 <div class="card"><h2>مستخدم جديد</h2><div class="row"><div><label>الاسم</label><input id="u_u"></div><div><label>كلمة السر</label><input id="u_p" type="password"></div><div><label>الدور</label><select id="u_r"><option>محاسب</option><option>مدير</option></select></div><div><button class="b g" onclick="adminAddUser('${esc(k)}')">إضافة</button></div></div></div>`}
function aMsg(t){const m=$('l_m');if(m){m.style.display='block';m.textContent=t}}
async function adminReset(k,i){const p=prompt('كلمة السر الجديدة (4 أحرف على الأقل):');if(p===null)return;if(p.length<4)return aMsg('كلمة السر قصيرة');const r=rootLoad();r.companies[k].users[i].h=await sha(p);rootSave(r);adminUsers(k);aMsg('تم تغيير كلمة السر')}
function adminRole(k,i){const r=rootLoad(),us=r.companies[k].users;if(us[i].role=='مدير'&&us.filter(x=>x.role=='مدير').length<2)return aMsg('لازم يفضل مدير واحد على الأقل');us[i].role=us[i].role=='مدير'?'محاسب':'مدير';rootSave(r);adminUsers(k)}
function adminDelUser(k,i){const r=rootLoad(),us=r.companies[k].users;if(us[i].role=='مدير'&&us.filter(x=>x.role=='مدير').length<2)return aMsg('لا يمكن حذف المدير الوحيد');if(!confirm('حذف المستخدم '+us[i].u+'؟'))return;us.splice(i,1);rootSave(r);adminUsers(k)}
async function adminAddUser(k){const u=$('u_u').value.trim(),p=$('u_p').value;const r=rootLoad(),us=r.companies[k].users;if(!u||p.length<4)return aMsg('أكمل البيانات (كلمة السر 4 أحرف على الأقل)');if(us.find(x=>x.u==u))return aMsg('الاسم مستخدم');us.push({u,h:await sha(p),role:$('u_r').value,perms:{}});rootSave(r);adminUsers(k)}
function adminRename(k){const r=rootLoad();const n=prompt('اسم الشركة الجديد:',r.companies[k].name);if(!n||!n.trim())return;r.companies[k].name=n.trim();rootSave(r);adminScreen()}
function adminDelCo(k){if(!confirm('حذف الشركة '+k+' وكل بياناتها نهائيا؟'))return;if(prompt('اكتب كود الشركة للتأكيد:')!=k)return;const r=rootLoad();delete r.companies[k];rootSave(r);localStorage.removeItem('cacc_co_'+k);adminScreen()}
async function adminPass(){const p=prompt('كلمة سر مدير النظام الجديدة (4 أحرف على الأقل):');if(p===null)return;if(p.length<4)return aMsg('كلمة السر قصيرة');const r=rootLoad();r.admin=await sha(p);rootSave(r);aMsg('تم تغيير كلمة سر مدير النظام')}
async function addCo(){const r=rootLoad();const c=$('n_c').value.trim().toLowerCase(),n=$('n_n').value.trim(),u=$('n_u').value.trim(),p=$('n_p').value;
 const m=aMsg;if(!/^[a-z0-9_-]+$/.test(c)||c=='admin')return m('كود غير صالح');if(r.companies[c])return m('الكود مستخدم');if(!n||!u||p.length<4)return m('أكمل البيانات (كلمة السر 4 أحرف على الأقل)');
 r.companies[c]={name:n,type:$('n_t').value,users:[{u,h:await sha(p),role:'مدير',perms:{}}]};rootSave(r);adminScreen()}
const LV=[[0,'مخفي'],[1,'عرض فقط'],[2,'إدخال'],[3,'إدخال + اعتماد وحذف']];
R.users=()=>{const r=rootLoad(),co=r.companies[CUR.cid];const mods=TYPE_TABS[CUR.type||'contractor'].filter(k=>k!='dash'&&k!='users');
 $('main').innerHTML=`<div class="card"><h2>مستخدم جديد في ${co.name}</h2><div class="row"><div><label>الاسم</label><input id="u_u"></div><div><label>كلمة السر</label><input id="u_p" type="password"></div><div><label>الدور</label><select id="u_r"><option>محاسب</option><option>مدير</option></select></div><div><button class="b g" onclick="addUser()">إضافة</button></div></div><div id="msg"></div></div>
 ${co.users.map((x,ix)=>`<div class="card"><h2>${x.u} <span class="bd ${x.role=='مدير'?'g':''}">${x.role}</span></h2>${x.role=='مدير'?'<p style="margin:0;color:#6c757d">المدير يملك كل الصلاحيات.</p>':`<div class="grid">${mods.map(k=>`<div><label>${TABS.find(t=>t[0]==k)[1]}</label><select id="pm_${ix}_${k}">${LV.filter(l=>k!='rep'||l[0]<2).map(l=>`<option value="${l[0]}" ${Math.min((x.perms||{})[k]!==undefined?+x.perms[k]:2,k=='rep'?1:3)==l[0]?'selected':''}>${l[1]}</option>`).join('')}</select></div>`).join('')}</div><p><button class="b" onclick="savePerms(${ix})">حفظ الصلاحيات</button></p>`}</div>`).join('')}`};
function savePerms(ix){const r=rootLoad(),co=r.companies[CUR.cid],x=co.users[ix];const mods=TYPE_TABS[CUR.type||'contractor'].filter(k=>k!='dash'&&k!='users');x.perms={};mods.forEach(k=>x.perms[k]=+$('pm_'+ix+'_'+k).value);rootSave(r);msg('تم حفظ صلاحيات '+x.u+' ✔',1)}
async function addUser(){const r=rootLoad(),co=r.companies[CUR.cid],u=$('u_u').value.trim(),p=$('u_p').value;if(!u||p.length<4)return msg('أكمل البيانات');if(co.users.some(x=>x.u==u))return msg('الاسم مستخدم');co.users.push({u,h:await sha(p),role:$('u_r').value,perms:{}});rootSave(r);R.users()}
showLogin();
</script>
